<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290" role="img" aria-labelledby="title"><title id="title">The baseline ladder</title><rect x="0" y="0" width="860" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The baseline ladder</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Climb only as far as the gains justify (test MAE on the diabetes data, Section 20)</text><rect x="30" y="230" width="300" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="180.0" y="248.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1. trivial: predict the mean</text><text x="345.0" y="248.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">MAE 58.3</text><rect x="150" y="185" width="300" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="300.0" y="203.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2. simple rule: BMI only</text><text x="465.0" y="203.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">MAE 53.3</text><rect x="270" y="140" width="300" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="420.0" y="158.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3. simple model: linear regression</text><text x="585.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">MAE 45.1</text><rect x="390" y="95" width="300" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="540.0" y="113.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4. strong model: gradient boosting</text><text x="705.0" y="113.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">MAE 49.3</text><text x="430.0" y="278.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">here the simple model wins: complexity must earn its place</text></svg>