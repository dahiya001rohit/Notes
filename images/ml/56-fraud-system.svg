<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="title"><title id="title">Real-time payment fraud detection</title><defs><marker id="a0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker></defs><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Real-time payment fraud detection</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Score every payment in &lt; 50 ms; labels arrive weeks later and feed retraining</text><rect x="20" y="90" width="120" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="80.0" y="109.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">payment</text><text x="80.0" y="126.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">request</text><line x1="140.0" y1="118.0" x2="185.0" y2="118.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="190" y="85" width="210" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="295.0" y="109.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">fraud service</text><text x="295.0" y="126.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">features → model → rules</text><line x1="400.0" y1="118.0" x2="445.0" y2="118.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="450" y="70" width="120" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="510.0" y="85.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">allow</text><rect x="450" y="104" width="120" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="510.0" y="119.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">step-up (OTP)</text><rect x="450" y="138" width="120" height="30" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="510.0" y="153.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">block</text><rect x="190" y="200" width="210" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="295.0" y="217.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">online feature store</text><text x="295.0" y="232.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(user aggregates, ≈10 ms)</text><line x1="295.0" y1="200.0" x2="295.0" y2="153.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><rect x="20" y="200" width="140" height="50" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.8"/><text x="90.0" y="217.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">event stream</text><text x="90.0" y="232.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Kafka + Flink</text><line x1="160.0" y1="225.0" x2="188.0" y2="225.0" stroke="#0891b2" stroke-width="1.8" marker-end="url(#a0891b2)"/><rect x="640" y="70" width="310" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="795.0" y="87.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">labels: chargebacks, fraud reports,</text><text x="795.0" y="102.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">analyst reviews (days–weeks later)</text><line x1="795.0" y1="120.0" x2="795.0" y2="160.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="640" y="165" width="310" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="795.0" y="182.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">point-in-time training data</text><text x="795.0" y="197.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">→ weekly retrain → evaluation gate</text><path d="M640 205 L425 205 L425 140" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="425.0" y1="140.0" x2="403.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="532.0" y="222.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">new model (after the gate)</text><rect x="640" y="250" width="310" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="795.0" y="267.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">monitoring: score + feature drift,</text><text x="795.0" y="282.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">latency, false positives by segment</text><text x="300.0" y="300.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">fallback: if features are missing, rules decide</text></svg>