<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" role="img" aria-labelledby="title"><title id="title">Batch vs online serving</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Batch vs online serving</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Start with batch whenever the business can wait</text><text x="250.0" y="78.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">batch (nightly)</text><rect x="30" y="92" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="90.0" y="109.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">scheduler</text><text x="90.0" y="124.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(cron/Airflow)</text><line x1="150.0" y1="117.0" x2="180.0" y2="117.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="185" y="92" width="130" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="250.0" y="108.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">score all rows</text><text x="250.0" y="125.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">in chunks</text><line x1="315.0" y1="117.0" x2="345.0" y2="117.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="350" y="92" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="410.0" y="117.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">scores table</text><text x="250.0" y="172.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">fresh: hours old · simple · rerun on failure</text><text x="735.0" y="78.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">online (per request)</text><rect x="520" y="92" width="90" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="565.0" y="108.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">app /</text><text x="565.0" y="125.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">user</text><line x1="610.0" y1="117.0" x2="640.0" y2="117.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="645" y="92" width="180" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="735.0" y="108.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">API: validate →</text><text x="735.0" y="125.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">predict → log</text><line x1="825.0" y1="117.0" x2="855.0" y2="117.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="860" y="92" width="100" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="910.0" y="108.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">answer</text><text x="910.0" y="125.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">&lt; 50 ms</text><text x="735.0" y="172.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">fresh context · always on · p99 latency budget</text><text x="490.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">rolling out a new model</text><rect x="30" y="232" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="115.0" y="252.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">offline eval</text><line x1="200.0" y1="252.0" x2="218.0" y2="252.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="218" y="232" width="170" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="303.0" y="252.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">shadow</text><line x1="388.0" y1="252.0" x2="406.0" y2="252.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="406" y="232" width="170" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="491.0" y="252.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">canary 1–5%</text><line x1="576.0" y1="252.0" x2="594.0" y2="252.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="594" y="232" width="170" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="679.0" y="252.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">A/B test</text><line x1="764.0" y1="252.0" x2="782.0" y2="252.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="782" y="232" width="170" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="867.0" y="252.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto 