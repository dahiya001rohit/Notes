<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">Debug in this order: measure, locate, then fix</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Debug in this order: measure, locate, then fix</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Most fixes turn out to be data fixes</text><rect x="20" y="75" width="140" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="90.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1. baselines</text><rect x="20" y="122" width="140" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="90.0" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">beat a simple</text><text x="90.0" y="163.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">rule?</text><line x1="160.0" y1="95.0" x2="180.0" y2="95.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="180" y="75" width="140" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="250.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2. train vs val</text><rect x="180" y="122" width="140" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="250.0" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">under- or</text><text x="250.0" y="163.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">overfitting?</text><line x1="320.0" y1="95.0" x2="340.0" y2="95.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="340" y="75" width="140" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="410.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3. learning curve</text><rect x="340" y="122" width="140" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="410.0" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">would more</text><text x="410.0" y="163.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">data help?</text><line x1="480.0" y1="95.0" x2="500.0" y2="95.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="500" y="75" width="140" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="570.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4. slices</text><rect x="500" y="122" width="140" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="570.0" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">where does it</text><text x="570.0" y="163.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">fail?</text><line x1="640.0" y1="95.0" x2="660.0" y2="95.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="660" y="75" width="140" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="730.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5. worst errors</text><rect x="660" y="122" width="140" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="730.0" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">confident</text><text x="730.0" y="163.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">mistakes, labels</text><line x1="800.0" y1="95.0" x2="820.0" y2="95.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="820" y="75" width="140" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="890.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6. too good?</text><rect x="820" y="122" width="140" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="890.0" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">check for</text><text x="890.0" y="163.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">leakage</text><rect x="150" y="215" width="680" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="490.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7. fix data first: labels, examples for weak slices, features → then the model</text></svg>