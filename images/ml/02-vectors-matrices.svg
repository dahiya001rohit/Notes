<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">A vector drawn as an arrow; a dataset matrix X of houses by features; X times the weight vector w gives one prediction per house</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Vectors, matrices and X @ w</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Each row of X is one example's feature vector; X @ w scores every row at once.</text><line x1="60" y1="250" x2="230" y2="250" stroke="#0f172a" stroke-width="1.2"/><line x1="60" y1="250" x2="60" y2="90" stroke="#0f172a" stroke-width="1.2"/><line x1="60" y1="250" x2="180" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#a2563eb)"/><text x="186" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">a = [4, 3]</text><line x1="60" y1="250" x2="150" y2="130" stroke="#16a34a" stroke-width="3" marker-end="url(#a16a34a)"/><text x="146" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">b = [3, 4]</text><text x="65" y="75" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">cosine(a, b) = 24 / (5·5) = 0.96</text><text x="145" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">‖a‖ = 5 (length)</text><text x="360" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">X (3 houses × 3 features)</text><rect x="300" y="104" width="42" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="321.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">120</text><rect x="342" y="104" width="42" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="363.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="384" y="104" width="42" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="405.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">10</text><rect x="300" y="136" width="42" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="321.0" y="152.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="mid