<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title"><title id="title">k-nearest neighbours (k = 3)</title><rect x="0" y="0" width="880" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">k-nearest neighbours (k = 3)</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The new point takes the majority class of its 3 closest training points</text><circle cx="260.0" cy="174.0" r="62" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><circle cx="190.0" cy="174.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><circle cx="260.0" cy="110.0" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="400.0" cy="174.0" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="260.0" cy="206.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><circle cx="540.0" cy="78.0" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="470.0" cy="222.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><circle cx="610.0" cy="174.0" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="155.0" cy="238.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><circle cx="260.0" cy="174.0" r="9" fill="#d97706" stroke="#d97706" stroke-width="1.8"/><text x="260.0" y="174.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">?</text><line x1="260.0" y1="174.0" x2="190.0" y2="174.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="260.0" y1="174.0" x2="260.0" y2="206.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="260.0" y1="174.0" x2="260.0" y2="110.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><text x="640.0" y="110.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#0f172a">3 nearest: red, red, blue</text><text x="640.0" y="135.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#dc2626">→ predict red (2 votes to 1)</text><text x="640.0" y="175.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">k = 1: follows noise</text><text x="640.0" y="197.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">large k: averages away detail</text><text x="640.0" y="230.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#d97706">scale features first:</text><text x="640.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#d97706">distance treats units literally</text></svg>