<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="title"><title id="title">A scikit-learn pipeline: numeric columns go through an imputer and a scaler, categorical columns through an imputer and one-hot encoder; the results are joined and passed to the model</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A pipeline with ColumnTransformer</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">One object: fit() learns every step from training data; predict() applies the same steps to new data.</text><rect x="24" y="120" width="110" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="79.0" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">DataFrame</text><text x="79.0" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">X (raw columns)</text><rect x="180" y="76" width="130" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="245.0" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">numeric cols</text><text x="245.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">impute median</text><rect x="330" y="76" width="110" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="385.0" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">scale</text><text x="385.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">StandardScaler</text><rect x="180" y="166" width="130" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="245.0" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">categorical cols</text><text x="245.0" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">impute most frequent</text><rect x="330" y="166" width="110" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="385.0" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">one-hot</text><text x="385.0" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">handle_unknown</text><rect x="490" y="120" width="100" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="540.0" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">join</text><text x="540.0" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">columns</text><rect x="616" y="120" width="128" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="680.0" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">model</text><text x="680.0" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">LogisticRegression</text><line x1="136" y1="140" x2="176" y2="110" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="136" y1="160" x2="176" y2="190" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="312" y1="105" x2="326" y2="105" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="312" y1="195" x2="326" y2="195" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="442" y1="105" x2="486" y2="140" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="442" y1="195" x2="486" y2="160" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="592" y1="150" x2="612" y2="150" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><rect x="170" y="62" width="280" height="172" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/><text x="310" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">ColumnTransformer</text></svg>