<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="title"><title id="title">Naive Bayes: prior × likelihood of each word, per class</title><rect x="0" y="0" width="880" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Naive Bayes: prior × likelihood of each word, per class</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">email: &quot;free prize&quot;  ·  the class with the bigger score wins</text><rect x="60" y="80" width="110" height="38" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="115.0" y="99.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">class</text><rect x="170" y="80" width="100" height="38" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="220.0" y="99.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">prior</text><rect x="270" y="80" width="190" height="38" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="365.0" y="99.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">× P(free | class)</text><rect x="460" y="80" width="190" height="38" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="555.0" y="99.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">× P(prize | class)</text><rect x="650" y="80" width="140" height="38" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="720.0" y="99.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">= score</text><rect x="60" y="118" width="110" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="115.0" y="137.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">spam</text><rect x="170" y="118" width="100" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="220.0" y="137.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.4</text><rect x="270" y="118" width="190" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="365.0" y="137.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.30</text><rect x="460" y="118" width="190" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="555.0" y="137.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.20</text><rect x="650" y="118" width="140" height="38" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="720.0" y="137.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.024</text><rect x="60" y="156" width="110" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="115.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ham</text><rect x="170" y="156" width="100" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="220.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.6</text><rect x="270" y="156" width="190" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="365.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.02</text><rect x="460" y="156" width="190" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="555.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.005</text><rect x="650" y="156" width="140" height="38" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="720.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.00006</text><text x="440.0" y="220.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">P(spam | email) = 0.024 / (0.024 + 0.00006) ≈ 0.998</text><text x="440.0" y="252.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">&#x27;naive&#x27;: words treated as independent given the class · add logs to avoid underflow · smooth unseen words</text></svg>