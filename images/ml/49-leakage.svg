<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">Four ways the exam paper leaks</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Four ways the exam paper leaks</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Ask of every feature and every step: would I know this, at this moment, for a new case?</text><rect x="20" y="70" width="220" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="130.0" y="89.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">target</text><rect x="20" y="114" width="220" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="130.0" y="136.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">feature created after</text><text x="130.0" y="152.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">or because of the outcome</text><text x="130.0" y="192.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">retention_offer_sent</text><line x1="130.0" y1="202.0" x2="130.0" y2="222.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)"/><rect x="20" y="226" width="220" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="130.0" y="248.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#14532d">features as of</text><text x="130.0" y="264.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#14532d">prediction time</text><rect x="260" y="70" width="220" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="370.0" y="89.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">contamination</text><rect x="260" y="114" width="220" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="370.0" y="136.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">a step fitted on</text><text x="370.0" y="152.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">all rows, test included</text><text x="370.0" y="192.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">SelectKBest before CV</text><line x1="370.0" y1="202.0" x2="370.0" y2="222.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)"/><rect x="260" y="226" width="220" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="370.0" y="248.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#14532d">everything in a</text><text x="370.0" y="264.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#14532d">Pipeline, per fold</text><rect x="500" y="70" width="220" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="610.0" y="89.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">group</text><rect x="500" y="114" width="220" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="610.0" y="136.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">same person in</text><text x="610.0" y="152.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">train and test</text><text x="610.0" y="192.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">10 scans per patient</text><line x1="610.0" y1="202.0" x2="610.0" y2="222.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)"/><rect x="500" y="226" width="220" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="610.0" y="248.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#14532d">GroupKFold /</text><text x="610.0" y="264.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#14532d">split by patient</text><rect x="740" y="70" width="220" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="850.0" y="89.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">time</text><rect x="740" y="114" width="220" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="850.0" y="136.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">the future used to</text><text x="850.0" y="152.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">predict the past</text><text x="850.0" y="192.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">random split of sales</text><line x1="850.0" y1="202.0" x2="850.0" y2="222.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)"/><rect x="740" y="226" width="220" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="850.0" y="248.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#14532d">time-based split,</text><text x="850.0" y="264.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#14532d">shift before rolling</text></svg>