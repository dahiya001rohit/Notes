<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="title"><title id="title">Points scattered around a straight line; vertical dashed lines show each point's error from the line; the fit minimises the sum of squared errors</title><defs></defs><rect x="0" y="0" width="760" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Linear regression: the best straight line</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Training picks the slope and intercept that make the squared vertical gaps as small as possible.</text><line x1="70" y1="272" x2="490" y2="272" stroke="#0f172a" stroke-width="1.2"/><line x1="70" y1="272" x2="70" y2="92" stroke="#0f172a" stroke-width="1.2"/><line x1="70.0" y1="247.7" x2="490.0" y2="114.5" stroke="#2563eb" stroke-width="2.5"/><line x1="112.0" y1="218.0" x2="112.0" y2="234.38" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="112.0" cy="218.0" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/><line x1="154.0" y1="237.8" x2="154.0" y2="221.06" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="154.0" cy="237.8" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/><line x1="196.0" y1="192.79999999999998" x2="196.0" y2="207.74" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="196.0" cy="192.79999999999998" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/><line x1="238.0" y1="216.2" x2="238.0" y2="194.42" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="238.0" cy="216.2" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/><line x1="280.0" y1="165.79999999999998" x2="280.0" y2="181.09999999999997" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="280.0" cy="165.79999999999998" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/><line x1="322.0" y1="196.39999999999998" x2="322.0" y2="167.78" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="322.0" cy="196.39999999999998" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/><line x1="364.0" y1="140.6" x2="364.0" y2="154.46000000000004" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="364.0" cy="140.6" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/><line x1="406.0" y1="160.4" x2="406.0" y2="141.14000000000001" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="406.0" cy="160.4" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/><line x1="448.0" y1="111.80000000000001" x2="448.0" y2="127.82000000000002" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="448.0" cy="111.80000000000001" r="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/><text x="280.0" y="292" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">feature x (e.g. area)</text><text x="78" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">target y (price)</text><text x="530" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">ŷ = w·x + b</text><text x="530" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#dc2626">error = y − ŷ</text><text x="530" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">loss = mean(error²)</text><text x="530" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">w: change in y per unit x</text><text x="530" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">b: prediction when x = 0</text></svg>