<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Bagging: several trees trained independently on bootstrap samples and averaged. Boosting: trees trained one after another, each fitting the previous errors, and added together</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Bagging (random forest) vs boosting</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Parallel and averaged vs sequential and additive.</text><text x="30" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">Bagging: random forest</text><rect x="30" y="100" width="90" height="44" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="75.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">data</text><line x1="122" y1="122" x2="156" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><rect x="160" y="92" width="100" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="210.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">sample 1</text><line x1="262" y1="112" x2="290" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><rect x="294" y="92" width="70" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="329.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">tree 1</text><line x1="366" y1="112" x2="392" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><line x1="122" y1="122" x2="156" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><rect x="160" y="152" width="100" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="210.0" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">sample 2</text><line x1="262" y1="172" x2="290" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><rect x="294" y="152" width="70" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="329.0" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">tree 2</text><line x1="366" y1="172" x2="392" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><line x1="122" y1="122" x2="156" y2="232" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><rect x="160" y="212" width="100" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="210.0" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">sample 3</text><line x1="262" y1="232" x2="290" y2="232" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><rect x="294" y="212" width="70" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="329.0" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">tree 3</text><line x1="366" y1="232" x2="392" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><rect x="396" y="132" width="70" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="431.0" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">average</text><text x="30" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">independent deep trees → less variance</text><text x="490" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#7c3aed">Boosting: XGBoost, LightGBM</text><rect x="490" y="96" width="96" height="40" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="538.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">small tree 1</text><text x="598" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">fits y</text><line x1="538" y1="138" x2="538" y2="150" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a7c3aed)"/><rect x="490" y="154" width="96" height="40" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="538.0" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">small tree 2</text><text x="598" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">fits errors of 1</text><line x1="538" y1="196" x2="538" y2="208" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a7c3aed)"/><rect x="490" y="212" width="96" height="40" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="538.0" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">small tree 3</text><text x="598" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">fits errors of 1+2</text><text x="490" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">ŷ = t1 + lr·t2 + lr·t3 + …</text><text x="490" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">sequential shallow trees → less bias</text></svg>