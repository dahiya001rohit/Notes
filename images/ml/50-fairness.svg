<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Comparing groups: four questions, four metrics</title><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Comparing groups: four questions, four metrics</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Loan approvals; the model never sees the group, but a proxy (pincode) carries it</text><rect x="40" y="80" width="270" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="175.0" y="97.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">metric</text><rect x="310" y="80" width="210" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="415.0" y="97.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">asks</text><rect x="520" y="80" width="100" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="570.0" y="97.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">group A</text><rect x="620" y="80" width="100" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="670.0" y="97.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">group B</text><rect x="40" y="114" width="270" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="175.0" y="131.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">selection rate</text><rect x="310" y="114" width="210" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="415.0" y="131.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">share approved</text><rect x="520" y="114" width="100" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="570.0" y="131.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.450</text><rect x="620" y="114" width="100" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="670.0" y="131.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.379</text><rect x="40" y="148" width="270" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="175.0" y="165.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">TPR (equal opportunity)</text><rect x="310" y="148" width="210" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="415.0" y="165.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">good payers approved</text><rect x="520" y="148" width="100" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="570.0" y="165.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.552</text><rect x="620" y="148" width="100" height="34" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="670.0" y="165.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.470</text><rect x="40" y="182" width="270" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="175.0" y="199.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">FPR (with TPR: equalised odds)</text><rect x="310" y="182" width="210" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="415.0" y="199.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">non-payers approved</text><rect x="520" y="182" width="100" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="570.0" y="199.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.198</text><rect x="620" y="182" width="100" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="670.0" y="199.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.132</text><rect x="40" y="216" width="270" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="175.0" y="233.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">calibration by group</text><rect x="310" y="216" width="210" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="415.0" y="233.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">does 70% mean 70%?</text><rect x="520" y="216" width="100" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="570.0" y="233.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">check</text><rect x="620" y="216" width="100" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="670.0" y="233.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">check</text><rect x="770" y="80" width="180" height="170" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="860.0" y="108.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">You can&#x27;t have</text><text x="860.0" y="128.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">them all</text><text x="860.0" y="165.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">with different base</text><text x="860.0" y="180.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">rates, calibration and</text><text x="860.0" y="196.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">equal error rates</text><text x="860.0" y="211.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">conflict: choose with</text><text x="860.0" y="227.4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">legal + domain experts</text><text x="490.0" y="285.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Fix order: better data → drop/limit proxies → constrained training → group thresholds (if lawful)</text></svg>