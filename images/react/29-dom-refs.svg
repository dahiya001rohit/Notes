<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 290" width="980" height="290" role="img" aria-labelledby="title"><title id="title">Refs to DOM nodes</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Refs to DOM nodes</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">React fills ref.current with the real element during the commit; use it in handlers and effects</text><rect x="30" y="80" width="260" height="130" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="160.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">render</text><text x="44.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">const inputRef =</text><text x="44.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  useRef(null);</text><text x="44.0" y="155.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">&lt;input ref={inputRef} /&gt;</text><text x="44.0" y="170.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a"></text><text x="44.0" y="186.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">// current: null</text><rect x="340" y="80" width="280" height="130" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="480.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">commit</text><text x="354.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">React creates &lt;input&gt;</text><text x="354.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">and sets</text><text x="354.0" y="155.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">inputRef.current = &lt;input&gt;</text><text x="354.0" y="170.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a"></text><text x="354.0" y="186.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">(ref callbacks run here,</text><text x="354.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a"> cleanup on detach)</text><rect x="670" y="80" width="280" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="810.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">handlers / effects</text><text x="684.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">inputRef.current.focus()</text><text x="684.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">.select()  .scrollIntoView()</text><text x="684.0" y="155.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">.getBoundingClientRect()</text><text x="684.0" y="170.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">video.play() / pause()</text><line x1="290.0" y1="145.0" x2="338.0" y2="145.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="620.0" y1="145.0" x2="668.0" y2="145.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="490.0" y="245.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">React 19: pass ref to your own component as a normal prop: function TextField({ ref }) { return &lt;input ref={ref} /&gt; }</text><text x="490.0" y="270.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Never add or remove nodes React manages; use refs for focus, scroll, measure, media and non-React widgets</text></svg>