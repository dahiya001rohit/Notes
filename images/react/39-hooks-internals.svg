<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" role="img" aria-labelledby="title"><title id="title">Hooks are matched by call order, not by name</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Hooks are matched by call order, not by name</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">React keeps an array of slots per component; a cursor hands out slot 0, 1, 2 … on every render</text><rect x="30" y="80" width="300" height="170" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="180.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">component</text><text x="44.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useState(&#x27;Asha&#x27;)   // call 1</text><text x="44.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useState(30)       // call 2</text><text x="44.0" y="155.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useEffect(…)       // call 3</text><rect x="380" y="96" width="80" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="420.0" y="112.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">slot</text><rect x="460" y="96" width="180" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="550.0" y="112.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">value</text><rect x="380" y="128" width="80" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="420.0" y="144.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><rect x="460" y="128" width="180" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="550.0" y="144.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">&quot;Asha&quot;</text><rect x="380" y="160" width="80" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="420.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="460" y="160" width="180" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="550.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">30</text><rect x="380" y="192" width="80" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="420.0" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="460" y="192" width="180" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="550.0" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">effect + deps</text><line x1="330.0" y1="165.0" x2="376.0" y2="165.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="680" y="80" width="270" height="170" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="815.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">❌ if (show) useState(…)</text><text x="694.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">show = false next render:</text><text x="694.0" y="138.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">call 1 is now useState(30)</text><text x="694.0" y="153.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">→ it reads slot 0 = &quot;Asha&quot;</text><text x="694.0" y="168.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">React: &quot;Rendered more/fewer</text><text x="694.0" y="183.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a"> hooks than during the</text><text x="694.0" y="198.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a"> previous render&quot;</text><text x="490.0" y="290.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Rules of Hooks: call hooks at the top level of components and custom hooks, never in conditions, loops or after an early return</text></svg>