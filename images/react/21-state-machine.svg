<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">A form as a state machine</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A form as a state machine</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Exactly one status at a time; events move between states. Separate booleans would allow impossible mixes</text><rect x="15" y="126" width="150" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="90.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">empty</text><rect x="225" y="126" width="150" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="300.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">typing</text><rect x="455" y="126" width="150" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="530.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">submitting</text><rect x="705" y="66" width="150" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="780.0" y="90.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">success</text><rect x="705" y="206" width="150" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="780.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">error</text><line x1="165.0" y1="142.0" x2="225.0" y2="142.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="195.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">type</text><line x1="225.0" y1="160.0" x2="165.0" y2="160.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="195.0" y="150.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">clear</text><line x1="375.0" y1="150.0" x2="455.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="415.0" y="140.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">submit</text><line x1="605.0" y1="150.0" x2="705.0" y2="90.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="655.0" y="110.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">ok</text><line x1="605.0" y1="150.0" x2="705.0" y2="230.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="655.0" y="180.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">fail</text><path d="M 705 248 C 600 300, 360 300, 300 176" fill="none" stroke="#94a3b8" stroke-width="1.8"/><line x1="302.0" y1="182.0" x2="300.0" y2="176.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="520.0" y="296.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">type again</text><text x="490.0" y="60.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a"></text></svg>