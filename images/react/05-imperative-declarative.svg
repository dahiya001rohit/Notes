<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="title"><title id="title">Imperative vs declarative: steps vs a description</title><rect x="0" y="0" width="980" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Imperative vs declarative: steps vs a description</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">React: you describe the UI for the current state; React computes the DOM steps</text><rect x="30" y="76" width="440" height="220" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="250.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">Imperative (by hand)</text><text x="50.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">items.push(name)</text><text x="50.0" y="176.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">const li = document.createElement(&quot;li&quot;)</text><text x="50.0" y="192.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">li.textContent = name</text><text x="50.0" y="208.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">list.appendChild(li)</text><text x="50.0" y="225.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">count.textContent = `${n} items`</text><text x="50.0" y="241.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">checkout.disabled = false   // forgot? bug</text><rect x="510" y="76" width="440" height="220" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="730.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Declarative (React)</text><text x="530.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">function Cart({ items }) {</text><text x="530.0" y="176.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  return &lt;&gt;</text><text x="530.0" y="192.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">    &lt;p&gt;{items.length} items&lt;/p&gt;</text><text x="530.0" y="208.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">    &lt;ul&gt;{items.map(i =&gt; &lt;li&gt;{i}&lt;/li&gt;)}&lt;/ul&gt;</text><text x="530.0" y="225.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">    &lt;button disabled={!items.length}&gt;…</text><text x="530.0" y="241.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  &lt;/&gt;; }</text><text x="490.0" y="322.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">UI = f(state): same state in, same UI out. React diffs the new description against the old one and changes only what differs.</text></svg>