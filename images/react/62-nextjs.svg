ht="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">ƒ dynamic (rendered per request)</text><text x="594.0" y="289.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Turbopack is the default bundler</text></svg>