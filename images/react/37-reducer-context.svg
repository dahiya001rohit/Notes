<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" role="img" aria-labelledby="title"><title id="title">Reducer + context: a small store without a library</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Reducer + context: a small store without a library</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">TasksProvider owns the state; two contexts carry state and dispatch to any depth</text><rect x="330" y="72" width="320" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="490.0" y="92.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">TasksProvider</text><text x="344.0" y="116.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">const [tasks, dispatch] = useReducer(…)</text><rect x="120" y="190" width="300" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="270.0" y="210.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">TasksContext</text><text x="134.0" y="234.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">value = tasks (changes)</text><rect x="560" y="190" width="300" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="710.0" y="210.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">TasksDispatchContext</text><text x="574.0" y="234.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">value = dispatch (never changes)</text><line x1="430.0" y1="148.0" x2="300.0" y2="188.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="550.0" y1="148.0" x2="680.0" y2="188.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="270.0" y="286.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">TaskList: const tasks = useTasks()</text><text x="710.0" y="286.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">AddTask: const dispatch = useTasksDispatch()</text><text x="490.0" y="318.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Components that only dispatch never re-render when the tasks change</text></svg>