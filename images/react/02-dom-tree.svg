<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="title"><title id="title">From HTML text to pixels, and events travelling back up</title><defs><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="980" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">From HTML text to pixels, and events travelling back up</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The browser parses HTML into a DOM tree; CSS styles it; JavaScript edits the tree and listens for events</text><rect x="30" y="80" width="250" height="190" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="46.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#64748b">index.html (text)</text><text x="46.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">&lt;body&gt;</text><text x="46.0" y="148.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  &lt;h1&gt;Chai Point&lt;/h1&gt;</text><text x="46.0" y="164.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  &lt;ul id=&quot;menu&quot;&gt;</text><text x="46.0" y="180.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">    &lt;li&gt;Masala chai&lt;/li&gt;</text><text x="46.0" y="197.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">    &lt;li&gt;Ginger chai&lt;/li&gt;</text><text x="46.0" y="213.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  &lt;/ul&gt;</text><text x="46.0" y="229.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">&lt;/body&gt;</text><line x1="282.0" y1="175.0" x2="340.0" y2="175.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><text x="311.0" y="160.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">parse</text><rect x="560" y="80" width="90" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="605.0" y="97.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">body</text><rect x="410" y="150" width="110" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="465.0" y="167.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">h1</text><rect x="690" y="150" width="110" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="745.0" y="167.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ul#menu</text><rect x="600" y="222" width="110" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="655.0" y="239.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">li</text><rect x="780" y="222" width="110" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="835.0" y="239.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">li</text><line x1="605.0" y1="114.0" x2="465.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8"/><line x1="605.0" y1="114.0" x2="745.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8"/><line x1="745.0" y1="184.0" x2="655.0" y2="222.0" stroke="#94a3b8" stroke-width="1.8"/><line x1="745.0" y1="184.0" x2="835.0" y2="222.0" stroke="#94a3b8" stroke-width="1.8"/><text x="465.0" y="200.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">&quot;Chai Point&quot;</text><text x="655.0" y="272.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">&quot;Masala chai&quot;</text><text x="835.0" y="272.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">&quot;Ginger chai&quot;</text><text x="655.0" y="300.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">DOM tree: one object per element (text nodes in grey)</text><line x1="862.0" y1="220.0" x2="790.0" y2="186.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#adc2626)"/><line x1="718.0" y1="148.0" x2="640.0" y2="116.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#adc2626)"/><text x="905.0" y="205.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">click on li</text><text x="890.0" y="120.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">bubbles up:</text><text x="890.0" y="135.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">li → ul → body</text><text x="890.0" y="151.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">→ html → document</text><text x="490.0" y="335.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">JavaScript changes the tree (createElement, appendChild, textContent) → the browser repaints. React makes those calls for you.</text></svg>