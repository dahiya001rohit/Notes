<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="title"><title id="title">Context: a provider near the top of the tree makes a value available; any descendant that calls useContext reads it directly, skipping the components in between; when the value changes, every consumer re-renders</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Context skips the layers in between</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">&lt;AuthContext value={{ user }}&gt; … useAuth() anywhere below</text><rect x="270" y="66" width="220" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="380.0" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">AuthProvider</text><text x="380.0" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">value = { user: Asha }</text><rect x="40" y="132" width="160" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Header</text><rect x="40" y="188" width="160" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="120" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Nav</text><rect x="40" y="244" width="160" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="120" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">UserMenu ✓</text><rect x="480" y="132" width="160" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="560" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Page</text><rect x="480" y="188" width="160" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="560" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Checkout ✓</text><line x1="330" y1="124" x2="160" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="430" y1="124" x2="600" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="120" y1="170" x2="120" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><line x1="120" y1="226" x2="120" y2="242" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><line x1="560" y1="170" x2="560" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><path d="M300,124 C 280,200 240,250 202,262" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)" stroke-dasharray="5 3"/><path d="M490,100 C 720,110 730,200 644,206" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)" stroke-dasharray="5 3"/><text x="380" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">useAuth() reads the value directly</text><text x="380" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Header, Nav and Page don't pass user down</text></svg>