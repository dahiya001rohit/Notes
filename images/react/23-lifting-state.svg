<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="980" height="350" role="img" aria-labelledby="title"><title id="title">Lifting state up: one owner, props down, callbacks up</title><defs><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="980" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Lifting state up: one owner, props down, callbacks up</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Before: each panel owns isActive, so both can open. After: the parent owns activeIndex</text><rect x="30" y="80" width="420" height="220" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="240.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">before: two separate states</text><rect x="60" y="140" width="170" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="145.0" y="160.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Panel A</text><text x="74.0" y="184.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">isActive = true</text><rect x="250" y="140" width="170" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="335.0" y="160.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Panel B</text><text x="264.0" y="184.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">isActive = true</text><text x="240.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">both open: nobody coordinates them</text><rect x="530" y="80" width="420" height="220" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="740.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">after: lifted to the common parent</text><rect x="640" y="118" width="200" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="740.0" y="138.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Accordion</text><text x="654.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">activeIndex = 1</text><rect x="560" y="222" width="170" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="645.0" y="242.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Panel A</text><text x="574.0" y="266.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">isActive={false}</text><rect x="750" y="222" width="170" height="64" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="835.0" y="242.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Panel B</text><text x="764.0" y="266.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">isActive={true}</text><line x1="700.0" y1="174.0" x2="645.0" y2="220.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><line x1="780.0" y1="174.0" x2="835.0" y2="220.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><line x1="600.0" y1="220.0" x2="650.0" y2="176.0" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ad97706)"/><text x="572.0" y="186.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">onShow()</text><text x="490.0" y="330.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">props flow down (blue), requests flow up through callbacks (amber)</text></svg>