<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="980" height="350" role="img" aria-labelledby="title"><title id="title">An effect only starts and stops synchronising</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">An effect only starts and stops synchronising</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Every reactive value the effect reads goes in its dependency list; the linter checks it</text><rect x="30" y="80" width="216" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="138.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">mount</text><text x="44.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">connect(&#x27;general&#x27;)</text><line x1="246.0" y1="125.0" x2="264.0" y2="125.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="266" y="80" width="216" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="374.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">roomId → travel</text><text x="280.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">disconnect(&#x27;general&#x27;)</text><text x="280.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">connect(&#x27;travel&#x27;)</text><line x1="482.0" y1="125.0" x2="500.0" y2="125.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="502" y="80" width="216" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="610.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">re-render, same deps</text><text x="516.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">(nothing)</text><line x1="718.0" y1="125.0" x2="736.0" y2="125.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="738" y="80" width="216" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="846.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">unmount</text><text x="752.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">disconnect(&#x27;travel&#x27;)</text><rect x="60" y="200" width="380" height="30" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="250.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">value used in the effect</text><rect x="440" y="200" width="480" height="30" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="680.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">in the dependency list?</text><rect x="60" y="230" width="380" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="250.0" y="245.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">props, state, values computed from them</text><rect x="440" y="230" width="480" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="680.0" y="245.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">yes: they are reactive</text><rect x="60" y="260" width="380" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="250.0" y="275.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">objects/functions created during render</text><rect x="440" y="260" width="480" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="680.0" y="275.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">avoid: new every render → move inside the effect</text><rect x="60" y="290" width="380" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="250.0" y="305.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">setState functions, refs, module constants</text><rect x="440" y="290" width="480" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="680.0" y="305.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">no: they never change</text></svg>