<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Where the less common hooks run</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Where the less common hooks run</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">useLayoutEffect sits between the DOM update and the paint; useEffect runs after the paint</text><rect x="30" y="80" width="170" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="115.0" y="112.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">render</text><line x1="200.0" y1="112.0" x2="218.0" y2="112.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="220" y="80" width="170" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="305.0" y="103.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">commit</text><text x="305.0" y="120.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(DOM updated)</text><line x1="390.0" y1="112.0" x2="408.0" y2="112.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="410" y="80" width="170" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="495.0" y="103.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useLayoutEffect</text><text x="495.0" y="120.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">measure, adjust</text><line x1="580.0" y1="112.0" x2="598.0" y2="112.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="600" y="80" width="170" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="685.0" y="103.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">browser</text><text x="685.0" y="120.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">paints</text><line x1="770.0" y1="112.0" x2="788.0" y2="112.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="790" y="80" width="170" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="875.0" y="103.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useEffect</text><text x="875.0" y="120.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">subscriptions, fetch</text><rect x="70" y="176" width="220" height="30" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="180.0" y="191.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">hook</text><rect x="290" y="176" width="620" height="30" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="600.0" y="191.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">job</text><rect x="70" y="206" width="220" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="180.0" y="221.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useId()</text><rect x="290" y="206" width="620" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="600.0" y="221.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">unique ids for label/aria pairs, same on server and client</text><rect x="70" y="236" width="220" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="180.0" y="251.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useSyncExternalStore</text><rect x="290" y="236" width="620" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="600.0" y="251.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">subscribe to data outside React (browser APIs, stores) without tearing</text><rect x="70" y="266" width="220" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="180.0" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useImperativeHandle</text><rect x="290" y="266" width="620" height="30" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="600.0" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">expose a few methods (focus, clear) through a ref instead of the DOM node</text></svg>