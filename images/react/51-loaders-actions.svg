<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Router data: load before render, mutate, then revalidate</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Router data: load before render, mutate, then revalidate</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Loaders of all matching routes run in parallel; actions handle &lt;Form&gt; submissions</text><rect x="24" y="80" width="172" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="110.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">navigate</text><text x="38.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">/teas</text><line x1="196.0" y1="120.0" x2="214.0" y2="120.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="216" y="80" width="172" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="302.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">loaders (parallel)</text><text x="230.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">user() ∥ teas()</text><line x1="388.0" y1="120.0" x2="406.0" y2="120.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="408" y="80" width="172" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="494.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">render</text><text x="422.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useLoaderData()</text><line x1="580.0" y1="120.0" x2="598.0" y2="120.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="600" y="80" width="172" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="686.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">&lt;Form method=post&gt;</text><text x="614.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">action({ request })</text><line x1="772.0" y1="120.0" x2="790.0" y2="120.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="792" y="80" width="172" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="878.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">revalidate</text><text x="806.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">re-run loaders</text><text x="490.0" y="196.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useNavigation().state: &#x27;idle&#x27; | &#x27;loading&#x27; | &#x27;submitting&#x27;  →  pending UI (&quot;Adding…&quot;)</text><text x="490.0" y="224.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useFetcher(): submit without navigating (likes, inline edits)  ·  throw a Response → route errorElement</text><text x="490.0" y="256.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">redirect(&#x27;/teas&#x27;) from a loader or action sends the user elsewhere</text></svg>