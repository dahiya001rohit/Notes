<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" role="img" aria-labelledby="title"><title id="title">Virtualisation: render only what&#x27;s in the window</title><rect x="0" y="0" width="980" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Virtualisation: render only what&#x27;s in the window</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">10,000 rows × 30 px = a 300,000 px spacer; only ~20 rows exist in the DOM</text><rect x="80" y="76" width="220" height="240" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="190.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">spacer (300,000 px)</text><rect x="100" y="110" width="180" height="18" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><rect x="100" y="130" width="180" height="18" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><rect x="100" y="150" width="180" height="18" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><rect x="100" y="170" width="180" height="18" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><rect x="100" y="190" width="180" height="18" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><rect x="80" y="210" width="220" height="60" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 4"/><rect x="100" y="216" width="180" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="190.0" y="223.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">row 4995</text><rect x="100" y="232" width="180" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="190.0" y="239.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">row 5000</text><rect x="100" y="248" width="180" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="190.0" y="255.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">row 5005</text><text x="320.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">← viewport: rows 5,000–5,009</text><text x="320.0" y="255.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">   + 5 overscan each side</text><text x="560.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">start = floor(scrollTop / rowHeight) − overscan</text><text x="560.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">end = ceil((scrollTop + height) / rowHeight) − 1 + overscan</text><text x="560.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">each row: position absolute; top = index × rowHeight</text><text x="760.0" y="236.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">measured in Chrome: 10,001 elements (plain)</text><text x="760.0" y="252.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">vs 17 elements (TanStack Virtual)</text></svg>