<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="980" height="350" role="img" aria-labelledby="title"><title id="title">TanStack Query: a cache keyed by query keys</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">TanStack Query: a cache keyed by query keys</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Components subscribe to keys; requests are shared, cached, refetched when stale, invalidated after mutations</text><rect x="30" y="80" width="230" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="145.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">&lt;TeaCount /&gt;</text><text x="44.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useQuery([&#x27;teas&#x27;])</text><rect x="30" y="170" width="230" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="145.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">&lt;TeaList /&gt;</text><text x="44.0" y="214.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useQuery([&#x27;teas&#x27;])</text><rect x="340" y="90" width="300" height="140" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="490.0" y="110.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">QueryClient cache</text><text x="360.0" y="140.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">[&#x27;teas&#x27;]        → data, fresh/stale</text><text x="360.0" y="155.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">[&#x27;tea&#x27;, 7]      → data</text><text x="360.0" y="171.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">[&#x27;teas&#x27;,{sort}] → data</text><rect x="720" y="120" width="230" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="835.0" y="140.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">server</text><text x="734.0" y="164.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">GET /teas  (once)</text><line x1="260.0" y1="115.0" x2="338.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="260.0" y1="205.0" x2="338.0" y2="180.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="640.0" y1="160.0" x2="718.0" y2="160.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="490.0" y="270.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useMutation → onSuccess: invalidateQueries({ queryKey: [&#x27;teas&#x27;] }) → active [&#x27;teas&#x27;] queries refetch</text><text x="490.0" y="298.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">staleTime 0 (default): served from cache, refetched in the background on mount / focus / reconnect</text></svg>