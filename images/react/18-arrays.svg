<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Array updates without mutation</title><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Array updates without mutation</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Left: methods that change the array in place. Right: what to use on state instead</text><rect x="60" y="80" width="150" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="135.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">goal</text><rect x="210" y="80" width="190" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="305.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">❌ mutates</text><rect x="400" y="80" width="520" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="660.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">✅ returns a new array</text><rect x="60" y="112" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">add</text><rect x="210" y="112" width="190" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="305.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">push, unshift</text><rect x="400" y="112" width="520" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="660.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[...arr, x]   [x, ...arr]</text><rect x="60" y="144" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">remove</text><rect x="210" y="144" width="190" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="305.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">splice, pop, shift</text><rect x="400" y="144" width="520" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="660.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">arr.filter(x =&gt; x.id !== id)</text><rect x="60" y="176" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="192.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">change one</text><rect x="210" y="176" width="190" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="305.0" y="192.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">arr[i] = x</text><rect x="400" y="176" width="520" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="660.0" y="192.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">arr.map(x =&gt; x.id === id ? {...x, done: true} : x)</text><rect x="60" y="208" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="224.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">insert at i</text><rect x="210" y="208" width="190" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="305.0" y="224.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">splice(i, 0, x)</text><rect x="400" y="208" width="520" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="660.0" y="224.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">arr.toSpliced(i, 0, x)</text><rect x="60" y="240" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="256.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">sort / reverse</text><rect x="210" y="240" width="190" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="305.0" y="256.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">sort(), reverse()</text><rect x="400" y="240" width="520" height="32" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="660.0" y="256.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">arr.toSorted(cmp)   arr.toReversed()</text><text x="490.0" y="300.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">[...arr] copies the list, not the objects inside: copy the object you change too</text></svg>