<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">State vs ref vs a plain variable</title><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">State vs ref vs a plain variable</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Which ones survive a re-render, and which ones cause one?</text><rect x="40" y="76" width="190" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><rect x="230" y="76" width="200" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="330.0" y="93.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">plain variable</text><rect x="430" y="76" width="190" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="525.0" y="93.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">state (useState)</text><rect x="620" y="76" width="300" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="770.0" y="93.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ref (useRef)</text><rect x="40" y="110" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="127.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">survives re-renders?</text><rect x="230" y="110" width="200" height="34" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="330.0" y="127.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">no (reset each render)</text><rect x="430" y="110" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="525.0" y="127.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">yes</text><rect x="620" y="110" width="300" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="770.0" y="127.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">yes</text><rect x="40" y="144" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">changing it re-renders?</text><rect x="230" y="144" width="200" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="330.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">no</text><rect x="430" y="144" width="190" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="525.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">yes</text><rect x="620" y="144" width="300" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="770.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">no</text><rect x="40" y="178" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">how to change</text><rect x="230" y="178" width="200" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="330.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x = 1</text><rect x="430" y="178" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="525.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">setX(1)  (replace)</text><rect x="620" y="178" width="300" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="770.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ref.current = 1  (mutate)</text><rect x="40" y="212" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">read during render?</text><rect x="230" y="212" width="200" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="330.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">yes</text><rect x="430" y="212" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="525.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">yes</text><rect x="620" y="212" width="300" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="770.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">no (only in handlers/effects)</text><rect x="40" y="246" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="263.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">use for</text><rect x="230" y="246" width="200" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="330.0" y="263.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">temporary values</text><rect x="430" y="246" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="525.0" y="263.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">what&#x27;s on screen</text><rect x="620" y="246" width="300" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="770.0" y="263.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">timer ids, DOM nodes, latest values</text></svg>