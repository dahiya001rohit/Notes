<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" role="img" aria-labelledby="title"><title id="title">Urgent updates vs transitions</title><rect x="0" y="0" width="980" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Urgent updates vs transitions</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Typing stays instant; the expensive update renders in the background and can be interrupted</text><text x="40.0" y="90.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">urgent</text><rect x="130" y="74" width="100" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="180.0" y="89.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">input: c</text><rect x="250" y="74" width="100" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="300.0" y="89.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">input: ch</text><rect x="370" y="74" width="100" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="420.0" y="89.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">input: cha</text><text x="40.0" y="150.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#d97706">transition</text><rect x="130" y="134" width="160" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4"/><text x="210.0" y="149.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">render list &#x27;c&#x27;</text><text x="300.0" y="149.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#dc2626">✗ abandoned</text><rect x="390" y="134" width="120" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4"/><text x="450.0" y="149.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">list &#x27;ch&#x27; ✗</text><rect x="560" y="134" width="200" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="660.0" y="149.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">render list &#x27;cha&#x27; ✓ commit</text><text x="780.0" y="149.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">isPending: true → false</text><rect x="60" y="196" width="280" height="26" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="200.0" y="209.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">API</text><rect x="340" y="196" width="580" height="26" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="630.0" y="209.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">use it for</text><rect x="60" y="222" width="280" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="200.0" y="235.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useTransition / startTransition</text><rect x="340" y="222" width="580" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="630.0" y="235.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">updates you trigger (tabs, filters, navigation), with isPending</text><rect x="60" y="248" width="280" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="200.0" y="261.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useDeferredValue(value)</text><rect x="340" y="248" width="580" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="630.0" y="261.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a value you receive; renders the old value first</text><rect x="60" y="274" width="280" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="200.0" y="287.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">&lt;Activity mode=&#x27;hidden&#x27;&gt;</text><rect x="340" y="274" width="580" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="630.0" y="287.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">hide UI but keep its state and DOM (effects cleaned up)</text><rect x="60" y="300" width="280" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="200.0" y="313.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">&lt;ViewTransition&gt; (19.3)</text><rect x="340" y="300" width="580" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="630.0" y="313.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">animate changes made in transitions with the View Transitions API</text></svg>