<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">useReducer: handlers describe what happened; the reducer decides the new state</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useReducer: handlers describe what happened; the reducer decides the new state</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">All update logic lives in one pure function you can test without React</text><rect x="30" y="80" width="250" height="130" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="155.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">event handler</text><text x="44.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">dispatch({</text><text x="44.0" y="140.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  type: &#x27;deleted&#x27;,</text><text x="44.0" y="156.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  id: 3</text><text x="44.0" y="172.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">})</text><rect x="330" y="80" width="320" height="130" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="490.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">reducer(state, action)</text><text x="344.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">switch (action.type) {</text><text x="344.0" y="140.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  case &#x27;deleted&#x27;:</text><text x="344.0" y="156.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">    return state.filter(…)</text><text x="344.0" y="172.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  …  default: never }</text><rect x="700" y="80" width="250" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="825.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">next state</text><text x="825.0" y="124.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">React stores it and</text><text x="825.0" y="140.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">re-renders with it</text><line x1="280.0" y1="145.0" x2="328.0" y2="145.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="650.0" y1="145.0" x2="698.0" y2="145.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="305.0" y="132.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">action</text><text x="490.0" y="248.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">actions.reduce(reducer, initialState) gives the same final state every time: that&#x27;s why it&#x27;s called a reducer</text></svg>