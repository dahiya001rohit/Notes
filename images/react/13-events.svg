<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="980" height="350" role="img" aria-labelledby="title"><title id="title">How React handles a click</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">How React handles a click</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">One listener on the root container; React walks your component path and calls handlers in bubbling order</text><rect x="30" y="80" width="250" height="200" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="155.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">your components</text><text x="44.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">&lt;div onClick={openCard}&gt;</text><text x="44.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  &lt;h3&gt;Masala chai&lt;/h3&gt;</text><text x="44.0" y="155.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  &lt;button</text><text x="44.0" y="170.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">    onClick={addToCart}&gt;</text><text x="44.0" y="186.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">    Add</text><text x="44.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  &lt;/button&gt;</text><text x="44.0" y="217.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">&lt;/div&gt;</text><rect x="330" y="80" width="280" height="200" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="470.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">React (at the root)</text><text x="344.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">1. native click on &lt;button&gt;</text><text x="344.0" y="138.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">   bubbles to the root container</text><text x="344.0" y="153.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">2. React finds the path:</text><text x="344.0" y="168.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">   root → div → button</text><text x="344.0" y="183.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">3. wraps it in a SyntheticEvent</text><text x="344.0" y="198.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">4. calls handlers:</text><text x="344.0" y="213.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">   addToCart(e), then openCard(e)</text><rect x="660" y="80" width="290" height="200" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="805.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">your handler can…</text><text x="674.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">e.target         where it started</text><text x="674.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">e.currentTarget  this element</text><text x="674.0" y="155.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">e.stopPropagation()</text><text x="674.0" y="170.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">                 skip openCard</text><text x="674.0" y="186.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">e.preventDefault()</text><text x="674.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">                 no page reload</text><line x1="280.0" y1="180.0" x2="328.0" y2="180.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="610.0" y1="180.0" x2="658.0" y2="180.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="490.0" y="318.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Pass the function: onClick={handleClick}  ✅      not its result: onClick={handleClick()}  ❌ (runs during render)</text></svg>