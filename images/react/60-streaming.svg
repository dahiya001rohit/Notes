-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">renderToPipeableStream / renderToReadableStream stream; renderToString can&#x27;t wait (fallbacks only)</text></svg>