<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Streaming SSR with Suspense</title><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Streaming SSR with Suspense</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">One response, several chunks: the shell first, slow sections when their data is ready</text><line x1="70.0" y1="250.0" x2="910.0" y2="250.0" stroke="#94a3b8" stroke-width="1.8"/><line x1="70.0" y1="244.0" x2="70.0" y2="256.0" stroke="#94a3b8" stroke-width="1.8"/><text x="70.0" y="272.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0 ms</text><line x1="770.0" y1="244.0" x2="770.0" y2="256.0" stroke="#94a3b8" stroke-width="1.8"/><text x="770.0" y="272.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">50 ms</text><rect x="70" y="80" width="380" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="260.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">chunk 1: the shell (onShellReady)</text><text x="84.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospa