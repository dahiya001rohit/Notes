"12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">en-US ₹184,999.50</text><text x="526.0" y="151.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">de-DE 184.999,50 ₹</text><text x="526.0" y="166.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">8:00 pm Kolkata</text><rect x="742" y="76" width="214" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="849.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">direction</text><text x="756.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">dir=&quot;rtl&quot; for Arabic,</text><text x="756.0" y="135.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Urdu, Hebrew</text><text x="756.0" y="151.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">margin-inline-start</text><text x="756.0" y="166.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">flips automatically</text><text x="490.0" y="262.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Never build sentences by concatenation or with n === 1 ? … : …; never hard-code currency symbols or date order</text><text x="490.0" y="290.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Format dates with an explicit time zone on the server, or render them in the browser, to avoid hydration mismatches</text></svg>