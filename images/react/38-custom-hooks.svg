<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" role="img" aria-labelledby="title"><title id="title">Custom hooks share logic, not state</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Custom hooks share logic, not state</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Each component that calls useOnlineStatus() gets its own state and its own subscription</text><rect x="330" y="72" width="320" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="490.0" y="92.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">function useOnlineStatus()</text><text x="344.0" y="116.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">const [on, setOn] = useState(…)</text><text x="344.0" y="131.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useEffect(subscribe to online/offline)</text><text x="344.0" y="147.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">return on</text><rect x="80" y="220" width="300" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="230.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">StatusBar</text><text x="230.0" y="264.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useOnlineStatus() → its own state</text><rect x="600" y="220" width="300" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="750.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">SaveButton</text><text x="750.0" y="264.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useOnlineStatus() → its own state</text><line x1="420.0" y1="192.0" x2="300.0" y2="218.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="560.0" y1="192.0" x2="680.0" y2="218.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/></svg>