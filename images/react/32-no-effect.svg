<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="title"><title id="title">Do you need an effect?</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Do you need an effect?</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Ask these questions in order; only the last one leads to useEffect</text><rect x="60" y="72" width="380" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="250.0" y="93.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">computed from props/state?</text><line x1="440.0" y1="93.0" x2="500.0" y2="93.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="470.0" y="84.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">yes</text><rect x="504" y="72" width="420" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="714.0" y="84.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">calculate during render</text><text x="714.0" y="101.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(useMemo if expensive)</text><line x1="250.0" y1="114.0" x2="250.0" y2="126.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="60" y="126" width="380" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="250.0" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">caused by a user action?</text><line x1="440.0" y1="147.0" x2="500.0" y2="147.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="470.0" y="138.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">yes</text><rect x="504" y="126" width="420" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="714.0" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">do it in the event handler</text><line x1="250.0" y1="168.0" x2="250.0" y2="180.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="60" y="180" width="380" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="250.0" y="201.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">reset when a prop changes?</text><line x1="440.0" y1="201.0" x2="500.0" y2="201.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="470.0" y="192.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">yes</text><rect x="504" y="180" width="420" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="714.0" y="201.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">give the component a key</text><line x1="250.0" y1="222.0" x2="250.0" y2="234.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="60" y="234" width="380" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="250.0" y="255.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tell the parent about a change?</text><line x1="440.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="470.0" y="246.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">yes</text><rect x="504" y="234" width="420" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="714.0" y="246.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">call the callback in the handler,</text><text x="714.0" y="263.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">or lift the state up</text><line x1="250.0" y1="276.0" x2="250.0" y2="288.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="60" y="288" width="380" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="250.0" y="309.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">sync with something OUTSIDE React?</text><line x1="440.0" y1="309.0" x2="500.0" y2="309.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="470.0" y="300.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">yes</text><rect x="504" y="288" width="420" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="714.0" y="309.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">✅ useEffect with cleanup</text></svg>