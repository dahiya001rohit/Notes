<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 396" width="980" height="396" role="img" aria-labelledby="title"><title id="title">The JavaScript on every line of React code</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="396" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The JavaScript on every line of React code</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Left: the feature. Right: where React code uses it</text><rect x="30" y="72" width="180" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="120.0" y="91.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">destructuring</text><rect x="226" y="72" width="400" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="426.0" y="91.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">const { name, price } = props</text><line x1="626.0" y1="91.0" x2="660.0" y2="91.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="672.0" y="91.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">reading props, useState pairs</text><rect x="30" y="120" width="180" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="120.0" y="139.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">spread</text><rect x="226" y="120" width="400" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="426.0" y="139.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">{ ...user, age: 31 }   [...cart, item]</text><line x1="626.0" y1="139.0" x2="660.0" y2="139.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="672.0" y="139.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">updating state without mutating</text><rect x="30" y="168" width="180" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="120.0" y="187.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">map / filter</text><rect x="226" y="168" width="400" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="426.0" y="187.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">items.map(i =&gt; &lt;li key={i.id}&gt;…)</text><line x1="626.0" y1="187.0" x2="660.0" y2="187.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="672.0" y="187.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">turning data into lists of UI</text><rect x="30" y="216" width="180" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="120.0" y="235.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">arrow functions</text><rect x="226" y="216" width="400" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="426.0" y="235.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">onClick={() =&gt; setOpen(true)}</text><line x1="626.0" y1="235.0" x2="660.0" y2="235.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="672.0" y="235.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">event handlers, callbacks</text><rect x="30" y="264" width="180" height="38" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.8"/><text x="120.0" y="283.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ternary / &amp;&amp; / ??</text><rect x="226" y="264" width="400" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="426.0" y="283.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">{ok ? &lt;Done/&gt; : &lt;Spinner/&gt;}</text><line x1="626.0" y1="283.0" x2="660.0" y2="283.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="672.0" y="283.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">choosing what to show</text><rect x="30" y="312" width="180" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="120.0" y="331.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">import / export</text><rect x="226" y="312" width="400" height="38" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="426.0" y="331.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">export default function App()</text><line x1="626.0" y1="331.0" x2="660.0" y2="331.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="672.0" y="331.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">one component per file</text><text x="490.0" y="372.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">Mutating (push, sort, obj.x = 1) keeps the same reference, so React thinks nothing changed: copy instead.</text></svg>