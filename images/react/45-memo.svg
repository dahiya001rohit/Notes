<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Memoisation tools and the React Compiler</title><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Memoisation tools and the React Compiler</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">All of them reuse a previous result when the inputs are the same (compared with Object.is)</text><rect x="24" y="76" width="230" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="139.0" y="93.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tool</text><rect x="254" y="76" width="290" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="399.0" y="93.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">caches</text><rect x="544" y="76" width="412" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="750.0" y="93.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">use when</text><rect x="24" y="110" width="230" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="139.0" y="127.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">memo(Component)</text><rect x="254" y="110" width="290" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="399.0" y="127.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">the whole render of a child</text><rect x="544" y="110" width="412" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="750.0" y="127.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a slow child re-renders with equal props</text><rect x="24" y="144" width="230" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="139.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useMemo(fn, deps)</text><rect x="254" y="144" width="290" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="399.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a computed value</text><rect x="544" y="144" width="412" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="750.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">an expensive calculation, or a value that must stay stable</text><rect x="24" y="178" width="230" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="139.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useCallback(fn, deps)</text><rect x="254" y="178" width="290" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="399.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a function object</text><rect x="544" y="178" width="412" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="750.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">passing callbacks to memo&#x27;d children or effect deps</text><rect x="24" y="212" width="230" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="139.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">React Compiler (build time)</text><rect x="254" y="212" width="290" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="399.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">values, callbacks and JSX automatically</text><rect x="544" y="212" width="412" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="750.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">default for new projects (v1.0, Oct 2025)</text><text x="490.0" y="270.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">memo is defeated by unstable props: onSelect={() =&gt; …} or options={{…}} are new every render</text><text x="490.0" y="296.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">compiled code: const $ = _c(2); if ($[0] !== t1) { …build JSX…; $[0] = t1; $[1] = t2 } else t2 = $[1]</text></svg>