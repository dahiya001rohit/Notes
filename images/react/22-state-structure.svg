<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" width="980" height="372" role="img" aria-labelledby="title"><title id="title">Five rules for a good state structure</title><rect x="0" y="0" width="980" height="372" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Five rules for a good state structure</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Minimal and unambiguous: if you can compute it, don&#x27;t store it</text><rect x="30" y="76" width="180" height="40" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="120.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">rule</text><rect x="210" y="76" width="330" height="40" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="375.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">❌ before</text><rect x="540" y="76" width="410" height="40" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="745.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">✅ after</text><rect x="30" y="116" width="180" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="120.0" y="136.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">group related</text><rect x="210" y="116" width="330" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="375.0" y="136.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">const [x, setX]; const [y, setY]</text><rect x="540" y="116" width="410" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="745.0" y="136.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">const [pos, setPos] = useState({ x, y })</text><rect x="30" y="156" width="180" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="120.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">no contradictions</text><rect x="210" y="156" width="330" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="375.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">isSending, isSent</text><rect x="540" y="156" width="410" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="745.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">status: &#x27;typing&#x27; | &#x27;sending&#x27; | &#x27;sent&#x27;</text><rect x="30" y="196" width="180" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="120.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">no redundancy</text><rect x="210" y="196" width="330" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="375.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">first, last, fullName</text><rect x="540" y="196" width="410" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="745.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">fullName = first + &#x27; &#x27; + last  (derived)</text><rect x="30" y="236" width="180" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="120.0" y="256.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">no duplication</text><rect x="210" y="236" width="330" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="375.0" y="256.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">items + selectedItem (a copy)</text><rect x="540" y="236" width="410" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="745.0" y="256.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">items + selectedId → items.find(…)</text><rect x="30" y="276" width="180" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="120.0" y="296.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">no deep nesting</text><rect x="210" y="276" width="330" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="375.0" y="296.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">place.children[0].children[2]…</text><rect x="540" y="276" width="410" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="745.0" y="296.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">placesById[id] = { title, childIds }</text><text x="490.0" y="345.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Stale copies and contradictions are the most common source of &#x27;React bugs&#x27; in real apps</text></svg>