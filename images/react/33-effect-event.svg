<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Reactive vs non-reactive logic in an effect</title><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Reactive vs non-reactive logic in an effect</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Re-synchronise when roomId changes; read the latest theme without reconnecting</text><rect x="30" y="80" width="440" height="190" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="250.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">❌ theme is a dependency</text><text x="44.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useEffect(() =&gt; {</text><text x="44.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  const c = connect(roomId);</text><text x="44.0" y="155.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  c.on(&#x27;connected&#x27;, () =&gt;</text><text x="44.0" y="170.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">    notify(&#x27;Connected!&#x27;, theme));</text><text x="44.0" y="186.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  return () =&gt; c.disconnect();</text><text x="44.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">}, [roomId, theme]);</text><text x="44.0" y="217.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">// toggling theme reconnects</text><rect x="510" y="80" width="440" height="190" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="730.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">✅ useEffectEvent (React 19.2)</text><text x="524.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">const onConnected = useEffectEvent(() =&gt;</text><text x="524.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  notify(&#x27;Connected!&#x27;, theme));</text><text x="524.0" y="155.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">useEffect(() =&gt; {</text><text x="524.0" y="170.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  const c = connect(roomId);</text><text x="524.0" y="186.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  c.on(&#x27;connected&#x27;, () =&gt; onConnected());</text><text x="524.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  return () =&gt; c.disconnect();</text><text x="524.0" y="217.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">}, [roomId]);</text><text x="490.0" y="300.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Other fixes: setCount(c =&gt; c + 1) instead of reading count · create objects inside the effect · depend on primitives</text></svg>