<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="title"><title id="title">Effect lifecycle: after the component renders and the screen updates, React runs the effect; when dependencies change, it first runs the previous cleanup and then the effect again; when the component is removed it runs the final cleanup</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The life of an effect</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">useEffect(() =&gt; { connect(roomId); return () =&gt; disconnect(roomId); }, [roomId])</text><rect x="24" y="76" width="190" height="34" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="119" y="93" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">mount</text><text x="280" y="93" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">render + paint</text><text x="420" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">connect(general)</text><line x1="216" y1="93" x2="232" y2="93" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><line x1="330" y1="93" x2="410" y2="93" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><rect x="24" y="120" width="190" height="34" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="119" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">roomId changes</text><text x="280" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">render + paint</text><text x="420" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">disconnect(general) → connect(orders)</text><line x1="216" y1="137" x2="232" y2="137" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><line x1="330" y1="137" x2="410" y2="137" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><rect x="24" y="164" width="190" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="119" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">other state changes</text><text x="280" y="181" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">render + paint</text><text x="420" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">nothing (deps same)</text><line x1="216" y1="181" x2="232" y2="181" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="330" y1="181" x2="410" y2="181" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="24" y="208" width="190" height="34" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="119" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">unmount</text><text x="280" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">removed</text><text x="420" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">disconnect(orders)</text><line x1="216" y1="225" x2="232" y2="225" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)"/><line x1="330" y1="225" x2="410" y2="225" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)"/></svg>