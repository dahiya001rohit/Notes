<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="title"><title id="title">What to type in a React component</title><rect x="0" y="0" width="980" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">What to type in a React component</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Type the props; let inference handle most of the rest</text><rect x="24" y="76" width="150" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="99.0" y="92.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">thing</text><rect x="174" y="76" width="330" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="339.0" y="92.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">how</text><rect x="504" y="76" width="452" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="730.0" y="92.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">example</text><rect x="24" y="108" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="99.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">props</text><rect x="174" y="108" width="330" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="339.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">an object type (always)</text><rect x="504" y="108" width="452" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="730.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">({ title, count = 0 }: { title: string; count?: number })</text><rect x="24" y="140" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="99.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">state</text><rect x="174" y="140" width="330" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="339.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">inferred, or a generic when it starts empty</text><rect x="504" y="140" width="452" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="730.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">useState&lt;User | null&gt;(null)   useState&lt;Todo[]&gt;([])</text><rect x="24" y="172" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="99.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">events</text><rect x="174" y="172" width="330" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="339.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">inferred inline; React types when separate</text><rect x="504" y="172" width="452" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="730.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(e: React.ChangeEvent&lt;HTMLInputElement&gt;) =&gt; …</text><rect x="24" y="204" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="99.0" y="220.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">children / slots</text><rect x="174" y="204" width="330" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="339.0" y="220.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ReactNode</text><rect x="504" y="204" width="452" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="730.0" y="220.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">{ children: React.ReactNode; footer?: React.ReactNode }</text><rect x="24" y="236" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="99.0" y="252.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">variants</text><rect x="174" y="236" width="330" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="339.0" y="252.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">union of literals</text><rect x="504" y="236" width="452" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="730.0" y="252.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tone?: &#x27;info&#x27; | &#x27;success&#x27; | &#x27;danger&#x27;</text><rect x="24" y="268" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="99.0" y="284.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">wrapping &lt;button&gt;</text><rect x="174" y="268" width="330" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="339.0" y="284.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ComponentProps&lt;&#x27;button&#x27;&gt;</text><rect x="504" y="268" width="452" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="730.0" y="284.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">type P = ComponentProps&lt;&#x27;button&#x27;&gt; &amp; { variant?: … }</text><rect x="24" y="300" width="150" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="99.0" y="316.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">one-of-several shapes</text><rect x="174" y="300" width="330" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="339.0" y="316.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">discriminated union</text><rect x="504" y="300" width="452" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="730.0" y="316.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">{ status: &#x27;done&#x27;; url } | { status: &#x27;failed&#x27;; error }</text></svg>