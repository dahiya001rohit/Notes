<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="title"><title id="title">Anatomy of a Vite + React project</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Anatomy of a Vite + React project</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">index.html → main.tsx → createRoot(#root).render(&lt;App /&gt;); the dev server reloads on save, the build writes dist/</text><rect x="30" y="80" width="200" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="130.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">index.html</text><text x="44.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;</text><text x="44.0" y="138.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">&lt;script src=&quot;/src/main.tsx&quot;&gt;</text><rect x="280" y="80" width="220" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="390.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">src/main.tsx</text><text x="294.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">createRoot(root)</text><text x="294.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  .render(&lt;App /&gt;)</text><rect x="550" y="80" width="180" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="640.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">src/App.tsx</text><text x="564.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">function App() {</text><text x="564.0" y="139.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">  return &lt;h1&gt;…&lt;/h1&gt; }</text><rect x="780" y="80" width="170" height="100" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="865.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">the page</text><text x="865.0" y="124.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">React created</text><text x="865.0" y="140.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">the real DOM</text><line x1="230.0" y1="130.0" x2="278.0" y2="130.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="500.0" y1="130.0" x2="548.0" y2="130.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="730.0" y1="130.0" x2="778.0" y2="130.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="30" y="220" width="290" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="175.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">npm run dev  (Vite dev server)</text><text x="175.0" y="264.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">localhost:5173 · edit → Fast Refresh</text><text x="175.0" y="279.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">keeps state while you work</text><rect x="345" y="220" width="290" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="490.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">npm run build</text><text x="490.0" y="264.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tsc -b &amp;&amp; vite build</text><text x="490.0" y="279.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">→ dist/index.html + assets/*.js, *.css</text><rect x="660" y="220" width="290" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="805.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">package.json + lock file</text><text x="805.0" y="264.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">dependencies: react, react-dom</text><text x="805.0" y="279.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">devDependencies: vite, typescript</text><text x="490.0" y="338.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">These notes run the same components in Node with jsdom (a simulated page) and Testing Library</text></svg>