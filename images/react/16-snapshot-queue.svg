<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" role="img" aria-labelledby="title"><title id="title">State is a snapshot; setters queue updates</title><rect x="0" y="0" width="980" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">State is a snapshot; setters queue updates</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Within one render count never changes. React processes the queue in order before the next render</text><rect x="30" y="80" width="470" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="265.0" y="97.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">handler (count = 0)</text><rect x="500" y="80" width="260" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="630.0" y="97.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">queue</text><rect x="760" y="80" width="190" height="34" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="855.0" y="97.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">next render</text><rect x="30" y="114" width="470" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="265.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">setCount(count + 1) ×3</text><rect x="500" y="114" width="260" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="630.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[1, 1, 1]</text><rect x="760" y="114" width="190" height="34" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="855.0" y="131.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="30" y="148" width="470" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="265.0" y="165.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">setCount(c =&gt; c + 1) ×3</text><rect x="500" y="148" width="260" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="630.0" y="165.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[c+1, c+1, c+1]</text><rect x="760" y="148" width="190" height="34" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="855.0" y="165.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="30" y="182" width="470" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="265.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">setCount(count + 5); setCount(c =&gt; c + 1)</text><rect x="500" y="182" width="260" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="630.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[5, c+1]</text><rect x="760" y="182" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="855.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><rect x="30" y="216" width="470" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="265.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">setCount(count + 5); setCount(c =&gt; c + 1); setCount(42)</text><rect x="500" y="216" width="260" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="630.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[5, c+1, 42]</text><rect x="760" y="216" width="190" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="855.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">42</text><text x="490.0" y="270.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Batching: every update from one event (and after await, since React 18) → one re-render</text><text x="490.0" y="298.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">A timer created in an old render still sees that render&#x27;s values (a stale snapshot) → use c =&gt; c + 1</text></svg>