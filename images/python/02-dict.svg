<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Dictionary lookup: the key apple is hashed to a number that picks a slot in a table, so Python jumps straight to the value instead of scanning every entry</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">How a dict finds a value fast</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">prices = {"apple": 40, "mango": 120, "kiwi": 25}</text><rect x="30" y="110" width="130" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95.0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">key</text><text x="95.0" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"mango"</text><line x1="162" y1="140" x2="200" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="204" y="110" width="150" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="279.0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">hash(key)</text><text x="279.0" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">→ a big number</text><line x1="356" y1="140" x2="404" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="380" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">% size</text><text x="420" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><rect x="436" y="70" width="220" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="546" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">empty</text><text x="420" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="436" y="102" width="220" height="28" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="546" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"apple": 40</text><text x="420" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><rect x="436" y="134" width="220" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="546" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">empty</text><text x="420" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><rect x="436" y="166" width="220" height="28" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="546" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"kiwi": 25</text><text x="420" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><rect x="436" y="198" width="220" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="546" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"mango": 120</text><text x="420" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><rect x="436" y="230" width="220" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="546" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">empty</text><line x1="406" y1="140" x2="432" y2="206" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="680" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">found</text><text x="380" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">same speed for 10 or 10 million keys (O(1) on average) · keys must be hashable (immutable)</text></svg>