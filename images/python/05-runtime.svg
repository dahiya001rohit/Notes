<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="title"><title id="title">Python runs code by compiling source to bytecode cached in __pycache__ and executing it in the interpreter loop; objects on the heap carry reference counts and a cycle collector frees reference cycles</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">How Python runs your code</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Compile once to bytecode, then interpret; memory is freed by reference counting.</text><rect x="20" y="80" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="95.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">app.py</text><text x="95.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">source text</text><rect x="205" y="80" width="160" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="285.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">compiler</text><text x="285.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">parse → bytecode</text><rect x="400" y="80" width="150" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="475.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">__pycache__</text><text x="475.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">.pyc (cached)</text><rect x="585" y="80" width="155" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="662.5" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">interpreter</text><text x="662.5" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">specialising loop</text><text x="662.5" y="135" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(+ experimental JIT)</text><line x1="172" y1="115" x2="201" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="367" y1="115" x2="396" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="552" y1="115" x2="581" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="20" y="180" width="720" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="36" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#64748b">heap objects</text><rect x="60" y="212" width="170" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="145" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[1, 2, 3]</text><text x="145" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">refcount 2</text><rect x="250" y="212" width="170" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="335" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"Asha"</text><text x="335" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">refcount 1</text><rect x="440" y="212" width="170" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="525" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Node A ⇄ Node B</text><text x="525" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">cycle: counts never 0</text><text x="680" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">cycle GC</text><text x="680" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">(incremental)</text><line x1="640" y1="234" x2="614" y2="234" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="380" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">count reaches 0 → freed immediately</text></svg>