<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">A list of five fruits in numbered slots: indexes 0 to 4 from the front and -5 to -1 from the back; the slice [1:3] takes items 1 and 2; append adds at the end quickly; insert at 0 shifts every item</title><defs></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A list: numbered slots</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">fruits = ["kiwi", "apple", "banana", "cherry", "mango"]</text><rect x="110" y="110" width="100" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="160.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"kiwi"</text><text x="160.0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">0</text><text x="160.0" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-5</text><rect x="210" y="110" width="100" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="260.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"apple"</text><text x="260.0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">1</text><text x="260.0" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-4</text><rect x="310" y="110" width="100" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="360.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"banana"</text><text x="360.0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">2</text><text x="360.0" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-3</text><rect x="410" y="110" width="100" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="460.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"cherry"</text><text x="460.0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">3</text><text x="460.0" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-2</text><rect x="510" y="110" width="100" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="560.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"mango"</text><text x="560.0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">4</text><text x="560.0" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-1</text><text x="92" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#2563eb">index</text><text x="92" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#7c3aed">negative</text><rect x="210" y="186" width="200" height="8" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="310" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a" xml:space="preserve">fruits[1:3] → ["apple", "banana"]  (stop is excluded)</text><rect x="626" y="110" width="44" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="648.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">+</text><text x="648" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">append</text><text x="380" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">append / pop at the end: fast (O(1))   ·   insert(0, x) / pop(0): every item shifts (O(n))</text><text x="380" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">the list stores references to objects; b = fruits makes a second name for the SAME list</text></svg>