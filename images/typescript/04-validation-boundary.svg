<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="title"><title id="title">Data from the outside world (HTTP requests, JSON, forms, env vars, LLM output) is unknown; a Zod schema validates it at the boundary; valid data becomes a typed value used by the rest of the app, invalid data becomes a clear error</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Validate at the boundary</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Outside data is unknown. Parse it once, then everything inside is typed and trusted.</text><rect x="24" y="76" width="180" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="114" y="95" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">HTTP body / query</text><line x1="206" y1="95" x2="262" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="24" y="126" width="180" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="114" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">JSON.parse · res.json()</text><line x1="206" y1="145" x2="262" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="24" y="176" width="180" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="114" y="195" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">forms · env vars</text><line x1="206" y1="195" x2="262" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="24" y="226" width="180" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="114" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">webhooks · LLM output</text><line x1="206" y1="245" x2="262" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="266" y="120" width="180" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="356.0" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Schema.safeParse()</text><text x="356.0" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">unknown → checked</text><text x="356.0" y="175" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">z.infer&lt;typeof Schema&gt;</text><rect x="520" y="76" width="216" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="628.0" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">✓ typed value</text><text x="628.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">User { id, email, … }</text><text x="628.0" y="131" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">safe everywhere inside</text><rect x="520" y="206" width="216" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="628.0" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">✗ clear error</text><text x="628.0" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">400 with field messages</text><text x="628.0" y="261" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">logged, never trusted</text><line x1="448" y1="148" x2="516" y2="116" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><line x1="448" y1="172" x2="516" y2="240" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)"/><rect x="508" y="66" width="240" height="100" rx="12" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="628" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">your app: types are trustworthy here</text></svg>