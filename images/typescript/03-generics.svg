<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="title"><title id="title">A generic function is like a machine with an adjustable slot: firstItem&lt;T&gt; receives an array of T and returns a T; calling it with numbers fills T with number, with users fills T with User, so the output type always matches the input</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="760" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Generics: a type with a blank to fill in</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">function firstItem&lt;T&gt;(items: T[]): T | undefined</text><rect x="280" y="80" width="200" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="380.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">firstItem&lt;T&gt;</text><text x="380.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">T[]  →  T | undefined</text><rect x="24" y="170" width="200" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="124" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[10, 20, 30]</text><rect x="300" y="170" width="160" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="380" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">T = number</text><rect x="536" y="170" width="200" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="636" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">number | undefined</text><line x1="226" y1="190" x2="296" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="462" y1="190" x2="532" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="24" y="230" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="124" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">users: User[]</text><rect x="300" y="230" width="160" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="380" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">T = User</text><rect x="536" y="230" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="636" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">User | undefined</text><line x1="226" y1="250" x2="296" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><line x1="462" y1="250" x2="532" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="124" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">input</text><text x="636" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">result type</text></svg>