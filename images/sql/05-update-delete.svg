<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" role="img" aria-labelledby="title"><title id="title">UPDATE with WHERE changes only the matching rows; DELETE removes them; without WHERE every row is affected</title><defs></defs><rect x="0" y="0" width="760" height="266" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">UPDATE and DELETE: the WHERE clause decides</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Only rows matching WHERE change. Without WHERE, every row does.</text><text x="30" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">UPDATE … WHERE category = 'kitchen'</text><rect x="30" y="96" width="110" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="85.0" y="109.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">name</text><rect x="140" y="96" width="100" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="190.0" y="109.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">category</text><rect x="240" y="96" width="60" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="270.0" y="109.0" font-family="ui-sans-se