<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="title"><title id="title">A jsonb document in one cell, operators that reach into it, and a GIN index over its keys and values</title><defs></defs><rect x="0" y="0" width="760" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">JSONB: a document inside a column</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">-&gt; returns JSON, -&gt;&gt; returns text, @&gt; tests containment; a GIN index makes it fast</text><rect x="30" y="80" width="360" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">{</text><text x="46" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">  "color": "black",</text><text x="46" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">  "wireless": true,</text><text x="46" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">  "dimensions": {"w": 44, "h": 13}</text><text x="46" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">}</text><text x="420" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#2563eb">attrs -&gt;&gt; 'color'</text><text x="420" y="111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">→ 'black' (text)</text><text x="420" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#2563eb">attrs -&gt; 'dimensions'</text><text x="420" y="141" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">→ {"w": 44, "h": 13}</text><text x="420" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#2563eb">attrs #&gt;&gt; '{dimensions,h}'</text><text x="420" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">→ '13'</text><text x="420" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#2563eb">attrs @&gt; '{"wireless": true}'</text><text x="420" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">→ true</text><text x="30" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#16a34a">GIN index: key/value → rows containing it (like a book index for the document's contents)</text></svg>