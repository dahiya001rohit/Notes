<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="title"><title id="title">Incoming rows pass through NOT NULL, UNIQUE, CHECK and FOREIGN KEY rules; bad rows are rejected</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Constraints: rules checked on every write</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Whatever program writes the row, the database enforces the rules</text><rect x="30" y="78" width="170" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="115" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">NOT NULL</text><line x1="204" y1="92" x2="250" y2="92" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)"/><text x="258" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#dc2626">rejected: name is missing</text><rect x="30" y="114" width="170" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="115" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">UNIQUE</text><line x1="204" y1="128" x2="250" y2="128" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)"/><text x="258" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#dc2626">rejected: email already used</text><rect x="30" y="150" width="170" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="115" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">CHECK</text><line x1="204" y1="164" x2="250" y2="164" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)"/><text x="258" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#dc2626">rejected: stock = -85</text><rect x="30" y="186" width="170" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="115" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">FOREIGN KEY</text><line x1="204" y1="200" x2="250" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)"/><text x="258" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#dc2626">rejected: customer 999 doesn't exist</text><rect x="30" y="222" width="170" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="115" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">all rules pass</text><line x1="204" y1="236" x2="250" y2="236" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="258" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#16a34a">row stored ✓</text></svg>