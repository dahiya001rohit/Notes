<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">A CTE pipeline of named steps, and a recursive CTE that walks an org chart level by level</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">CTEs: queries in named steps</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">WITH a AS (...), b AS (... FROM a ...) SELECT ... FROM b.  RECURSIVE repeats a step.</text><rect x="30" y="86" width="150" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="105" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">order_totals</text><text x="105" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">sum per order</text><line x1="182" y1="113" x2="210" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="215" y="86" width="150" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="290" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">customer_spend</text><text x="290" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">sum per customer</text><line x1="367" y1="113" x2="395" y2="113" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="400" y="86" width="150" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="475" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">final SELECT</text><text x="475" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">join names, sort</text><line x1="600" y1="184" x2="560" y2="211" stroke="#94a3b8" stroke-width="1.8"/><line x1="600" y1="184" x2="650" y2="211" stroke="#94a3b8" stroke-width="1.8"/><line x1="560" y1="239" x2="560" y2="261" stroke="#94a3b8" stroke-width="1.8"/><rect x="558" y="156" width="84" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="600" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Rahul</text><text x="660" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">start</text><rect x="518" y="211" width="84" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="560" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Vikram</text><text x="620" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">level 1</text><rect x="608" y="211" width="84" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="650" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Priya</text><text x="710" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">level 1</text><rect x="518" y="261" width="84" height="28" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="560" y="275" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Neha</text><text x="620" y="275" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">level 2</text><text x="30" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#d97706">anchor: Rahul's direct reports (level 1)</text><text x="30" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#7c3aed">step: reports of the rows just found (level 2, 3, …)</text><text x="30" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">stop: when a step finds no new rows</text></svg>