<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="title"><title id="title">A primary server streams its write-ahead log to two read replicas and to an archive; a base backup plus the archived WAL allows point-in-time recovery</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Replication and point-in-time recovery</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Writes go to the primary; WAL streams to replicas and to an archive</text><rect x="40" y="110" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="125" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Primary</text><text x="125" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">reads + writes</text><rect x="330" y="80" width="170" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="415" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Replica 1</text><text x="415" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">read-only</text><line x1="212" y1="140" x2="326" y2="105" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><rect x="330" y="170" width="170" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="415" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Replica 2</text><text x="415" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">read-only</text><line x1="212" y1="140" x2="326" y2="195" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="268" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">WAL stream</text><rect x="560" y="110" width="170" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="645" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Backups</text><text x="645" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">base backup + WAL</text><path d="M125,172 C125,240 645,240 645,174" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)" stroke-dasharray="5 4"/><text x="385" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">archive → restore to any moment (PITR)</text></svg>