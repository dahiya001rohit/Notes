<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="title"><title id="title">A query reads the table, WHERE keeps matching rows, ORDER BY sorts them, LIMIT keeps the first few</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">How a SELECT works, step by step</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">FROM → WHERE → SELECT → ORDER BY → LIMIT</text><text x="105" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">FROM products</text><rect x="40" y="94" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><rect x="40" y="110" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><rect x="40" y="126" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><rect x="40" y="142" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><rect x="40" y="158" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><rect x="40" y="174" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><rect x="40" y="190" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><rect x="40" y="206" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="105" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">8 rows</text><line x1="176" y1="150" x2="206" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="285" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">WHERE price &gt; 200</text><rect x="220" y="94" width="130" height="12" rx="2" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/><rect x="220" y="110" width="130" height="12" rx="2" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/><rect x="220" y="126" width="130" height="12" rx="2" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/><rect x="220" y="142" width="130" height="12" rx="2" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/><rect x="220" y="158" width="130" height="12" rx="2" fill="#dcfce7" stroke="#94a3b8" stroke-width="1"/><text x="285" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5 rows</text><line x1="356" y1="150" x2="386" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="465" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">ORDER BY price DESC</text><rect x="400" y="94" width="130" height="12" rx="2" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><rect x="400" y="110" width="130" height="12" rx="2" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><rect x="400" y="126" width="130" height="12" rx="2" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><rect x="400" y="142" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><rect x="400" y="158" width="130" height="12" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="465" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5 rows</text><line x1="536" y1="150" x2="566" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="645" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">LIMIT 3</text><rect x="580" y="94" width="130" height="12" rx="2" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><rect x="580" y="110" width="130" height="12" rx="2" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><rect x="580" y="126" width="130" height="12" rx="2" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><text x="645" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3 rows</text><text x="30" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The database may take a smarter route (an index), but the result is as if it did these steps.</text></svg>