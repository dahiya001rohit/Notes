<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="title"><title id="title">GROUP BY returns one row per department; a window function keeps every employee row and adds the department rank</title><defs></defs><rect x="0" y="0" width="760" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">GROUP BY vs window functions</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">GROUP BY collapses rows. OVER (PARTITION BY …) keeps every row and adds a value.</text><text x="30" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">GROUP BY department → 3 rows</text><rect x="30" y="96" width="120" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="90.0" y="109.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">department</text><rect x="150" y="96" width="100" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="200.0" y="109.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">avg salary</text><rect x="30" y="122" width="120" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="90.0" y="135.0" font-family="u