<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">A query plan tree: sequential scans at the leaves feed a hash and a hash join, then an aggregate at the top</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Reading a plan: rows flow upwards</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">EXPLAIN shows the tree; the most indented nodes run first</text><line x1="380" y1="126" x2="380" y2="96" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="220" y1="196" x2="380" y2="156" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="540" y1="186" x2="380" y2="156" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="540" y1="246" x2="540" y2="216" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><rect x="290" y="66" width="180" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="380" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">HashAggregate</text><rect x="290" y="126" width="180" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="380" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Hash Join</text><rect x="130" y="196" width="180" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="220" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Seq Scan on orders</text><rect x="450" y="186" width="180" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="540" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Hash</text><rect x="450" y="246" width="180" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="540" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Seq Scan on customers</text><text x="30" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">3. group</text><text x="30" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">2. join by hashing</text><text x="30" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">1. read the tables</text></svg>