<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Venn-style diagrams of INNER, LEFT, RIGHT and FULL joins showing which rows each keeps</title><defs></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Which rows each join keeps</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">A = customers, B = orders, matched on customers.id = orders.customer_id</text><circle cx="88" cy="160" r="48" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><circle cx="132" cy="160" r="48" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><path d="M110,117 A48,48 0 0,1 110,203 A48,48 0 0,1 110,117 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="66" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">A</text><text x="154" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">B</text><text x="110" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">INNER JOIN</text><text x="110" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">only matches</text><circle cx="268" cy="160" r="48" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="312" cy="160" r="48" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><path d="M290,117 A48,48 0 0,1 290,203 A48,48 0 0,1 290,117 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="246" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">A</text><text x="334" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">B</text><text x="290" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">LEFT JOIN</text><text x="290" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">all of A</text><circle cx="448" cy="160" r="48" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><circle cx="492" cy="160" r="48" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M470,117 A48,48 0 0,1 470,203 A48,48 0 0,1 470,117 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="426" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">A</text><text x="514" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">B</text><text x="470" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">RIGHT JOIN</text><text x="470" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">all of B</text><circle cx="628" cy="160" r="48" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="672" cy="160" r="48" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M650,117 A48,48 0 0,1 650,203 A48,48 0 0,1 650,117 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="606" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">A</text><text x="694" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">B</text><text x="650" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">FULL JOIN</text><text x="650" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">everything</text><text x="30" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Unmatched rows get NULLs in the other table's columns. Anti-join: LEFT JOIN … WHERE b.id IS NULL (A only).</text></svg>