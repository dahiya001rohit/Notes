<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" role="img" aria-labelledby="title"><title id="title">A B-tree index: a root page with key ranges, leaf pages with sorted keys, each pointing to rows in the table</title><defs><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="316" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A B-tree index</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Sorted keys in a shallow tree; each leaf entry points to a row in the table (heap)</text><rect x="270" y="76" width="240" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="390.0" y="92.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">&lt; 2000 | &lt; 4000 | ≥ 4000</text><line x1="390" y1="110" x2="140" y2="146" stroke="#94a3b8" stroke-width="1.5"/><rect x="60" y="148" width="160" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="140.0" y="163.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1 … 1999</text><line x1="390" y1="110" x2="380" y2="146" stroke="#94a3b8" stroke-width="1.5"/><rect x="300" y="148" width="160" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="380.0" y="163.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2000 … 3999</text><line x1="390" y1="110" x2="620" y2="146" stroke="#94a3b8" stroke-width="1.5"/><rect x="540" y="148" width="160" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="620.0" y="163.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4000 … 5000</text><line x1="210" y1="163" x2="298" y2="163" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="462" y1="163" x2="538" y2="163" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="60" y="222" width="640" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="380" y="239" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">table (heap): rows stored in no particular order</text><line x1="120" y1="180" x2="140" y2="220" stroke="#d97706" stroke-width="1.4" marker-end="url(#ad97706)"/><line x1="360" y1="180" x2="380" y2="220" stroke="#d97706" stroke-width="1.4" marker-end="url(#ad97706)"/><line x1="610" y1="180" x2="630" y2="220" stroke="#d97706" stroke-width="1.4" marker-end="url(#ad97706)"/><text x="30" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#16a34a">Leaves are linked (dashed), so range scans just walk sideways.</text><text x="30" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Lookup = 3–4 page reads even for millions of rows. Composite (a, b): sorted by a, then b.</text></svg>