<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Text is tokenised, the transformer outputs probabilities for the next token, one token is sampled and appended to the text, and the loop repeats</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">How an LLM writes: one token at a time</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Predict → sample → append → repeat, until an end token or max_tokens.</text><rect x="24" y="96" width="170" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="109.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">“The capital of</text><text x="109.0" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">France is”</text><line x1="196" y1="124" x2="226" y2="124" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="230" y="96" width="110" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="285.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">tokenise</text><text x="285.0" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">→ ids</text><line x1="342" y1="124" x2="372" y2="124" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="376" y="96" width="130" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="441.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">transformer</text><text x="441.0" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(N blocks)</text><line x1="508" y1="124" x2="538" y2="124" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="542" y="78" width="196" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="640" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">next-token probabilities</text><text x="606" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#0f172a"> Paris</text><rect x="612" y="106" width="90.19999999999999" height="13" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="706.2" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">0.82</text><text x="606" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#0f172a"> located</text><rect x="612" y="125" width="7.700000000000001" height="13" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="623.7" y="131" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">0.07</text><text x="606" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#0f172a"> the</text><rect x="612" y="144" width="4.4" height="13" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="620.4" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">0.04</text><text x="606" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#0f172a"> Lyon</text><rect x="612" y="163" width="3.3" height="13" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="619.3" y="169" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">0.03</text><path d="M640,190 L640,236 L110,236 L110,156" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)" stroke-dasharray="6 4"/><text x="380" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">sample “ Paris” (temperature, top-p), append it, run again</text><text x="380" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">the model is stateless: every step re-reads the whole text so far (cached as the KV cache)</text></svg>