<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">The app sends the question and tool definitions to the model; the model returns a tool_use request; the app validates and runs the function and sends a tool_result; the model returns the final answer</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The tool-use loop</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The model asks; your code decides and does. Repeat until stop_reason is end_turn.</text><rect x="30" y="90" width="170" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="115.0" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Your app</text><text x="115.0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">holds tools + history</text><text x="115.0" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">validates inputs</text><text x="115.0" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">runs functions</text><text x="115.0" y="179" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">asks humans for</text><text x="115.0" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">risky actions</text><rect x="560" y="90" width="170" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="645.0" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">LLM</text><text x="645.0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">decides whether a</text><text x="645.0" y="145" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tool is needed and</text><text x="645.0" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">with which arguments</text><line x1="202" y1="100" x2="556" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><text x="380" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">1. question + tool definitions</text><line x1="556" y1="140" x2="202" y2="140" stroke="#7c3aed" stroke-width="2" marker-end="url(#a7c3aed)"/><text x="380" y="131" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">2. tool_use: get_order_status(90312)</text><line x1="202" y1="180" x2="556" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><text x="380" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">3. tool_result: {status: in transit}</text><line x1="556" y1="220" x2="202" y2="220" stroke="#7c3aed" stroke-width="2" marker-end="url(#a7c3aed)"/><text x="380" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">4. final answer (end_turn)</text><rect x="30" y="252" width="170" height="36" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="115.0" y="270.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">your database / APIs</text><line x1="115" y1="242" x2="115" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#a64748b)"/></svg>