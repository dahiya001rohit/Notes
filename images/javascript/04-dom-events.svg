<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="title"><title id="title">The DOM tree for a small page, and an event travelling down from window to the target button (capture), then back up (bubble), where a single listener on the list handles clicks for all items (delegation)</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The DOM and event flow</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Capture goes down to the target, bubbling goes back up. Delegation listens on a parent.</text><rect x="20" y="62" width="180" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="110" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">window</text><rect x="20" y="112" width="180" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="110" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">document</text><rect x="20" y="162" width="180" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="110" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">&lt;body&gt;</text><rect x="20" y="212" width="180" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="110" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">&lt;ul id="cart"&gt;</text><rect x="20" y="262" width="180" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="110" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">&lt;li&gt; &lt;button&gt;</text><path d="M225,80 L225,280" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a2563eb)"/><text x="236" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">1 capture</text><path d="M330,280 L330,80" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ad97706)"/><text x="341" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#d97706">3 bubble</text><text x="280" y="305" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">2 target</text><rect x="430" y="150" width="310" height="150" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="446" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">Delegation: one listener for all items</text><text x="446" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">cart.addEventListener("click", e =&gt; {</text><text x="446" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">  const btn = e.target.closest("button");</text><text x="446" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">  if (!btn) return;</text><text x="446" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">  remove(btn.dataset.id);</text><text x="446" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">});</text><text x="585" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">works for items added later,</text><text x="585" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">and needs only one listener</text></svg>