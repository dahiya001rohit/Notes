<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">The rendering pipeline: HTML is parsed into the DOM and CSS into the CSSOM; together they form the render tree, then layout computes geometry, paint fills pixels, and composite assembles layers on the GPU; JavaScript changes can trigger any stage again</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">How the browser turns code into pixels</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Changing size or position re-runs layout; colour re-runs paint; transform/opacity only composite.</text><rect x="20" y="76" width="110" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="75.0" y="101.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">HTML</text><rect x="20" y="150" width="110" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="75.0" y="175.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">CSS</text><rect x="160" y="76" width="100" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210.0" y="101.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">DOM</text><rect x="160" y="150" width="100" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210.0" y="175.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">CSSOM</text><line x1="132" y1="101" x2="156" y2="101" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="132" y1="175" x2="156" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="290" y="110" width="110" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="345.0" y="138.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">render tree</text><line x1="262" y1="101" x2="288" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="262" y1="175" x2="288" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="430" y="104" width="96" height="68" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="478.0" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Layout</text><text x="478.0" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">sizes, positions</text><rect x="540" y="104" width="96" height="68" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="588.0" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">Paint</text><text x="588.0" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">pixels, colours</text><line x1="528" y1="138" x2="538" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="650" y="104" width="96" height="68" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="698.0" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Composite</text><text x="698.0" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">layers on GPU</text><line x1="638" y1="138" x2="648" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="402" y1="138" x2="428" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="40" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">el.style.width = …  /  read offsetHeight after a write</text><text x="740" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#d97706">layout + paint + composite (slowest)</text><text x="40" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">el.style.color = …</text><text x="740" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#7c3aed">paint + composite</text><text x="40" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">el.style.transform / opacity</text><text x="740" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#16a34a">composite only (smooth animations)</text></svg>