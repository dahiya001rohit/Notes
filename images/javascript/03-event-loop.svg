<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">The event loop: synchronous code runs on the call stack; Web APIs or Node handle timers and I/O; finished callbacks wait in the task queue, promise callbacks in the microtask queue; after each task the loop drains all microtasks, then the browser may render, then takes the next task</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The event loop</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">One call stack. After each task: run ALL microtasks, maybe render, then the next task.</text><rect x="24" y="70" width="180" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="114" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Call stack</text><rect x="44" y="220" width="140" height="34" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="114.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">main()</text><rect x="44" y="180" width="140" height="34" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="114.0" y="197.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">handleClick()</text><rect x="44" y="140" width="140" height="34" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="114.0" y="157.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">console.log()</text><rect x="290" y="70" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="390.0" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Web APIs / Node</text><text x="390.0" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">timers · fetch · DOM events</text><text x="390.0" y="125" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">file and network I/O</text><line x1="206" y1="110" x2="286" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="246" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">start</text><rect x="540" y="70" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="640" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Task queue</text><text x="640" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">setTimeout · events</text><text x="640" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">I/O callbacks</text><rect x="540" y="186" width="200" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="640" y="205" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Microtask queue</text><text x="640" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">promise .then · await</text><text x="640" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">queueMicrotask</text><line x1="492" y1="115" x2="536" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="514" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">done</text><path d="M538,236 L208,236" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="330" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">1st: drain ALL</text><path d="M640,162 L640,170 L208,170" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)" stroke-dasharray="5 3"/><text x="330" y="163" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">2nd: take ONE task</text><rect x="290" y="290" width="200" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="390.0" y="315.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">render (browser)</text><text x="620" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">loop: task → microtasks → render</text></svg>