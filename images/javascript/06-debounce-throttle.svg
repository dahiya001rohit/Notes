<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Debounce waits until events stop for a quiet period and then fires once; throttle fires at most once per interval while events keep coming</title><defs></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Debounce vs throttle</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Same stream of events (keystrokes or scrolls), two ways to limit the work.</text><text x="124" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#2563eb">events</text><line x1="140" y1="100" x2="729.0" y2="100" stroke="#cbd5e1" stroke-width="1.5"/><line x1="140.0" y1="86" x2="140.0" y2="114" stroke="#2563eb" stroke-width="3"/><line x1="168.5" y1="86" x2="168.5" y2="114" stroke="#2563eb" stroke-width="3"/><line x1="197.0" y1="86" x2="197.0" y2="114" stroke="#2563eb" stroke-width="3"/><line x1="225.5" y1="86" x2="225.5" y2="114" stroke="#2563eb" stroke-width="3"/><line x1="254.0" y1="86" x2="254.0" y2="114" stroke="#2563eb" stroke-width="3"/><line x1="453.5" y1="86" x2="453.5" y2="114" stroke="#2563eb" stroke-width="3"/><line x1="482.0" y1="86" x2="482.0" y2="114" stroke="#2563eb" stroke-width="3"/><line x1="510.5" y1="86" x2="510.5" y2="114" stroke="#2563eb" stroke-width="3"/><text x="124" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#16a34a">debounce 200</text><line x1="140" y1="160" x2="729.0" y2="160" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="444.0" cy="160" r="9" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/><circle cx="700.5" cy="160" r="9" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/><text x="124" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#d97706">throttle 200</text><line x1="140" y1="220" x2="729.0" y2="220" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="140.0" cy="220" r="9" fill="#d97706" stroke="#d97706" stroke-width="1.5"/><circle cx="330.0" cy="220" r="9" fill="#d97706" stroke="#d97706" stroke-width="1.5"/><circle cx="520.0" cy="220" r="9" fill="#d97706" stroke="#d97706" stroke-width="1.5"/><text x="349.0" y="194" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">after 200 ms of quiet</text><rect x="254.0" y="174" width="190.0" height="6" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><line x1="140.0" y1="230" x2="140.0" y2="236" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0 ms</text><line x1="330.0" y1="230" x2="330.0" y2="236" stroke="#64748b" stroke-width="1.5"/><text x="330.0" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">200 ms</text><line x1="520.0" y1="230" x2="520.0" y2="236" stroke="#64748b" stroke-width="1.5"/><text x="520.0" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">400 ms</text><line x1="710.0" y1="230" x2="710.0" y2="236" stroke="#64748b" stroke-width="1.5"/><text x="710.0" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">600 ms</text><text x="380" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">debounce: search after typing stops · throttle: update while scrolling, at a steady rate</text></svg>