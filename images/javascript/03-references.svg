<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Values and references</title><defs><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Values and references</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Copying a primitive copies the value; copying an object variable copies the arrow.</text><text x="190.0" y="86.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">let a = 5;  let b = a;  b = 99;</text><text x="70.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a</text><rect x="100" y="120" width="90" height="44" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="145.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><text x="70.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">b</text><rect x="100" y="190" width="90" height="44" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="145.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">99</text><text x="190.0" y="270.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">two separate values: changing b leaves a alone</text><line x1="380.0" y1="80.0" x2="380.0" y2="280.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><text x="570.0" y="86.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">const box1 = { count: 1 };  const box2 = box1;</text><text x="430.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">box1</text><rect x="470" y="120" width="60" height="44" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="500.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">•</text><line x1="530.0" y1="142.0" x2="600.0" y2="153.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a7c3aed)"/><text x="430.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">box2</text><rect x="470" y="190" width="60" height="44" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="500.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">•</text><line x1="530.0" y1="212.0" x2="600.0" y2="177.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a7c3aed)"/><rect x="602" y="135" width="130" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="667.0" y="165.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">{ count: 99 }</text><text x="667.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">one object</text><text x="570.0" y="270.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">box2.count = 99 changes the object both point to</text></svg>