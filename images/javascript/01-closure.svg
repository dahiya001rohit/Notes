<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">A closure: makeCounter returns an inner function that keeps a live link to its outer variable count, even after makeCounter has finished; each call to makeCounter creates a separate count</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A closure: a function plus the variables it remembers</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">function makeCounter() { let count = 0; return () =&gt; ++count; }</text><rect x="30" y="80" width="200" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="130.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">call makeCounter()</text><text x="130.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">creates a new scope</text><text x="130.0" y="135" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">with count = 0</text><line x1="232" y1="125" x2="270" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="274" y="72" width="220" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><text x="384" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">scope kept alive</text><rect x="334" y="108" width="100" height="34" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="384.0" y="125.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">count = 2</text><text x="384" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">(makeCounter has returned)</text><rect x="540" y="80" width="190" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="635.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">counterA</text><text x="635.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">() =&gt; ++count</text><text x="635.0" y="135" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">counterA() → 1, 2, 3…</text><line x1="538" y1="125" x2="498" y2="125" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="518" y="115" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">link</text><rect x="274" y="202" width="220" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><rect x="334" y="220" width="100" height="34" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="384.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">count = 0</text><rect x="540" y="202" width="190" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="635.0" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">counterB</text><text x="635.0" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">its own, separate count</text><line x1="538" y1="237" x2="498" y2="237" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="130" y="237" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">second call → new scope</text><text x="380" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">closures link to the variable itself (live), not a copy of its value</text></svg>