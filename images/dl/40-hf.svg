<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">The Hugging Face workflow</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The Hugging Face workflow</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Search the Hub first; load with Auto classes; run directly or via a pipeline; fine-tune if needed</text><rect x="30" y="80" width="200" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="130.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Hub</text><text x="130.0" y="150.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">models · datasets</text><text x="130.0" y="165.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">model cards · licences</text><line x1="230.0" y1="100.0" x2="270.0" y2="100.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="270" y="80" width="200" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="370.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">AutoTokenizer</text><text x="370.0" y="150.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">text → input_ids,</text><text x="370.0" y="165.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">attention_mask</text><line x1="470.0" y1="100.0" x2="510.0" y2="100.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="510" y="80" width="200" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="610.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">AutoModelFor…</text><text x="610.0" y="150.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">ids → logits /</text><text x="610.0" y="165.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">hidden states</text><line x1="710.0" y1="100.0" x2="750.0" y2="100.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="750" y="80" width="200" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="850.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">post-process</text><text x="850.0" y="150.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">softmax → labels,</text><text x="850.0" y="165.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#334155">decode → text</text><rect x="270" y="200" width="680" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="610.0" y="221.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">pipeline(&quot;sentiment-analysis&quot;, model=...)  wraps tokenizer → model → post-processing</text><rect x="30" y="200" width="200" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="130.0" y="221.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">datasets → Trainer</text><text x="490.0" y="275.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">a checkpoint = config.json + model.safetensors + tokenizer files, identified as organisation/model-name</text></svg>