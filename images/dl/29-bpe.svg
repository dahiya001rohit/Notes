.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">low e r _</text><rect x="580" y="208" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="672.5" y="225.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">low e s t _</text><text x="800.0" y="225.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">(low, _) appears 3×</text><rect x="30" y="254" width="130" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="95.0" y="271.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">merge low+e</text><rect x="180" y="254" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="272.5" y="271.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">low_ ×3</text><rect x="380" y="254" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="472.5" y="271.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">lowe r _</text><rect x="580" y="254" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="672.5" y="271.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">lowe s t _</text><text x="800.0" y="271.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">(low, e) appears 2×</text><text x="490.0" y="312.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">common words become single tokens; rare words split into known pieces, so nothing is ever &#x27;unknown&#x27;</text></svg>