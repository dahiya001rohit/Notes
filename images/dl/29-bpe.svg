<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Byte-pair encoding: merge the most frequent pair, repeat</title><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Byte-pair encoding: merge the most frequent pair, repeat</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Corpus: low ×3, lower, lowest   ( _ marks the end of a word )</text><rect x="30" y="70" width="130" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="95.0" y="87.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">start</text><rect x="180" y="70" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="272.5" y="87.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">l o w _ ×3</text><rect x="380" y="70" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="472.5" y="87.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">l o w e r _</text><rect x="580" y="70" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="672.5" y="87.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">l o w e s t _</text><rect x="30" y="116" width="130" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="95.0" y="133.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">merge l+o</text><rect x="180" y="116" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="272.5" y="133.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">lo w _ ×3</text><rect x="380" y="116" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="472.5" y="133.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">lo w e r _</text><rect x="580" y="116" width="185" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="672.5" y="133.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">lo w e s t _</text><text x="800.0" y="133.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">(l, o) appears 5×</text><rect x="30" y="162" width="130" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="95.0" y="179.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f17