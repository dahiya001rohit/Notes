<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">A residual block: output = F(x) + x</title><defs><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A residual block: output = F(x) + x</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The block only learns a correction F(x); the shortcut gives gradients a direct path back (∂y/∂x = 1 + ∂F/∂x)</text><rect x="60" y="130" width="90" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="105.0" y="152.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x</text><line x1="150.0" y1="152.0" x2="215.0" y2="152.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="220" y="130" width="100" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="270.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">conv 3×3</text><line x1="320.0" y1="152.0" x2="335.0" y2="152.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="335" y="130" width="100" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="385.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">BatchNorm</text><line x1="435.0" y1="152.0" x2="450.0" y2="152.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="450" y="130" width="100" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="500.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ReLU</text><line x1="550.0" y1="152.0" x2="565.0" y2="152.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="565" y="130" width="100" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="615.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">conv 3×3</text><line x1="665.0" y1="152.0" x2="680.0" y2="152.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="680" y="130" width="100" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="730.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">BatchNorm</text><circle cx="840.0" cy="152.0" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="840.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+</text><line x1="780.0" y1="152.0" x2="822.0" y2="152.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><path d="M 105 130 L 105 90 L 840 90 L 840 134" fill="none" stroke="#d97706" stroke-width="2.2"/><line x1="840.0" y1="120.0" x2="840.0" y2="133.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#ad97706)"/><text x="470.0" y="76.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">shortcut (identity, or 1×1 conv when the shape changes)</text><line x1="858.0" y1="152.0" x2="895.0" y2="152.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="902.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">ReLU → y</text><text x="470.0" y="205.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">F(x): the residual the block learns</text><text x="490.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Deep plain stacks: gradients shrink as a product of many small factors. Residual stacks: the &#x27;+1&#x27; keeps a path open.</text><text x="490.0" y="274.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">ResNet (2015) trained 152 layers this way; every transformer block uses the same idea.</text></svg>