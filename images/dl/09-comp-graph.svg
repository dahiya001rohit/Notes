<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">A computational graph: f = (x·y + z)²   with x = 2, y = −3, z = 4</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A computational graph: f = (x·y + z)²   with x = 2, y = −3, z = 4</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Forward: values left → right (green).  Backward: gradients right → left (red) = upstream × local</text><circle cx="70.0" cy="95.0" r="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="70.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x</text><text x="70.0" y="135.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">value 2</text><text x="70.0" y="149.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="1" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a"></text><text x="150.0" y="77.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">∂f/∂x = 12</text><circle cx="70.0" cy="175.0" r="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="70.0" y="175.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">y</text><text x="70.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">value −3</text><text x="70.0" y="229.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="1" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a"></text><text x="150.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">∂f/∂y = −8</text><circle cx="70.0" cy="255.0" r="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="70.0" y="255.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">z</text><text x="70.0" y="295.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">value 4</text><text x="70.0" y="309.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="1" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a"></text><text x="150.0" y="275.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">∂f/∂z = −4</text><circle cx="300.0" cy="135.0" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="300.0" y="135.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">×</text><text x="300.0" y="185.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">a = −6</text><line x1="96.0" y1="95.0" x2="270.0" y2="128.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="96.0" y1="175.0" x2="270.0" y2="142.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><circle cx="500.0" cy="190.0" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="500.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+</text><text x="500.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">b = −2</text><line x1="330.0" y1="140.0" x2="470.0" y2="183.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="96.0" y1="255.0" x2="470.0" y2="198.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><circle cx="700.0" cy="190.0" r="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="700.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">( )²</text><text x="700.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">f = 4</text><line x1="530.0" y1="190.0" x2="670.0" y2="190.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="600.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">∂f/∂b = 2b = −4</text><text x="400.0" y="140.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">∂f/∂a = −4 · 1</text><text x="850.0" y="120.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">local rules</text><text x="850.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">add: pass g to both</text><text x="850.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">mul: g·(other input)</text><text x="850.0" y="200.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">square: g·2b</text><text x="850.0" y="225.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">used twice: add up</text><text x="490.0" y="305.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">∂f/∂x = ∂f/∂a · ∂a/∂x = (−4)·y = 12      ∂f/∂y = (−4)·x = −8      ∂f/∂z = (−4)·1 = −4</text></svg>