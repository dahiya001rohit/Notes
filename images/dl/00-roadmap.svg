<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Deep learning: the learning path</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Deep learning: the learning path</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Each part uses only what earlier parts taught</text><rect x="30" y="80" width="140" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="100.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Part 1 Basic</text><text x="100.0" y="122.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">What DL is</text><line x1="170.0" y1="111.0" x2="187.0" y2="111.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="187" y="80" width="140" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="257.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Part 2 Basic</text><text x="257.0" y="122.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">How nets learn</text><line x1="327.0" y1="111.0" x2="344.0" y2="111.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="344" y="80" width="140" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="414.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Part 3 Easy</text><text x="414.0" y="122.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">PyTorch</text><line x1="484.0" y1="111.0" x2="501.0" y2="111.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="501" y="80" width="140" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="571.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Part 4 Moderate</text><text x="571.0" y="122.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Training that works</text><line x1="641.0" y1="111.0" x2="658.0" y2="111.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="658" y="80" width="140" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="728.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif