 y2="170.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="795" y="130" width="160" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="875.0" y="152.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">shared space:</text><text x="875.0" y="167.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">matching pairs close</text><text x="740.0" y="300.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">zero-shot: compare an image with &#x27;a photo of a {class}&#x27; for every class</text></svg>