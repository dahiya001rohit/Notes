<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Transformers for images: ViT and CLIP</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Transformers for images: ViT and CLIP</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">ViT: patches become tokens.  CLIP: images and captions trained into one shared embedding space</text><rect x="40" y="90" width="40" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><rect x="80" y="90" width="40" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><rect x="120" y="90" width="40" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><rect x="40" y="130" width="40" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><rect x="80" y="130" width="40" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><rect x="120" y="130" width="40" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><rect x="40" y="170" width="40" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><rect x="80" y="170" width="40" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><rect x="120" y="170" width="40" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="100.0" y="225.0" font-famil