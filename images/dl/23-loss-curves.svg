<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">Reading loss curves</title><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Reading loss curves</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Blue = training loss, orange = validation loss, over training steps</text><rect x="30" y="80" width="170" height="130" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><polyline points="30.0,101.0 49.4,150.5 88.3,178.0 146.6,189.0 195.1,193.4" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/><polyline points="30.0,105.4 49.4,153.8 88.3,175.8 146.6,183.5 195.1,185.7" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linejoin="round"/><text x="115.0" y="230.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">healthy</text><text x="115.0" y="258.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">keep going</text><rect x="220" y="80" width="170" height="130" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><polyline points="220.0,134.0 249.1,123.0 278.3,150.5 307.4,112.0 336.6,167.0 365.7,85.0" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/><text x="305.0" y="230.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">lr too high</text><text x="305.0" y="258.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">lower lr, warm-up,</text><text x="305.0" y="272.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">clip gradients</text><rect x="410" y="80" width="170" height="130" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><polyline points="410.0,98.8 468.3,109.8 526.6,120.8 575.1,129.6" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/><text x="495.0" y="230.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">lr too low</text><text x="495.0" y="258.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">raise the lr</text><rect x="600" y="80" width="170" height="130" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><polyline points="600.0,101.0 638.9,156.0 697.1,183.5 765.1,194.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/><polyline points="600.0,105.4 638.9,156.0 677.7,162.6 716.6,153.8 765.1,139.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linejoin="round"/><text x="685.0" y="230.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">overfitting</text><text x="685.0" y="258.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">regularise, augment,</text><text x="685.0" y="272.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">early stop, more data</text><rect x="790" y="80" width="170" height="130" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><polyline points="790.0,106.5 955.1,107.6" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/><text x="875.0" y="230.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">flat from step 0</text><text x="875.0" y="258.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">a bug: overfit</text><text x="875.0" y="272.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">one batch to find it</text></svg>