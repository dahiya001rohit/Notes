<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">Four vision tasks</title><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Four vision tasks</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">From &#x27;what is in the image&#x27; to a label for every pixel</text><rect x="30" y="70" width="210" height="160" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><circle cx="95.0" cy="165.0" r="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><circle cx="185.0" cy="160.0" r="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="135.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">classification</text><text x="135.0" y="272.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">“cat, dog”</text><rect x="268" y="70" width="210" height="160" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><circle cx="333.0" cy="165.0" r="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><circle cx="423.0" cy="160.0" r="36" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><rect x="298" y="130" width="70" height="72" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><text x="320.0" y="124.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">cat 0.94</text><rect x="383" y="120" width="80" height="82" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><text x="418.0" y="114.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">dog 0.88</text><text x="373.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">object detection</text><text x="373.0" y="272.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">boxes + labels</text><rect x="506" y="70" width="210" height="160" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><circle cx="571.0" cy="165.0" r="30" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="661.0" cy="160.0" r="36" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><text x="611.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">both &#x27;animal&#x27; pixels</text><text x="611.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">semantic segmentation</text><text x="611.0" y="272.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">class per pixel</text><rect x="744" y="70" width="210" height="160" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><circle cx="809.0" cy="165.0" r="30" fill="#16a34a" stroke="#16a34a" stroke-width="1.8"/><circle cx="899.0" cy="160.0" r="36" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.8"/><text x="849.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">each object its own mask</text><text x="849.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">instance segmentation</text><text x="849.0" y="272.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">mask per object</text></svg>