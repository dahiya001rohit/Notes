<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">Dataset → DataLoader → batches</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Dataset → DataLoader → batches</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The Dataset gives one example by index; the DataLoader shuffles, batches, collates and can load in parallel</text><rect x="30" y="80" width="200" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="130.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Dataset</text><text x="130.0" y="125.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">__len__() → 60,000</text><text x="130.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">__getitem__(i) →</text><text x="130.0" y="165.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(image, label)</text><text x="130.0" y="205.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">+ transform</text><line x1="230.0" y1="155.0" x2="290.0" y2="155.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="300" y="80" width="260" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="430.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">DataLoader</text><text x="320.0" y="128.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">1. shuffle indices each epoch</text><text x="320.0" y="151.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">2. take batch_size of them</text><text x="320.0" y="174.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">3. collate: stack / pad</text><text x="320.0" y="197.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">4. num_workers in parallel</text><line x1="560.0" y1="155.0" x2="620.0" y2="155.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="630" y="95" width="200" height="90" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><rect x="644" y="109" width="200" height="90" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><rect x="658" y="123" width="200" height="90" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="758.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x: (128, 1, 28, 28)</text><text x="758.0" y="165.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">y: (128,)</text><text x="490.0" y="262.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">for x, y in loader:  ...   # one epoch = len(loader) batches</text></svg>