<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="title"><title id="title">LoRA: the input x goes through the frozen pretrained weight W and, in parallel, through a thin matrix A then a thin matrix B; the two outputs are added</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">LoRA: a small trainable update beside a frozen layer</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">y = W·x + (α/r)·B·A·x.  W (d×k) is frozen; only A (r×k) and B (d×r) are trained, r ≪ d.</text><text x="60" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x</text><line x1="75" y1="170" x2="140" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="75" y1="170" x2="140" y2="224" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="145" y="80" width="180" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="235" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">W (frozen)</text><text x="235" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4096 × 4096 = 16.8M</text><rect x="145" y="196" width="110" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="200" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">A</text><text x="200" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">r × 4096</text><line x1="257" y1="224" x2="285" y2="224" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><rect x="290" y="190" width="56" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="318" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">B</text><text x="318" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4096×r</text><line x1="327" y1="120" x2="420" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="348" y1="224" x2="420" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><circle cx="432" cy="170" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/><text x="432" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+</text><line x1="446" y1="170" x2="490" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="498" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">y</text><text x="530" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">r = 16:</text><text x="530" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A + B = 2 · 16 · 4096</text><text x="530" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">= 131k params (0.8%)</text><text x="530" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">B starts at 0 → no change</text><text x="530" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">at the start of training</text><text x="530" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">after training: W ← W + BA</text><text x="530" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">(merge: zero extra cost)</text></svg>