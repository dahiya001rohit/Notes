<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="980" height="280" role="img" aria-labelledby="title"><title id="title">Autograd records a grad_fn for every operation</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0" y="0" width="980" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Autograd records a grad_fn for every operation</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">loss = (w·3 − 1)²  with w = 2   →   loss.backward() fills w.grad</text><rect x="40" y="90" width="180" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="130.0" y="112.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">w = 2</text><text x="130.0" y="129.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">requires_grad</text><text x="130.0" y="172.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">leaf</text><line x1="220.0" y1="121.0" x2="275.0" y2="121.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)"/><rect x="275" y="90" width="180" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="365.0" y="112.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">w·3 = 6</text><text x="365.0" y="129.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">MulBackward0</text><line x1="455.0" y1="121.0" x2="510.0" y2="121.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)"/><rect x="510" y="90" width="180" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="600.0" y="112.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6 − 1 = 5</text><text x="600.0" y="129.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">SubBackward0</text><line x1="690.0" y1="121.0" x2="745.0" y2="121.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)"/><rect x="745" y="90" width="180" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="835.0" y="112.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5² = 25</text><text x="835.0" y="129.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">PowBackward0</text><text x="835.0" y="172.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">loss</text><text x="490.0" y="76.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">forward →</text><text x="130.0" y="205.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">w.grad = 10·3 = 30</text><text x="365.0" y="205.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">×3</text><text x="600.0" y="205.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">×1</text><text x="835.0" y="205.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">2·5 = 10</text><text x="490.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">← backward: multiply local derivatives from the loss back to the leaf</text><text x="490.0" y="260.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">gradients ADD UP: call optimizer.zero_grad() every step  ·  torch.no_grad() when only predicting</text></svg>