<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="980" height="280" role="img" aria-labelledby="title"><title id="title">What a checkpoint holds</title><rect x="0" y="0" width="980" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">What a checkpoint holds</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Weights alone are enough to predict; resuming training needs the optimiser&#x27;s state too</text><rect x="30" y="82" width="214" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="137.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">model.state_dict()</text><text x="137.0" y="148.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">weights by name</text><rect x="266" y="82" width="214" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="373.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">optimizer.state_dict()</text><text x="373.0" y="148.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Adam: exp_avg, exp_avg_sq</text><rect x="502" y="82" width="214" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="609.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">scheduler.state_dict()</text><text x="609.0" y="148.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">where the LR schedule is</text><rect x="738" y="82" width="214" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="845.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">epoch, best metric</text><text x="845.0" y="148.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">+ RNG states for exactness</text><rect x="30" y="180" width="450" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="255.0" y="201.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">predict / share: weights only → safetensors</text><text x="255.0" y="218.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(safe, fast, no code execution)</text><rect x="500" y="180" width="450" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="725.0" y="201.9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">resume training: all four → torch.save(checkpoint)</text><text x="725.0" y="218.1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">load with weights_only=True (default)</text></svg>