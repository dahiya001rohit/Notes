<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">Absmax INT8 quantisation</title><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Absmax INT8 quantisation</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">scale = max|w| / 127;  q = round(w / scale);  ŵ = q · scale</text><rect x="40" y="80" width="130" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="105.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">w (fp32)</text><rect x="170" y="80" width="70" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="205.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0.12</text><rect x="240" y="80" width="70" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="275.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">−0.50</text><rect x="310" y="80" width="70" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="345.0" y="96.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Robo