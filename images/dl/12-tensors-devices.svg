<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="title"><title id="title">PyTorch tensors = NumPy arrays + devices + autograd</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">PyTorch tensors = NumPy arrays + devices + autograd</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Same ideas (shape, dtype, indexing, broadcasting); tensors can also live on a GPU and record operations</text><rect x="40" y="80" width="230" height="120" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="155.0" y="102.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">NumPy ndarray</text><text x="155.0" y="140.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">shape · dtype · axis=</text><text x="155.0" y="156.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">CPU only</text><line x1="270.0" y1="150.0" x2="360.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="315.0" y="118.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">from_numpy</text><text x="315.0" y="131.7" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">(shares memory)</text><rect x="365" y="80" width="235" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="482.0" y="102.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">torch.Tensor</text><text x="482.0" y="140.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">shape · dtype · dim=</text><text x="482.0" y="156.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+ requires_grad / grad_fn</text><text x="482.0" y="172.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+ .to(device)</text><line x1="600.0" y1="140.0" x2="680.0" y2="93.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="690" y="75" width="110" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="745.0" y="93.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">cpu</text><text x="870.0" y="93.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">always available</text><line x1="600.0" y1="140.0" x2="680.0" y2="138.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="690" y="120" width="110" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="745.0" y="138.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">cuda</text><text x="870.0" y="138.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">NVIDIA GPU</text><line x1="600.0" y1="140.0" x2="680.0" y2="183.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="690" y="165" width="110" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="745.0" y="183.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">mps</text><text x="870.0" y="183.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Apple GPU</text><text x="490.0" y="240.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">device = &quot;cuda&quot; if torch.cuda.is_available() else &quot;mps&quot; if torch.backends.mps.is_available() else &quot;cpu&quot;</text><text x="490.0" y="270.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">model.to(device) and every batch .to(device): an operation needs all its tensors on ONE device</text></svg>