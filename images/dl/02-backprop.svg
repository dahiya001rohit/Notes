<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="title"><title id="title">The forward pass goes left to right from input through layers to predictions and loss; the backward pass goes right to left carrying gradients to every weight; then the optimiser updates the weights</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Forward pass, backward pass, update</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Backpropagation = the chain rule, applied from the loss back to every weight.</text><rect x="30" y="104" width="116" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="88.0" y="127.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">input X</text><rect x="176" y="104" width="116" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="234.0" y="127.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">layer 1</text><rect x="322" y="104" width="116" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="380.0" y="127.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">layer 2</text><rect x="468" y="104" width="116" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="526.0" y="127.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">predictions</text><rect x="614" y="104" width="116" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="672.0" y="127.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">loss</text><line x1="148" y1="118" x2="174" y2="118" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><line x1="174" y1="138" x2="148" y2="138" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)" stroke-dasharray="5 3"/><line x1="294" y1="118" x2="320" y2="118" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><line x1="320" y1="138" x2="294" y2="138" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)" stroke-dasharray="5 3"/><line x1="440" y1="118" x2="466" y2="118" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><line x1="466" y1="138" x2="440" y2="138" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)" stroke-dasharray="5 3"/><line x1="586" y1="118" x2="612" y2="118" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><line x1="612" y1="138" x2="586" y2="138" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)" stroke-dasharray="5 3"/><text x="380" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">forward: compute predictions and loss →</text><text x="380" y="174" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">← backward: ∂loss/∂weight for every weight (chain rule)</text><text x="380" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">update: w ← w − learning_rate · ∂loss/∂w   (repeat for every batch)</text></svg>