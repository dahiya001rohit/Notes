<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title"><title id="title">One neuron = one straight line</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">One neuron = one straight line</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">z = w·x + b, output = activation(z). AND and OR are linearly separable; XOR is not</text><circle cx="60.0" cy="110.0" r="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="60.0" y="110.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x₁</text><line x1="80.0" y1="110.0" x2="175.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="125.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">w₁</text><circle cx="60.0" cy="190.0" r="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="60.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x₂</text><line x1="80.0" y1="190.0" x2="175.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="125.0" y="196.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">w₂</text><circle cx="205.0" cy="150.0" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="205.0" y="150.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Σ + b</text><line x1="235.0" y1="150.0" x2="290.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="295" y="128" width="90" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="340.0" y="150.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">step / σ</text><line x1="385.0" y1="150.0" x2="425.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="450.0" y="150.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">y</text><rect x="510" y="80" width="130" height="130" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><circle cx="530.0" cy="190.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><circle cx="530.0" cy="100.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><circle cx="620.0" cy="190.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><circle cx="620.0" cy="100.0" r="9" fill="#16a34a" stroke="#16a34a" stroke-width="1.8"/><line x1="557.0" y1="82.0" x2="638.0" y2="163.0" stroke="#2563eb" stroke-width="2.2"/><text x="575.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">AND</text><rect x="668" y="80" width="130" height="130" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><circle cx="688.0" cy="190.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><circle cx="688.0" cy="100.0" r="9" fill="#16a34a" stroke="#16a34a" stroke-width="1.8"/><circle cx="778.0" cy="190.0" r="9" fill="#16a34a" stroke="#16a34a" stroke-width="1.8"/><circle cx="778.0" cy="100.0" r="9" fill="#16a34a" stroke="#16a34a" stroke-width="1.8"/><line x1="670.0" y1="127.0" x2="751.0" y2="208.0" stroke="#2563eb" stroke-width="2.2"/><text x="733.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">OR</text><rect x="826" y="80" width="130" height="130" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><circle cx="846.0" cy="190.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><circle cx="846.0" cy="100.0" r="9" fill="#16a34a" stroke="#16a34a" stroke-width="1.8"/><circle cx="936.0" cy="190.0" r="9" fill="#16a34a" stroke="#16a34a" stroke-width="1.8"/><circle cx="936.0" cy="100.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><text x="891.0" y="145.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">no single</text><text x="891.0" y="160.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">line works</text><text x="891.0" y="232.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">XOR</text><text x="490.0" y="280.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">green = 1, red = 0. XOR needs two lines → two neurons in a hidden layer feeding a third (Section 6)</text></svg>