<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" role="img" aria-labelledby="title"><title id="title">Inside a (decoder) transformer</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="980" height="440" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Inside a (decoder) transformer</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Pre-norm block: x = x + Attention(LN(x));  x = x + MLP(LN(x)).  Repeat N times.</text><rect x="300" y="365" width="380" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="490.0" y="387.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">token embeddings + positions</text><rect x="260" y="143" width="460" height="205" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><text x="790.0" y="245.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">× N blocks</text><rect x="330" y="303" width="320" height="32" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="490.0" y="319.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">LayerNorm</text><rect x="330" y="261" width="320" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="490.0" y="277.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">masked multi-head self-attention</text><circle cx="490.0" cy="235.0" r="11" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="490.0" y="235.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+</text><rect x="330" y="193" width="320" height="32" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="490.0" y="209.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">LayerNorm</text><rect x="330" y="151" width="320" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="490.0" y="167.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">feed-forward MLP (d → 4d → d)</text><circle cx="490.0" cy="130.0" r="11" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="490.0" y="130.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+</text><line x1="490.0" y1="365.0" x2="490.0" y2="337.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="490.0" y1="303.0" x2="490.0" y2="295.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="490.0" y1="261.0" x2="490.0" y2="247.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="490.0" y1="224.0" x2="490.0" y2="227.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="490.0" y1="193.0" x2="490.0" y2="185.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="490.0" y1="151.0" x2="490.0" y2="142.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><path d="M 300 355 L 290 355 L 290 235 L 478 235" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M 300 225 L 280 225 L 280 130 L 478 130" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4"/><text x="240.0" y="290.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">residual</text><text x="240.0" y="175.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">residual</text><rect x="330" y="87" width="320" height="32" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="490.0" y="103.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">final LayerNorm → linear → softmax</text><line x1="490.0" y1="119.0" x2="490.0" y2="120.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><text x="790.0" y="103.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">next-token probabilities</text></svg>