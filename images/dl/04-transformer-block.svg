<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-labelledby="title"><title id="title">A transformer: token embeddings plus positions enter a block with layer norm, multi-head self-attention and a residual add, then layer norm, a feed-forward MLP and another residual add; the block repeats N times and ends with a linear layer and softmax over the vocabulary</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="424" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Inside a (decoder) transformer</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">Pre-norm block: x = x + Attention(LN(x));  x = x + MLP(LN(x)).  Repeat N times.</text><rect x="250" y="364" width="260" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="380.0" y="384.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">token embeddings + positions</text><rect x="220" y="138" width="320" height="214" rx="12" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/><text x="550" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#7c3aed">× N blocks</text><rect x="250" y="310" width="260" height="30" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="380.0" y="325.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">LayerNorm</text><rect x="250" y="270" width="260" height="30" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="380.0" y="285.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">masked multi-head self-attention</text><rect x="250" y="218" width="260" height="30" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="380.0" y="233.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">LayerNorm</text><rect x="250" y="178" width="260" height="30" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="380.0" y="193.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">feed-forward MLP (d → 4d → d)</text><line x1="380.0" y1="364" x2="380.0" y2="342" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="380.0" y1="310" x2="380.0" y2="302" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="380.0" y1="270" x2="380.0" y2="250" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="380.0" y1="218" x2="380.0" y2="210" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="380.0" y1="178" x2="380.0" y2="110" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><circle cx="380.0" cy="260" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/><text x="380.0" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+</text><circle cx="380.0" cy="164" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/><text x="380.0" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+</text><path d="M250,352 L232,352 L232,260 L369.0,260" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#ad97706)" stroke-dasharray="4 3"/><path d="M250,254 L232,254 L232,164 L369.0,164" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#ad97706)" stroke-dasharray="4 3"/><text x="226" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#d97706">residual</text><text x="226" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#d97706">residual</text><rect x="250" y="80" width="260" height="30" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="380.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">LayerNorm → linear → softmax over vocabulary</text><text x="40" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">input: token ids</text><text x="560" y="95" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#dc2626">next-token probabilities</text></svg>