<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">Left: one neuron multiplies inputs by weights, adds a bias and applies an activation. Right: a network of an input layer, two hidden layers and an output layer, fully connected</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A neuron, and a network of neurons</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Each neuron: activation(w · x + b). Each layer: activation(X @ W + b).</text><circle cx="50" cy="110" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="50" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x₁</text><line x1="66" y1="110" x2="158" y2="160" stroke="#64748b" stroke-width="1.6" marker-end="url(#a64748b)"/><text x="108" y="127.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">w₁</text><circle cx="50" cy="160" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="50" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x₂</text><line x1="66" y1="160" x2="158" y2="160" stroke="#64748b" stroke-width="1.6" marker-end="url(#a64748b)"/><text x="108" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">w₂</text><circle cx="50" cy="210" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="50" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x₃</text><line x1="66" y1="210" x2="158" y2="160" stroke="#64748b" stroke-width="1.6" marker-end="url(#a64748b)"/><text x="108" y="177.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">w₃</text><circle cx="190" cy="160" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="190" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Σ + b</text><text x="190" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">then f</text><line x1="222" y1="160" x2="262" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="268" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">y = f(w·x + b)</text><text x="40" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">f = activation: ReLU, GELU, sigmoid…</text><text x="40" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">without f, stacked layers collapse into one linear layer</text><line x1="481" y1="131.0" x2="529" y2="97.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="131.0" x2="529" y2="131.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="131.0" x2="529" y2="165.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="131.0" x2="529" y2="199.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="131.0" x2="529" y2="233.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="165.0" x2="529" y2="97.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="165.0" x2="529" y2="131.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="165.0" x2="529" y2="165.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="165.0" x2="529" y2="199.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="165.0" x2="529" y2="233.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="199.0" x2="529" y2="97.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="199.0" x2="529" y2="131.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="199.0" x2="529" y2="165.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="199.0" x2="529" y2="199.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="481" y1="199.0" x2="529" y2="233.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="551" y1="97.0" x2="599" y2="97.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="551" y1="97.0" x2="599" y2="131.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="551" y1="97.0" x2="599" y2="165.0" stroke="#94a3b8" stroke-width="0.8"/><line x1="551" y1="97.0" x2="599" y2