<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title"><title id="title">Three chunking strategies: fixed windows with overlap cut sentences; recursive splitting follows paragraphs and sentences; structure-aware splitting follows headings and records the heading path</title><defs></defs><rect x="0" y="0" width="760" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Chunking strategies</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Same document, three ways to cut it.</text><text x="134" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Fixed size + overlap</text><rect x="24" y="94" width="220" height="200" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="378" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Recursive</text><rect x="268" y="94" width="220" height="200" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="622" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Structure-aware</text><rect x="512" y="94" width="220" height="200" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="34" y="104" width="200" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="134" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">…within 5-7 working da</text><rect x="34" y="148" width="200" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="134" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ys. UPI and wallet refu</text><rect x="34" y="192" width="200" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="134" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">nds usually arrive in…</text><rect x="34" y="236" width="200" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="134" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">…10 working days.</text><text x="134" y="285" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">cuts words and sentences</text><rect x="278" y="104" width="200" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="378" y="126.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">paragraph 1 (fits)</text><rect x="278" y="158" width="200" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="378" y="174.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">long paragraph → sentences</text><rect x="278" y="200" width="200" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="378" y="216.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">sentence  ·  sentence</text><rect x="278" y="242" width="200" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="378" y="258.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">paragraph 3 (fits)</text><text x="378" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">\n\n → \n → . → space</text><rect x="522" y="104" width="200" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="622" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Refunds › Timelines</text><text x="622" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5-7 working days…</text><rect x="522" y="162" width="200" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="622" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Refunds › COD orders</text><text x="622" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">wallet or bank…</text><rect x="522" y="220" width="200" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="622" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Refunds › Partial</text><text x="622" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">damaged or incomplete…</text><text x="622" y="285" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">heading path kept as metadata</text></svg>