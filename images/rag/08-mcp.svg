<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="title"><title id="title">MCP architecture: a host application contains one client per server; servers for GitHub, a database and the shop's order API expose tools, resources and prompts over stdio or Streamable HTTP</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Model Context Protocol (MCP)</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Build a server once; any MCP host can use it.</text><rect x="20" y="70" width="250" height="240" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="145" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">Host (AI application)</text><text x="145" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Claude, IDE, your agent</text><rect x="40" y="128" width="210" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="145" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">MCP client 1</text><line x1="252" y1="150" x2="466" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="360" y="141" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">stdio or HTTP</text><rect x="470" y="124" width="270" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="605" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">GitHub server</text><text x="605" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tools: create_issue…</text><rect x="40" y="188" width="210" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="145" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">MCP client 2</text><line x1="252" y1="210" x2="466" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="360" y="201" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">stdio (local)</text><rect x="470" y="184" width="270" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="605" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Database server</text><text x="605" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">resources: schema</text><rect x="40" y="248" width="210" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="145" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">MCP client 3</text><line x1="252" y1="270" x2="466" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="360" y="261" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Streamable HTTP + OAuth</text><rect x="470" y="244" width="270" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="605" y="260" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">ShopKart server</text><text x="605" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tools: get_order_status</text><text x="380" y="332" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">JSON-RPC messages: list_tools · call_tool · read_resource · get_prompt</text></svg>