ans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Hybrid index</text><text x="475.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">BM25 + vectors</text><text x="475.0" y="135" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">metadata + ACLs</text><line x1="172" y1="130" x2="196" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="372" y1="130" x2="396" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="20" y="230" width="120" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="80.0" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">User</text><text x="80.0" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">chat UI,</text><text x="80.0" y="285" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">streaming</text><rect x="160" y="230" width="120" height="80" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="220.0" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0891b2">Gateway</text><text x="220.0" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">auth, limits,</text><text x="220.0" y="285" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">user groups</text><rect x="300" y="214" width="260" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="430.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">Agent orchestrator</text><text x="430.0" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">rewrite follow-ups</text><text x="430.0" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">search (ACL filter) → rerank</text><text x="430.0" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tools via MCP (confirm)</text><text x="430.0" y="303" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">answer + citations / abstain</text><line x1="142" y1="270" x2="156" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="282" y1="270" x2="296" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><path d="M475,212 L475,182" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><rect x="590" y="214" width="150" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="665.0" y="239.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">LLMs</text><rect x="590" y="276" width="150" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="665.0" y="301.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">MCP tools</text><line x1="562" y1="239" x2="586" y2="239" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="562" y1="301" x2="586" y2="301" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="590" y="80" width="150" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="665.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">Tracing &amp; evals</text><text x="665.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">traces, cost, latency</text><text x="665.0" y="135" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">test set, judges</text><text x="665.0" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="