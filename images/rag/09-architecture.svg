<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="title"><title id="title">Enterprise knowledge assistant: connectors feed ingestion into a hybrid index with ACLs; at query time the gateway authenticates, the orchestrator rewrites, searches with permission filters, reranks, calls MCP tools and answers with citations; tracing and evaluation run alongside</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Enterprise knowledge assistant: architecture</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Ingestion keeps the index fresh and permission-aware; the orchestrator answers and acts.</text><rect x="20" y="80" width="150" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="95.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Connectors</text><text x="95.0" y="118" 