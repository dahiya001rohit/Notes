<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Corrective RAG graph: START to retrieve to grade; relevant goes to generate then END; not relevant goes to rewrite and back to retrieve, at most twice, else give up</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A LangGraph: corrective RAG</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Nodes are functions, edges decide what runs next, state flows through.</text><rect x="20" y="128" width="80" height="44" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="60.0" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">START</text><rect x="140" y="128" width="110" height="44" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="195.0" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">retrieve</text><rect x="290" y="128" width="110" height="44" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="345.0" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">grade</text><rect x="470" y="70" width="110" height="44" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="525.0" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">generate</text><rect x="470" y="186" width="110" height="44" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="525.0" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">give_up</text><rect x="290" y="236" width="110" height="44" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="345.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">rewrite</text><rect x="640" y="128" width="80" height="44" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="680.0" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">END</text><line x1="102" y1="150" x2="136" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="252" y1="150" x2="286" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><path d="M402,140 L466,96" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="420" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#16a34a">relevant</text><path d="M402,160 L466,204" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)"/><text x="452" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#dc2626">attempts ≥ 2</text><path d="M345,174 L345,232" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a7c3aed)" stroke-dasharray="5 4"/><text x="352" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#7c3aed">not relevant</text><path d="M288,258 L195,258 L195,176" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a7c3aed)" stroke-dasharray="5 4"/><text x="200" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#7c3aed">loop back</text><line x1="582" y1="92" x2="660" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="582" y1="208" x2="660" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="620" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">state: question, documents,</text><text x="620" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">relevant, attempts, answer</text></svg>