<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Offline indexing: documents are loaded, chunked, and indexed with metadata. Online: a question retrieves top chunks, which are put into the prompt, and the LLM answers with citations</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The RAG pipeline</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Indexing happens when documents change; answering happens for every question.</text><rect x="20" y="66" width="720" height="118" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="34" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#64748b">OFFLINE · indexing</text><rect x="40" y="96" width="140" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">load</text><text x="110.0" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">PDF, HTML, wiki,</text><text x="110.0" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tickets, DB rows</text><line x1="182" y1="134" x2="212" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="216" y="96" width="140" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="286.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">clean</text><text x="286.0" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">remove menus,</text><text x="286.0" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">headers, junk</text><line x1="358" y1="134" x2="388" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="392" y="96" width="140" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="462.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">chunk</text><text x="462.0" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">200–500 tokens</text><text x="462.0" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+ heading path</text><line x1="534" y1="134" x2="564" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="568" y="96" width="140" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="638.0" y="114" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">index</text><text x="638.0" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">BM25 + vectors</text><text x="638.0" y="151" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+ metadata, ACLs</text><rect x="20" y="196" width="720" height="148" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="34" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#64748b">ONLINE · per question</text><rect x="40" y="226" width="140" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="110.0" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">question</text><text x="110.0" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">“How long do card</text><text x="110.0" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">refunds take?”</text><line x1="182" y1="264" x2="212" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="216" y="226" width="140" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="286.0" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">retrieve</text><text x="286.0" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">top-k chunks</text><text x="286.0" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">from the index</text><line x1="358" y1="264" x2="388" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="392" y="226" width="140" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="462.0" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">augment</text><text x="462.0" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">&lt;documents&gt; +</text><text x="462.0" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">rules + question</text><line x1="534" y1="264" x2="564" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="568" y="226" width="140" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="638.0" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">generate</text><text x="638.0" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">answer from docs</text><text x="638.0" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">+ citations [id]</text><path d="M638,172 L638,190 L286,190 L286,224" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)" stroke-dasharray="5 4"/><text x="470" y="318" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">check: cited ids were provided? answer grounded? else “I don't know”</text></svg>