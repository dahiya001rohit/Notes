<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">Supervisor pattern: a supervisor sends subtasks to parallel workers and combines short reports. Handoffs: triage passes the conversation to billing or returns specialists, each with its own tools</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Multi-agent patterns</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Parallel workers with clean contexts, or specialists that take over the conversation.</text><text x="190" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">Supervisor / orchestrator–workers</text><rect x="120" y="94" width="140" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="190.0" y="117.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">supervisor</text><rect x="30" y="190" width="100" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="80.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">worker 1</text><line x1="170" y1="142" x2="70" y2="188" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><line x1="92" y1="188" x2="212" y2="144" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a16a34a)" stroke-dasharray="4 3"/><rect x="140" y="190" width="100" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="190.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">worker 2</text><line x1="170" y1="142" x2="180" y2="188" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><line x1="202" y1="188" x2="212" y2="144" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a16a34a)" stroke-dasharray="4 3"/><rect x="250" y="190" width="100" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">worker 3</text><line x1="170" y1="142" x2="290" y2="188" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><line x1="312" y1="188" x2="212" y2="144" stroke="#16a34a" stroke-width="1.4" marker-end="url(#a16a34a)" stroke-dasharray="4 3"/><text x="190" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Send() fans out in parallel; each worker</text><text x="190" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">has its own context, returns a short report</text><line x1="380" y1="70" x2="380" y2="300" stroke="#cbd5e1" stroke-width="1"/><text x="570" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Handoffs (triage → specialist)</text><rect x="500" y="94" width="140" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="570.0" y="117.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">triage</text><rect x="410" y="186" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="485.0" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">billing agent</text><text x="485.0" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">get_payment</text><text x="485.0" y="241" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">create_refund</text><rect x="590" y="186" width="150" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="665.0" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">returns agent</text><text x="665.0" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">create_return</text><line x1="550" y1="142" x2="490" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="590" y1="142" x2="660" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="575" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">each specialist sees only its own tools</text></svg>