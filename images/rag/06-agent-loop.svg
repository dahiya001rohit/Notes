<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title"><title id="title">Workflows, where code decides the steps, versus an agent loop, where the model decides: think, act with a tool, observe the result, repeat until done or a limit</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Workflows vs agents</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Who decides the next step: your code, or the model?</text><rect x="20" y="66" width="340" height="248" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="190" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Workflow patterns (code decides)</text><rect x="34" y="104" width="312" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="46" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">chain</text><text x="150" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A → check → B → C</text><rect x="34" y="144" width="312" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="46" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">route</text><text x="150" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">classify → one of N paths</text><rect x="34" y="184" width="312" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="46" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">parallel</text><text x="150" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">split / vote, then combine</text><rect x="34" y="224" width="312" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="46" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">orchestrator</text><text x="150" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">plan → workers → merge</text><rect x="34" y="264" width="312" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="46" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">evaluator</text><text x="150" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">generate ⇄ critique</text><rect x="380" y="66" width="360" height="248" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="560" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">Agent loop (model decides)</text><rect x="502" y="108" width="116" height="32" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="560" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">think / plan</text><rect x="612" y="180" width="116" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="670" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">act: tool call</text><rect x="502" y="252" width="116" height="32" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="560" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">observe result</text><rect x="392" y="180" width="116" height="32" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">goal + context</text><path d="M610,136 Q660,136 668,176" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><path d="M668,216 Q660,256 620,260" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><path d="M500,260 Q460,256 452,216" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><path d="M452,176 Q460,136 500,132" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><text x="560" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">until done</text><text x="560" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">or a limit</text></svg>