<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">An HTTP exchange: the client sends a request with a method, URL, headers and an optional body; the server replies with a status code, headers and a body; JSON APIs use content-type application/json</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">An HTTP request and response</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Every API call is this exchange.</text><rect x="24" y="70" width="330" height="220" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="189" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Request (client → server)</text><text x="40" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">POST /orders HTTP/1.1</text><text x="40" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Host: api.chaipoint.example</text><text x="40" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Content-Type: application/json</text><text x="40" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Authorization: Bearer eyJhbGc…</text><text x="40" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a"></text><text x="40" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">{ "item": "Masala chai", "qty": 2 }</text><rect x="406" y="70" width="330" height="220" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="571" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Response (server → client)</text><text x="422" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">HTTP/1.1 201 Created</text><text x="422" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Content-Type: application/json</text><text x="422" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Location: /orders/90312</text><text x="422" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a"></text><text x="422" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">{ "id": 90312, "item": "Masala chai",</text><text x="422" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">  "qty": 2 }</text><line x1="356" y1="140" x2="402" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="402" y1="200" x2="356" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="190" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">method · URL · headers · body</text><text x="571" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">status · headers · body</text></svg>