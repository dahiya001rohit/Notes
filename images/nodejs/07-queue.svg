<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">A job queue: the API adds a job to a Redis-backed queue and responds immediately; separate worker processes take jobs, retry failures with backoff, and move permanently failed jobs aside for inspection</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Background jobs with a queue</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The API answers fast; workers do the slow work and retry failures.</text><rect x="24" y="100" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="99.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">API</text><text x="99.0" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">queue.add(job)</text><text x="99.0" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">→ 202 / 201 fast</text><rect x="220" y="100" width="230" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="335" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Queue (Redis)</text><rect x="236" y="134" width="32" height="24" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="252" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">j1</text><rect x="276" y="134" width="32" height="24" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="292" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">j2</text><rect x="316" y="134" width="32" height="24" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="332" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">j3</text><rect x="356" y="134" width="32" height="24" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="372" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">j4</text><rect x="396" y="134" width="32" height="24" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="412" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">j5</text><line x1="176" y1="135" x2="216" y2="135" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="520" y="70" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="620.0" y="88" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">worker 1</text><text x="620.0" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">concurrency 2</text><line x1="452" y1="135" x2="516" y2="100" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><rect x="520" y="150" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="620.0" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">worker 2</text><text x="620.0" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">concurrency 2</text><line x1="452" y1="135" x2="516" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><path d="M620,212 C 620,250 400,250 360,174" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#ad97706)" stroke-dasharray="4 3"/><text x="520" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">retry with backoff (1 s, 2 s, 4 s…)</text><rect x="220" y="214" width="180" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="310.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">failed set</text><text x="310.0" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">after all attempts</text></svg>