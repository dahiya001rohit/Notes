<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="title"><title id="title">A stream pipeline: a readable file stream sends chunks through a transform that parses CSV rows, then through gzip, into a writable file; backpressure makes the source pause when the destination is slow, so memory stays small</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Streams: data in small chunks</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">await pipeline(createReadStream('sales.csv'), csvFilter, createGzip(), createWriteStream('out.csv.gz'))</text><rect x="24" y="90" width="160" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="104.0" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Readable</text><text x="104.0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">sales.csv (1.6 GB)</text><line x1="186" y1="118" x2="208" y2="118" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="188" y="132" width="4" height="10" rx="1" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><rect x="194" y="132" width="4" height="10" rx="1" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><rect x="200" y="132" width="4" height="10" rx="1" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><rect x="210" y="90" width="160" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="290.0" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Transform</text><text x="290.0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">filter CSV rows</text><line x1="372" y1="118" x2="394" y2="118" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><rect x="374" y="132" width="4" height="10" rx="1" fill="#d97706" stroke="#d97706" stroke-width="0"/><rect x="380" y="132" width="4" height="10" rx="1" fill="#d97706" stroke="#d97706" stroke-width="0"/><rect x="386" y="132" width="4" height="10" rx="1" fill="#d97706" stroke="#d97706" stroke-width="0"/><path d="M230,162 C 200,200 170,200 160,164" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)" stroke-dasharray="4 3"/><rect x="396" y="90" width="160" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="476.0" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Transform</text><text x="476.0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">gzip</text><line x1="558" y1="118" x2="580" y2="118" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><rect x="560" y="132" width="4" height="10" rx="1" fill="#d97706" stroke="#d97706" stroke-width="0"/><rect x="566" y="132" width="4" height="10" rx="1" fill="#d97706" stroke="#d97706" stroke-width="0"/><rect x="572" y="132" width="4" height="10" rx="1" fill="#d97706" stroke="#d97706" stroke-width="0"/><path d="M416,162 C 386,200 356,200 346,164" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)" stroke-dasharray="4 3"/><rect x="582" y="90" width="160" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="662.0" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Writable</text><text x="662.0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">out.csv.gz</text><path d="M602,162 C 572,200 542,200 532,164" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)" stroke-dasharray="4 3"/><text x="380" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">backpressure: a slow step tells the previous one to pause</text><text x="380" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">memory stays at a few chunks (~64 KB each), whatever the file size</text></svg>