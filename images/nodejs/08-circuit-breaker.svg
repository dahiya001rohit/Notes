<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="title"><title id="title">A circuit breaker: closed lets calls through and counts failures; after too many failures it opens and fails fast without calling the service; after a cool-down it goes half-open, lets one trial call through, and closes again if it succeeds</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Circuit breaker states</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Stop hammering a failing dependency; test it again after a cool-down.</text><circle cx="110" cy="140" r="58" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="110" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">CLOSED</text><text x="110" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">calls go through</text><circle cx="380" cy="140" r="58" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="380" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">OPEN</text><text x="380" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">fail fast + fallback</text><circle cx="650" cy="140" r="58" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="650" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">HALF-OPEN</text><text x="650" y="154" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">one trial call</text><line x1="170" y1="120" x2="320" y2="120" stroke="#dc2626" stroke-width="2" marker-end="url(#adc2626)"/><text x="245" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">N failures</text><line x1="440" y1="120" x2="590" y2="120" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><text x="515" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">cool-down passed</text><path d="M620,196 C 520,260 240,260 140,196" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="380" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">trial succeeds → close</text><path d="M600,170 L440,170" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)" stroke-dasharray="4 3"/><text x="520" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">trial fails → open</text></svg>