<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="title"><title id="title">Express middleware pipeline: a request passes through middleware in order (logging, JSON body parsing, authentication), reaches a route handler that sends the response, and any error jumps to the error-handling middleware at the end</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The Express middleware pipeline</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Each step calls next() or sends a response; errors skip ahead to the error handler.</text><rect x="24" y="90" width="128" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="88.0" y="116.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">request ID</text><line x1="154" y1="116" x2="168" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="170" y="90" width="128" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="234.0" y="116.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">logger</text><line x1="300" y1="116" x2="314" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="316" y="90" width="128" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="380.0" y="116.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">express.json()</text><line x1="446" y1="116" x2="460" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="462" y="90" width="128" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="526.0" y="116.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">requireUser</text><line x1="592" y1="116" x2="606" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="608" y="90" width="128" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="672.0" y="116.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">route handler</text><text x="95" y="162" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">next()</text><rect x="490" y="190" width="246" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="613.0" y="218.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">error handler (err, req, res, next)</text><path d="M540,142 L540,186" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)" stroke-dasharray="4 3"/><path d="M660,142 L660,186" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)" stroke-dasharray="4 3"/><text x="470" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#dc2626">401 / throw</text><text x="24" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">res.status(201).json(order) ends the chain</text></svg>