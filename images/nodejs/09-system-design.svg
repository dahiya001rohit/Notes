<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">A typical scalable backend: clients reach a CDN and load balancer, stateless API instances behind it, a cache (Redis), a primary database with read replicas, a message queue feeding background workers, and object storage for files</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A typical scalable backend</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Stateless app servers in the middle; state lives in the data layer.</text><rect x="24" y="150" width="110" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="79.0" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Clients</text><text x="79.0" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">web · mobile</text><rect x="160" y="150" width="110" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="215.0" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">CDN + LB</text><text x="215.0" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">TLS, caching</text><rect x="300" y="80" width="130" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="365.0" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">API #1</text><text x="365.0" y="118" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">stateless Node</text><line x1="272" y1="180" x2="296" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="300" y="150" width="130" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="365.0" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">API #2</text><text x="365.0" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">stateless Node</text><line x1="272" y1="180" x2="296" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="300" y="220" width="130" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="365.0" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">API #3</text><text x="365.0" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">stateless Node</text><line x1="272" y1="180" x2="296" y2="245" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="136" y1="180" x2="156" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="500" y="48" width="170" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="585" y="65" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Redis</text><text x="585" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">cache · sessions · limits</text><line x1="432" y1="175" x2="496" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="500" y="108" width="170" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="585" y="125" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">Postgres primary</text><text x="585" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" fo