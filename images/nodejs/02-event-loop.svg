<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">The Node.js event loop phases: timers, pending callbacks, poll for I/O, check (setImmediate), close callbacks; between every callback Node drains process.nextTick and then the promise microtask queue; slow file, DNS, crypto and zlib work runs on the libuv thread pool</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The Node.js event loop</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The loop cycles through phases; microtask queues are emptied between callbacks.</text><line x1="263.61289456158323" y1="106.60397947215179" x2="324.290300301214" y2="143.69594721410462" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="348.1543815442884" y1="205.49196774195283" x2="324.97767490091746" y2="265.5080322580472" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="246.22886158240863" y1="303.7000733137436" x2="207.77113841759143" y2="303.7000733137436" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="125.0223250990826" y1="265.5080322580472" x2="101.84561845571156" y2="205.49196774195286" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="125.70969969878595" y1="143.69594721410465" x2="186.38710543841677" y2="106.6039794721518" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="163.0" y="61.0" width="124" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="225.0" y="78.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">timers</text><text x="225.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">setTimeout / setInterval</text><rect x="300.90319486279725" y="145.2999266862564" width="124" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="362.90319486279725" y="162.2999266862564" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">pending</text><text x="362.90319486279725" y="179.2999266862564" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">deferred system callbacks</text><rect x="248.22886158240863" y="281.7000733137436" width="124" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="310.2288615824086" y="298.7000733137436" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">poll</text><text x="310.2288615824086" y="315.7000733137436" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">new I/O events (wait here)</text><rect x="77.77113841759143" y="281.7000733137436" width="124" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="139.77113841759143" y="298.7000733137436" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">check</text><text x="139.77113841759143" y="315.7000733137436" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">setImmediate</text><rect x="25.096805137202722" y="145.29992668625644" width="124" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="87.09680513720272" y="162.29992668625644" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">close</text><text x="87.09680513720272" y="179.29992668625644" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">socket.on('close')</text><rect x="430" y="78" width="306" height="108" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="583" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Between every callback</text><text x="446" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">1. process.nextTick queue</text><text x="446" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">2. promise microtasks (then / await)</text><text x="446" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">(ESM top level: promises first)</text><rect x="430" y="210" width="306" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="583" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">libuv thread pool (4 threads)</text><text x="446" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">fs · dns.lookup · crypto (scrypt, pbkdf2) · zlib</text><text x="446" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">network I/O: OS async APIs (epoll/kqueue)</text><text x="446" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">results come back as poll-phase callbacks</text></svg>