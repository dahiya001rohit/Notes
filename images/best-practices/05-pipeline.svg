<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">A CI/CD pipeline: on every pull request install with the lockfile, lint and type-check, test, build and scan; after merge, the same artifact goes through migrations, staging, a canary and then 100%, with rollback if metrics get worse</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">From commit to production</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Fast checks first; build once; promote the same artifact.</text><text x="24" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">CI on every pull request</text><rect x="24" y="102" width="156" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="102.0" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">install</text><text x="102.0" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">lockfile</text><line x1="182" y1="130" x2="202" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="204" y="102" width="156" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="282.0" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">lint + types</text><text x="282.0" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">fast checks</text><line x1="362" y1="130" x2="382" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="384" y="102" width="156" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="462.0" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">tests</text><text x="462.0" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">real DB</text><line x1="542" y1="130" x2="562" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="564" y="102" width="156" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="642.0" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">build + scan</text><text x="642.0" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">image @sha</text><text x="736" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#16a34a">CD after merge (the same image)</text><rect x="24" y="214" width="156" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="102.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">migrate</text><text x="102.0" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">expand first</text><line x1="182" y1="242" x2="202" y2="242" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><rect x="204" y="214" width="156" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="282.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">staging</text><text x="282.0" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">smoke tests</text><line x1="362" y1="242" x2="382" y2="242" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><rect x="384" y="214" width="156" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="462.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">canary 5%</text><text x="462.0" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">watch metrics</text><line x1="542" y1="242" x2="562" y2="242" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><rect x="564" y="214" width="156" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="642.0" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">100%</text><text x="642.0" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">or roll back</text><path d="M642,160 C 642,190 102,180 102,210" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#ad97706)" stroke-dasharray="4 3"/></svg>