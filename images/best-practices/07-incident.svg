<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="title"><title id="title">The incident loop: detect, declare with a severity and an incident commander, assess impact, mitigate first, verify recovery, then learn through a blameless postmortem whose action items make the next incident smaller</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0" y="0" width="760" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The incident loop</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Mitigate before you root-cause; learn without blame.</text><rect x="24" y="92" width="104" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="76.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Detect</text><text x="76.0" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">alert · report</text><line x1="130" y1="120" x2="144" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="146" y="92" width="104" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="198.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Declare</text><text x="198.0" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">SEV · IC</text><line x1="252" y1="120" x2="266" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="268" y="92" width="104" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="320.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Assess</text><text x="320.0" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">who? since?</text><line x1="374" y1="120" x2="388" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="390" y="92" width="104" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="442.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">Mitigate</text><text x="442.0" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">rollback · flag</text><line x1="496" y1="120" x2="510" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="512" y="92" width="104" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="564.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Verify</text><text x="564.0" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">metrics OK</text><line x1="618" y1="120" x2="632" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="634" y="92" width="104" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="686.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">Learn</text><text x="686.0" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">postmortem</text><path d="M686,150 C 686,215 76,215 76,152" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a7c3aed)" stroke-dasharray="4 3"/><text x="380" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">action items (prevent · detect · mitigate) make the next incident smaller</text><text x="390" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">stop the bleeding first</text></svg>