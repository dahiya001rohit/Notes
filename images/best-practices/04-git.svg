<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title"><title id="title">Git basics: files move from the working tree to the staging area with git add and into the repository with git commit; a feature branch diverges from main and comes back through a pull request</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Git's three areas and a feature branch</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">edit → git add → git commit → git push → pull request → merge</text><rect x="24" y="72" width="160" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="104.0" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Working tree</text><text x="104.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">your files</text><line x1="186" y1="102" x2="204" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="206" y="72" width="160" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="286.0" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Staging area</text><text x="286.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">the next commit</text><line x1="368" y1="102" x2="386" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="388" y="72" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="468.0" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Repository</text><text x="468.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">commits (history)</text><line x1="550" y1="102" x2="568" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="570" y="72" width="160" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="650.0" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">Remote</text><text x="650.0" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">origin (GitHub)</text><text x="195" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">git add -p</text><text x="377" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">git commit</text><text x="559" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">git push</text><line x1="40" y1="230" x2="720" y2="230" stroke="#64748b" stroke-width="2"/><circle cx="60" cy="230" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><circle cx="150" cy="230" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><circle cx="330" cy="230" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><circle cx="560" cy="230" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><circle cx="650" cy="230" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="30" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">main</text><path d="M150,230 C 180,280 200,280 240,280 L 460,280 C 500,280 530,240 560,230" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="260" cy="280" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><circle cx="340" cy="280" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><circle cx="420" cy="280" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="250" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">feat/coupons: small commits → PR → review → merge</text></svg>