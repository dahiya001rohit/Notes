<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Sticky percentage rollouts: hash of flagKey and userId gives a bucket from 0 to 9999; users whose bucket is below the threshold get the feature; raising the percentage from 10 to 25 moves the threshold right, only adding users</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Sticky, monotonic rollouts</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">bucket = fnv1a32(flagKey + ":" + userId) % 10000</text><rect x="40" y="150" width="680" height="34" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><rect x="40" y="150" width="170.0" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="0"/><rect x="40" y="150" width="68.0" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="0"/><rect x="40" y="150" width="680" height="34" rx="6" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="74.0" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">10%</text><text x="159.0" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">+15%</text><text x="465.0" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">old experience (75%)</text><text x="40" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><text x="720" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">9999</text><line x1="84.064" y1="100" x2="84.064" y2="146" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a16a34a)"/><text x="84.064" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">u_2 → 648</text><line x1="278.34000000000003" y1="100" x2="278.34000000000003" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><text x="278.34000000000003" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">u_1 → 3505</text><line x1="602.156" y1="100" x2="602.156" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#a64748b)"/><text x="602.156" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">u_3 → 8267</text><text x="380" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">same user → same bucket on every server (sticky) · raising 10% → 25% only adds users (monotonic)</text><text x="380" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">salting with the flag key makes each flag pick an independent set of users</text></svg>