<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img" aria-labelledby="title"><title id="title">FastAPI learning path in six parts across five levels</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="334" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The learning path: 6 parts, 5 levels</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Basic → Easy → Moderate → Advanced → Interview Prep. Every response shown is real.</text><rect x="24.0" y="72" width="340" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="38.0" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">1 · Basic: First endpoints</text><text x="38.0" y="113" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">HTTP · routes · path/query · request bodies</text><line x1="367.0" y1="101.0" x2="391.0" y2="101.0" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="396.0" y="72" width="340" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="410.0" y="91" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sa