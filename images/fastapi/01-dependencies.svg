<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">A request is resolved through dependencies: pagination and a database session in parallel, and a chain from token to current user to admin check, before the endpoint runs; yield dependencies clean up after the response</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Dependency injection: what runs for one request</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">FastAPI resolves the tree, caches each dependency once per request, then calls your endpoint.</text><rect x="20" y="120" width="110" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="75.0" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">request</text><text x="75.0" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">GET /orders</text><rect x="170" y="70" width="150" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="245.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">get_token</text><rect x="350" y="70" width="170" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="435.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">get_current_user</text><rect x="170" y="140" width="150" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="245.0" y="165.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">Page (limit, offset)</text><rect x="170" y="210" width="150" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="245.0" y="235.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">get_db (yield)</text><rect x="570" y="120" width="170" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="655.0" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">endpoint</text><text x="655.0" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">list_orders(page, user, db)</text><line x1="132" y1="140" x2="166" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="132" y1="150" x2="166" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="132" y1="160" x2="166" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="322" y1="95" x2="346" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="522" y1="95" x2="566" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="322" y1="165" x2="566" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="322" y1="235" x2="566" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="470" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">after the response: session.close()</text><text x="470" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">tests: app.dependency_overrides[get_db] = fake_db</text></svg>