<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" width="760" height="345" role="img" aria-labelledby="title"><title id="title">Login flow: the client posts credentials to /token; the server verifies the Argon2 hash and returns a JWT; later requests send the token as a Bearer header; a dependency verifies signature and expiry and loads the user</title><defs><marker id="a0f172a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0" y="0" width="760" height="345" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Password login with JWT access tokens</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Log in once, then prove who you are on every request with a signed, short-lived token.</text><rect x="40" y="70" width="150" height="230" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="115" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Client</text><rect x="570" y="70" width="150" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="645" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">FastAPI</text><line x1="192" y1="118" x2="566" y2="118" stroke="#0f172a" stroke-width="2" marker-end="url(#a0f172a)"/><text x="380" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">POST /token  username + password</text><text x="645" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">✓</text><text x="380" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">verify Argon2 hash → sign JWT {sub, exp}</text><line x1="566" y1="186" x2="192" y2="186" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="380" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">200 {access_token, token_type: bearer}</text><line x1="192" y1="226" x2="566" y2="226" stroke="#0f172a" stroke-width="2" marker-end="url(#a0f172a)"/><text x="380" y="217" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">GET /me  Authorization: Bearer eyJ…</text><line x1="566" y1="260" x2="192" y2="260" stroke="#7c3aed" stroke-width="2" marker-end="url(#a7c3aed)"/><text x="380" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">check signature + exp → load user → 200</text><text x="380" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">access token: minutes · refresh token: HttpOnly cookie, rotated, revocable</text></svg>