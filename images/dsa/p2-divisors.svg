<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">Divisors of 36 come in pairs d and 36 // d; the small one of each pair is at most the square root, 6</title><defs></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Divisors come in pairs, and the pairs meet at √n</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Divisors of 36: check d = 1 … 6 only (6 × 6 = 36), and each hit gives two divisors</text><text x="202" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">small d ≤ √36</text><text x="492" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">partner 36 // d ≥ √36</text><rect x="180" y="92" width="44" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="202.0" y="106.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="470" y="92" width="44" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="492.0" y="106.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">36</text><line x1="228" y1="106" x2="464" y2="106" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="347.0" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1 × 36 = 36</text><rect x="180" y="128" width="44" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="202.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="470" y="128" width="44" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="492.0" y="142.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">18</text><line x1="228" y1="142" x2="464" y2="142" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="347.0" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2 × 18 = 36</text><rect x="180" y="164" width="44" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="202.0" y="178.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="470" y="164" width="44" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="492.0" y="178.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">12</text><line x1="228" y1="178" x2="464" y2="178" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="347.0" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3 × 12 = 36</text><rect x="180" y="200" width="44" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="202.0" y="214.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="470" y="200" width="44" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="492.0" y="214.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9</text><line x1="228" y1="214" x2="464" y2="214" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="347.0" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4 × 9 = 36</text><rect x="180" y="236" width="44" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="202.0" y="250.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><rect x="470" y="236" width="44" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="492.0" y="250.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><line x1="228" y1="250" x2="464" y2="250" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="347.0" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">6 × 6 = 36</text><text x="60" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#16a34a">6 × 6: add once</text><text x="60" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">Slow: try d = 1 … 36 (36 checks).   Fast: while d * d &lt;= n (6 checks), so O(√n).</text><text x="60" y="302" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">For n = 10¹²: a million checks instead of a trillion.</text></svg>