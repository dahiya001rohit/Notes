<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="title"><title id="title">Removing the 2nd node from the end: fast moves 2 steps ahead, then both move until fast is at the last node</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">n-th from the end: two pointers n apart</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">n = 2. When fast reaches the last node, slow is just before the node to remove.</text><rect x="40" y="110" width="70" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="75.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">dummy</text><line x1="112" y1="130" x2="144" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="148" y="110" width="62" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="179.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><line x1="212" y1="130" x2="244" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="248" y="110" width="62" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="279.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><line x1="312" y1="130" x2="344" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="348" y="110" width="62" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="379.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><line x1="412" y1="130" x2="444" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="448" y="110" width="62" height="40" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="479.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">4</text><line x1="512" y1="130" x2="544" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="548" y="110" width="62" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="579.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><text x="644" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#64748b">None</text><text x="379.0" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">slow</text><line x1="379.0" y1="94" x2="379.0" y2="106" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><text x="579.0" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">fast</text><line x1="579.0" y1="94" x2="579.0" y2="106" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><path d="M379.0,152 C379.0,196 579.0,196 579.0,152" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a16a34a)"/><text x="479.0" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">slow.next = slow.next.next</text><text x="40" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">1. move fast n steps from the dummy   2. move both until fast.next is None   3. unlink slow.next</text></svg>