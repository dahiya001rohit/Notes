<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">LRU cache: a dict maps each key to a node in a doubly linked list ordered from most to least recently used</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">LRU cache = dict + doubly linked list</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The dict finds a node in O(1); the list moves it to the front or evicts from the back in O(1)</text><rect x="60" y="100" width="70" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="95.0" y="120.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">head</text><rect x="680" y="100" width="60" height="40" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="710.0" y="120.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">tail</text><rect x="210" y="100" width="110" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="265.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3: value</text><rect x="370" y="100" width="110" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="425.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1: value</text><rect x="530" y="100" width="110" height="40" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="585.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7: value</text><line x1="132" y1="112" x2="206" y2="112" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="208" y1="128" x2="134" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="322" y1="112" x2="366" y2="112" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="368" y1="128" x2="324" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="482" y1="112" x2="526" y2="112" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="528" y1="128" x2="484" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="642" y1="112" x2="676" y2="112" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><line x1="678" y1="128" x2="644" y2="128" stroke="#64748b" stroke-width="1.8" marker-end="url(#a64748b)"/><text x="265" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">most recently used</text><text x="585" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">least recent → evicted first</text><rect x="150" y="184" width="520" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="160" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">dict</text><rect x="243" y="198" width="44" height="28" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="265.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><line x1="265" y1="196" x2="265" y2="146" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a94a3b8)" stroke-dasharray="3 3"/><rect x="403" y="198" width="44" height="28" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="425.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><line x1="425" y1="196" x2="425" y2="146" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a94a3b8)" stroke-dasharray="3 3"/><rect x="563" y="198" width="44" height="28" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="585.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><line x1="585" y1="196" x2="585" y2="146" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a94a3b8)" stroke-dasharray="3 3"/><text x="40" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">get(key): find the node via the dict, unlink it, re-insert it after head.</text><text x="40" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">put when full: remove tail.prev from the list and its key from the dict.</text></svg>