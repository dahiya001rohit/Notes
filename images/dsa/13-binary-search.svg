<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">Binary search halves the search range each step until it finds the target</title><defs></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Binary search for 23 in a sorted list</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Compare with the middle, throw away the half that can't contain the target: O(log n)</text><rect x="40" y="84" width="42" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="61.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="82" y="84" width="42" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="103.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><rect x="124" y="84" width="42" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="145.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">8</text><rect x="166" y="84" width="42" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="187.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size=