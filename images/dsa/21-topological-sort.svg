<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-labelledby="title"><title id="title">Topological sort of course prerequisites: every arrow points forward in the order</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="s2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="760" height="310" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Topological sort: order tasks so prerequisites come first</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Only possible when the directed graph has no cycle (a DAG)</text><line x1="121.6" y1="137.4" x2="206.6" y2="103.4" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="120.8" y1="164.4" x2="207.4" y2="204.8" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="271.8" y1="101.9" x2="366.3" y2="137.4" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="271.1" y1="206.4" x2="367.0" y2="164.4" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="434.0" y1="150.0" x2="524.0" y2="150.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="273.2" y1="212.7" x2="524.8" y2="157.7" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="56" y="132" width="68" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="90" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Intro</text><rect x="206" y="72" width="68" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="240" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Python</text><rect x="206" y="202" width="68" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="240" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Maths</text><rect x="366" y="132" width="68" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="400" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">DSA</text><rect x="526" y="132" width="68" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="560" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ML</text><text x="40" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">One valid order:</text><text x="170" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">Intro → Python → Maths → DSA → ML</text><text x="630" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Kahn's algorithm:</text><text x="630" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">repeatedly take a</text><text x="630" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">node with no</text><text x="630" y="158" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">remaining</text><text x="630" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">prerequisites</text></svg>
