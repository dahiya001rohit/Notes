onospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">f1</text><text x="240" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">red = the same subproblem solved again</text><text x="480" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">tabulation: dp[i] = dp[i−1] + dp[i−2]</text><rect x="480" y="130" width="40" height="36" rx="4" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="148.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><text x="500.0" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><rect x="520" y="130" width="40" height="36" rx="4" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="540.0" y="148.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="540.0" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="560" y="130" width="40" height="36" rx="4" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="580.0" y="148.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text 