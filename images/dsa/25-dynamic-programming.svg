<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="title"><title id="title">Dynamic programming: the fib recursion tree repeats subproblems; a table computes each once</title><defs></defs><rect x="0" y="0" width="760" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Dynamic programming: solve each subproblem once</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Plain recursion recomputes fib(2) three times; memoisation/tabulation stores it</text><line x1="85.7" y1="224.9" x2="61.8" y2="255.1" stroke="#94a3b8" stroke-width="2"/><line x1="109.3" y1="224.9" x2="133.2" y2="255.1" stroke="#94a3b8" stroke-width="2"/><line x1="176.4" y1="160.1" x2="113.6" y2="199.9" stroke="#94a3b8" stroke-width="2"/><line x1="204.3" y1="164.9" x2="228.2" y2="195.1" stroke="#94a3b8" stroke-width="2"/><line x1="370.7" y1="164.9" x2="346.8" y2="195.1" stroke="#94a3b8" stroke-width="2"/><line x1="394.3" y1="164.9" x2="418.2" y2="195.1" stroke="#94a3b8" stroke-width="2"/><line x1="271.4" y1="100.1" x2="208.6" y2="139.9" stroke="#94a3b8" stroke-width="2"/><line x1="303.6" y1="100.1" x2="366.4" y2="139.9" stroke="#94a3b8" stroke-width="2"/><circle cx="50.0" cy="270.0" r="19" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="50.0" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">f2</text><circle cx="97.5" cy="210.0" r="19" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="97.5" y="211" font-family="ui-monospac