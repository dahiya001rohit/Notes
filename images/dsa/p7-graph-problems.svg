<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Left: a four-node cycle coloured in two alternating colours is bipartite. Right: a directed DFS reaching a node still on its path finds a cycle</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Two-colouring and directed cycles</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">Bipartite: neighbours always get the opposite colour.  Directed cycle: an edge back to a grey (on-path) node.</text><line x1="90" y1="110" x2="230" y2="110" stroke="#94a3b8" stroke-width="2"/><line x1="230" y1="110" x2="230" y2="230" stroke="#94a3b8" stroke-width="2"/><line x1="230" y1="230" x2="90" y2="230" stroke="#94a3b8" stroke-width="2"/><line x1="90" y1="230" x2="90" y2="110" stroke="#94a3b8" stroke-width="2"/><circle cx="90" cy="110" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="90" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><circle cx="230" cy="110" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="230" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="230" cy="230" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="230" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><circle cx="90" cy="230" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="90" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><text x="160" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">bipartite: groups {0, 2} and {1, 3}</text><line x1="330" y1="70" x2="330" y2="285" stroke="#e2e8f0" stroke-width="1.5"/><line x1="442" y1="120" x2="554" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="568" y1="138" x2="514" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="486" y1="210" x2="430" y2="142" stroke="#dc2626" stroke-width="2.5" marker-end="url(#adc2626)"/><circle cx="420" cy="120" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text x="420" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><circle cx="580" cy="120" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text x="580" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="500" cy="230" r="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text x="500" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><text x="640" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">all grey:</text><text x="640" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">still on the</text><text x="640" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">DFS path</text><text x="430" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">back edge</text><text x="500" y="276" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2 → 0 reaches a grey node: cycle</text></svg>