<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Peeling the digits of 1234 with % 10 and // 10, and rebuilding them reversed as 4321</title><defs></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Digits: % 10 takes the last digit, // 10 removes it</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Repeat until n becomes 0. Building rev = rev * 10 + digit reverses the number.</text><rect x="40" y="76" width="90" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="85.0" y="91.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">n</text><rect x="130" y="76" width="100" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="180.0" y="91.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">n % 10</text><rect x="230" y="76" width="100" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="280.0" y="91.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">n // 10</text><rect x="330" y="76" width="200" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="430.0" y="91.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">rev = rev*10 + digit</text><rect x="40" y="106" width="90" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="85.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1234</text><rect x="130" y="106" width="100" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">4</text><rect x="230" y="106" width="100" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="280.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">123</text><rect x="330" y="106" width="200" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="430.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0*10 + 4 = 4</text><rect x="40" y="138" width="90" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="85.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">123</text><rect x="130" y="138" width="100" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">3</text><rect x="230" y="138" width="100" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="280.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">12</text><rect x="330" y="138" width="200" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="430.0" y="154.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4*10 + 3 = 43</text><rect x="40" y="170" width="90" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="85.0" y="186.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">12</text><rect x="130" y="170" width="100" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="186.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">2</text><rect x="230" y="170" width="100" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="280.0" y="186.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="330" y="170" width="200" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="430.0" y="186.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">43*10 + 2 = 432</text><rect x="40" y="202" width="90" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="85.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="130" y="202" width="100" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">1</text><rect x="230" y="202" width="100" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="280.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><rect x="330" y="202" width="200" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="430.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">432*10 + 1 = 4321</text><text x="40" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">n is now 0 → stop.  4 rounds for 4 digits.</text><text x="560" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">One round of the loop</text><rect x="560" y="96" width="176" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="572" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">while n &gt; 0:</text><text x="572" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#d97706" xml:space="preserve">    d = n % 10</text><text x="572" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">    rev = rev*10 + d</text><text x="572" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">    n = n // 10</text><text x="560" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">digits come out</text><text x="560" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">right to left: 4, 3, 2, 1</text></svg>