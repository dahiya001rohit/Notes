<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Dry run of a loop that adds 1 to 4, written as a trace table</title><defs></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A dry run: run the code by hand in a trace table</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">One row per step, one column per variable; the last row is the answer</text><rect x="24" y="72" width="290" height="132" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="40" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">total = 0</text><text x="40" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">for i in range(1, 5):</text><text x="40" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">    total += i</text><text x="40" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">print(total)</text><text x="24" y="230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">range(1, 5) gives 1, 2, 3, 4</text><text x="24" y="252" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">(the stop value 5 is not included)</text><rect x="346" y="72" width="70" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="381.0" y="87.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">step</text><rect x="416" y="72" width="50" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="441.0" y="87.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">i</text><rect x="466" y="72" width="70" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="501.0" y="87.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">total</text><rect x="536" y="72" width="190" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="631.0" y="87.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">what happened</text><rect x="346" y="102" width="70" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="381.0" y="117.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">start</text><rect x="416" y="102" width="50" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="441.0" y="117.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">–</text><rect x="466" y="102" width="70" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="501.0" y="117.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><rect x="536" y="102" width="190" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="631.0" y="117.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">total = 0</text><rect x="346" y="132" width="70" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="381.0" y="147.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="416" y="132" width="50" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="441.0" y="147.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="466" y="132" width="70" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="501.0" y="147.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="536" y="132" width="190" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="631.0" y="147.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0 + 1</text><rect x="346" y="162" width="70" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="381.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="416" y="162" width="50" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="441.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="466" y="162" width="70" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="501.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="536" y="162" width="190" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="631.0" y="177.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1 + 2</text><rect x="346" y="192" width="70" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="381.0" y="207.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="416" y="192" width="50" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="441.0" y="207.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="466" y="192" width="70" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="501.0" y="207.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><rect x="536" y="192" width="190" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="631.0" y="207.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3 + 3</text><rect x="346" y="222" width="70" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="381.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="416" y="222" width="50" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="441.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="466" y="222" width="70" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="501.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">10</text><rect x="536" y="222" width="190" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="631.0" y="237.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">6 + 4  → loop ends</text><text x="346" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">prints 10</text></svg>