<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Variables are labelled boxes; 17 // 5 = 3 sweets each and 17 % 5 = 2 left over</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Variables, and the two division operators</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">A variable is a name for a value; // and % split a division into 'how many each' and 'what's left'</text><text x="40" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">age</text><line x1="106" y1="104" x2="128" y2="104" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="132" y="84" width="96" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="104.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">15</text><text x="240" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" font-style="italic">int</text><text x="40" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">name</text><line x1="106" y1="166" x2="128" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="132" y="146" width="96" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="166.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"Asha"</text><text x="240" y="166" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" font-style="italic">str</text><text x="40" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">passed</text><line x1="106" y1="228" x2="128" y2="228" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="132" y="208" width="96" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="228.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">True</text><text x="240" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" font-style="italic">bool</text><text x="40" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">age = age + 1   # now 16</text><line x1="300" y1="70" x2="300" y2="290" stroke="#e2e8f0" stroke-width="1.5"/><text x="330" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">17 sweets shared by 5 friends</text><rect x="340" y="98" width="50" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="365" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">friend 1</text><circle cx="365" cy="132" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="365" cy="154" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="365" cy="176" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="402" y="98" width="50" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="427" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">friend 2</text><circle cx="427" cy="132" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="427" cy="154" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="427" cy="176" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="464" y="98" width="50" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="489" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">friend 3</text><circle cx="489" cy="132" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="489" cy="154" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="489" cy="176" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="526" y="98" width="50" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="551" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">friend 4</text><circle cx="551" cy="132" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="551" cy="154" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="551" cy="176" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="588" y="98" width="50" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="613" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">friend 5</text><circle cx="613" cy="132" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="613" cy="154" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="613" cy="176" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><circle cx="676" cy="146" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="700" cy="146" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="688" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">left over</text><text x="330" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">17 // 5 = 3</text><text x="460" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">each friend gets 3</text><text x="330" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#d97706">17 % 5 = 2</text><text x="460" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">2 are left over (the remainder)</text><text x="330" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">check: 5 × 3 + 2 = 17</text></svg>