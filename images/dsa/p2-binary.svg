<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">13 in binary is 1101: 8 + 4 + 0 + 1; converting by dividing by 2 and reading the remainders backwards</title><defs><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Binary: place values are powers of 2</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Decimal → binary: divide by 2, keep the remainders, read them bottom-up</text><text x="90" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">8</text><rect x="60" y="96" width="60" height="46" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="90.0" y="119.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">1</text><text x="160" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><rect x="130" y="96" width="60" height="46" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="119.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">1</text><text x="230" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><rect x="200" y="96" width="60" height="46" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="230.0" y="119.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><text x="300" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="270" y="96" width="60" height="46" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="119.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">1</text><text x="60" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">1101₂ = 8 + 4 + 0 + 1 = 13</text><text x="60" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">place values double: 1, 2, 4, 8, 16, …</text><text x="60" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">n % 2 = last bit (odd → 1),  n // 2 drops it</text><rect x="430" y="76" width="70" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="465.0" y="90.0" font-family="ui-mo