<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="title"><title id="title">Binary tree terminology and the four traversal orders</title><defs></defs><rect x="0" y="0" width="760" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Binary tree: each node has at most two children</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Root at the top, leaves at the bottom; height = longest root-to-leaf path</text><line x1="131.5" y1="195.6" x2="92.5" y2="244.4" stroke="#94a3b8" stroke-width="2"/><line x1="156.5" y1="195.6" x2="195.5" y2="244.4" stroke="#94a3b8" stroke-width="2"/><line x1="348.5" y1="195.6" x2="387.5" y2="244.4" stroke="#94a3b8" stroke-width="2"/><line x1="255.0" y1="110.6" x2="161.0" y2="169.4" stroke="#94a3b8" stroke-width="2"/><line x1="284.5" y1="115.6" x2="323.5" y2="164.4" stroke="#94a3b8" stroke-width="2"/><circle cx="80.0" cy="260.0" r="20" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="80.0" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><circle cx="144.0" cy="180.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="144.0" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><circle cx="208.0" cy="260.0" r="20" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="208.0" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><circle cx="272.0" cy="100.0" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="272.0" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="336.0" cy="180.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="336.0" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><circle cx="400.0" cy="260.0" r="20" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="400.0" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><text x="306.0" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">root</text><text x="80.0" y="296" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">leaf</text><text x="470" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Pre-order (root, L, R)</text><text x="470" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">1 2 4 5 3 6</text><text x="470" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">In-order (L, root, R)</text><text x="470" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">4 2 5 1 3 6</text><text x="470" y="204" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Post-order (L, R, root)</text><text x="470" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">4 5 2 6 3 1</text><text x="470" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Level-order (BFS)</text><text x="470" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">1 2 3 4 5 6</text><text x="380.0" y="322" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">DFS orders use recursion (or a stack); level order uses a queue.</text></svg>
