<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="title"><title id="title">Binary search tree: left subtree smaller, right subtree larger; searching for 7 follows one path</title><defs></defs><rect x="0" y="0" width="760" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Binary search tree (BST): search for 7</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Left &lt; node &lt; right at every node, so each comparison discards a whole subtree</text><line x1="219.1" y1="232.9" x2="188.4" y2="267.1" stroke="#94a3b8" stroke-width="2"/><line x1="245.9" y1="232.9" x2="276.6" y2="267.1" stroke="#d97706" stroke-width="3"/><line x1="104.1" y1="168.9" x2="73.4" y2="203.1" stroke="#94a3b8" stroke-width="2"/><line x1="135.0" y1="163.7" x2="215.0" y2="208.3" stroke="#d97706" stroke-width="3"/><line x1="506.6" y1="232.9" x2="475.9" y2="267.1" stroke="#94a3b8" stroke-width="2"/><line x1="422.5" y1="163.7" x2="502.5" y2="208.3" stroke="#94a3b8" stroke-width="2"/><line x1="328.2" y1="95.4" x2="136.8" y2="148.6" stroke="#d97706" stroke-width="3"/><line x1="360.9" y1="104.9" x2="391.6" y2="139.1" stroke="#94a3b8" stroke-width="2"/><circle cx="60.0" cy="218.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="60.0" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="117.5" cy="154.0" r="20" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="117.5" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><circle cx="175.0" cy="282.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="175.0" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><circle cx="232.5" cy="218.0" r="20" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="232.5" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><circle cx="290.0" cy="282.0" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="290.0" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><circle cx="347.5" cy="90.0" r="20" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="347.5" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">8</text><circle cx="405.0" cy="154.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="405.0" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">10</text><circle cx="462.5" cy="282.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="462.5" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">13</text><circle cx="520.0" cy="218.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="520.0" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">14</text><text x="560" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#d97706">7 &lt; 8 → go left</text><text x="560" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#d97706">7 &gt; 3 → go right</text><text x="560" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#d97706">7 &gt; 6 → go right</text><text x="560" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">found 7 ✓</text><text x="380.0" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Balanced: O(log n) per operation. Inserting sorted data makes a skewed 'linked list' tree: O(n).</text></svg>
