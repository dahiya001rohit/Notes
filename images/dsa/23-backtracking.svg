tem-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2ⁿ leaves = 2ⁿ subsets. Pruning (stop early when a branch can't succeed) is what makes backtracking fast in practice.</text></svg>
