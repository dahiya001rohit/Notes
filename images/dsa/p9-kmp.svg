<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="title"><title id="title">KMP failure table for ababaca: 0 0 1 2 3 0 1</title><defs></defs><rect x="0" y="0" width="760" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">KMP: the failure (LPS) table</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">lps[i] = length of the longest proper prefix of pattern[:i+1] that is also a suffix of it</text><text x="40" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">i</text><text x="40" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">pattern</text><text x="40" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">lps</text><rect x="150" y="80" width="56" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="178.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><rect x="150" y="116" width="56" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="178.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a</text><rect x="150" y="152" width="56" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="178.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><rect x="210" y="80" width="56" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="238.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="210" y="116" width="56" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="238.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">b</text><rect x="210" y="152" width="56" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="238.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><rect x="270" y="80" width="56" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="298.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><rect x="270" y="116" width="56" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="298.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a</text><rect x="270" y="152" width="56" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="298.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="330" y="80" width="56" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="358.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><rect x="330" y="116" width="56" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="358.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">b</text><rect x="330" y="152" width="56" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="358.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="390" y="80" width="56" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="418.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><rect x="390" y="116" width="56" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="418.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a</text><rect x="390" y="152" width="56" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="418.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="450" y="80" width="56" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="478.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><rect x="450" y="116" width="56" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="478.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">c</text><rect x="450" y="152" width="56" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="478.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><rect x="510" y="80" width="56" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="538.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#64748b">6</text><rect x="510" y="116" width="56" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="538.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a</text><rect x="510" y="152" width="56" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="538.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="40" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Example: "ababa" (i = 4) ends with "aba", which is also how it starts → lps[4] = 3.</text><text x="40" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">After matching "ababa" in the text and then failing, KMP keeps those 3 characters matched and continues:</text><text x="40" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">the text pointer never moves back, so the search is O(n + m).</text></svg>