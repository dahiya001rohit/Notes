<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">Floyd's triangle uses a counter that keeps growing; in Pascal's triangle each number is the sum of the two above it</title><defs></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Number patterns: what goes in each position?</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">Floyd: one counter across all rows.   Pascal: add the two numbers above.</text><rect x="60" y="84" width="38" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="79.0" y="103.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="60" y="122" width="38" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="79.0" y="141.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="98" y="122" width="38" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="117.0" y="141.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="60" y="160" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="79.0" y="179.0" font-fa