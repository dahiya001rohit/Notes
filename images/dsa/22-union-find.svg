<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">Union-find: each set is a tree whose root is its representative; union links two roots</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="s16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="s2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="s64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="sd97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Union-Find (disjoint sets): who is connected to whom?</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">find(x) follows parents to the root; union(a, b) makes one root point to the other</text><text x="150" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">before: two sets</text><circle cx="90.0" cy="120.0" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="90" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="50.0" cy="200.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="50" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><line x1="58.9" y1="182.1" x2="80.2" y2="139.7" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><circle cx="130.0" cy="200.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="130" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><line x1="121.1" y1="182.1" x2="99.8" y2="139.7" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><circle cx="230.0" cy="120.0" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="230" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><circle cx="230.0" cy="200.0" r="20" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="230" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><line x1="230.0" y1="180.0" x2="230.0" y2="142.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><line x1="300.0" y1="170.0" x2="360.0" y2="170.0" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="330" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">union(3, 5)</text><text x="520" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">after: one set, root 1</text><circle cx="520.0" cy="120.0" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="520" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="440.0" cy="200.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="440" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><line x1="454.1" y1="185.9" x2="504.4" y2="135.6" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><circle cx="520.0" cy="200.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="520" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><line x1="520.0" y1="180.0" x2="520.0" y2="142.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><circle cx="620.0" cy="200.0" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="620" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><line x1="604.4" y1="187.5" x2="537.2" y2="133.7" stroke="#16a34a" stroke-width="3" marker-end="url(#a16a34a)"/><circle cx="620.0" cy="270.0" r="20" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="620" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><line x1="620.0" y1="250.0" x2="620.0" y2="222.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><text x="660" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">new link</text><text x="380.0" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">With path compression + union by size, operations are almost O(1) (inverse-Ackermann).</text></svg>
