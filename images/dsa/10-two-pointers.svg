<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">Two pointers on a sorted array: move left or right pointer depending on the sum</title><defs></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Two pointers: pair sum in a sorted array (target = 10)</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Each step discards one element for good, so the scan is O(n) instead of O(n²)</text><rect x="60" y="86" width="44" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="82.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="104" y="86" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="126.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="148" y="86" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="170.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="192" y="86" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="214.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><rect x="236" y="86" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="258.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">8</text><rect x="280" y="86" width="44" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="302.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">11</text><text x="82.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">L</text><text x="302.0" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">R</text><text x="360" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">1 + 11 = 12 &gt; 10 → move R left</text><rect x="60" y="152" width="44" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="82.0" y="171.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="104" y="152" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="126.0" y="171.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="148" y="152" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="170.0" y="171.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="192" y="152" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="214.0" y="171.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><rect x="236" y="152" width="44" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="258.0" y="171.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">8</text><rect x="280" y="152" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="302.0" y="171.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">11</text><text x="82.0" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">L</text><text x="258.0" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">R</text><text x="360" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">1 + 8 = 9 &lt; 10 → move L right</text><rect x="60" y="218" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="82.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="104" y="218" width="44" height="38" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="126.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="148" y="218" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="170.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="192" y="218" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="214.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><rect x="236" y="218" width="44" height="38" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="258.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">8</text><rect x="280" y="218" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="302.0" y="237.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">11</text><text x="126.0" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">L</text><text x="258.0" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">R</text><text x="360" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">2 + 8 = 10 ✓ found</text><text x="380.0" y="304" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Works because the array is sorted: a sum that's too big can only shrink by moving R left.</text></svg>
