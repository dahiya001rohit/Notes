<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Binary search on the answer: can Koko finish at speed k is no for k up to 3 and yes from 4 on, so the answer is 4</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Binary search on the answer: find the first 'yes'</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Koko, piles [3, 6, 7, 11], 8 hours. Can she finish at speed k? The answers only switch once.</text><text x="71.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=1</text><rect x="44" y="96" width="54" height="36" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="71.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">no</text><text x="71.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">27 h</text><text x="131.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=2</text><rect x="104" y="96" width="54" height="36" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="131.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">no</text><text x="131.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">15 h</text><text x="191.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=3</text><rect x="164" y="96" width="54" height="36" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="191.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">no</text><text x="191.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">10 h</text><text x="251.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=4</text><rect x="224" y="96" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="251.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">yes</text><text x="251.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">8 h</text><text x="311.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=5</text><rect x="284" y="96" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="311.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">yes</text><text x="311.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">8 h</text><text x="371.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=6</text><rect x="344" y="96" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="371.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">yes</text><text x="371.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">6 h</text><text x="431.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=7</text><rect x="404" y="96" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="431.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">yes</text><text x="431.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5 h</text><text x="491.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=8</text><rect x="464" y="96" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="491.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">yes</text><text x="491.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5 h</text><text x="551.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=9</text><rect x="524" y="96" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="551.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">yes</text><text x="551.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5 h</text><text x="611.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=10</text><rect x="584" y="96" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="611.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">yes</text><text x="611.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5 h</text><text x="671.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">k=11</text><rect x="644" y="96" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="671.0" y="114.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">yes</text><text x="671.0" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4 h</text><line x1="251.0" y1="196" x2="251.0" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a16a34a)"/><text x="251.0" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">answer: k = 4</text><text x="24" y="240" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">can(k) is monotonic: no, no, no, yes, yes, … so binary-search k between 1 and max(piles) = 11.</text><text x="24" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">Checks: mid = 6 yes → 3 no → 5 yes → 4 yes → answer 4.  About log₂(11) ≈ 4 checks instead of 11.</text><text x="24" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">hours at speed k = sum of ceil(pile / k) = sum of (pile + k − 1) // k</text></svg>