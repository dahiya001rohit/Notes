<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="title"><title id="title">Prefix sums: precompute running totals so any range sum is one subtraction</title><defs></defs><rect x="0" y="0" width="760" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Prefix sums: any range sum in O(1)</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">P[i] = sum of the first i numbers, so sum(nums[i..j]) = P[j+1] − P[i]</text><text x="150" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#0f172a">nums</text><rect x="190" y="82" width="52" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="216.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><text x="216.0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><rect x="242" y="82" width="52" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="268.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="268.0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="294" y="82" width="52" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="320.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><text x="320.0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><rect x="346" y="82" width="52" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="372.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="372.0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><rect x="398" y="82" width="52" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="424.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><text x="424.0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><rect x="450" y="82" width="52" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="476.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9</text><text x="476.0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><text x="150" y="182" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#0f172a">P</text><rect x="190" y="162" width="52" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="216.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><text x="216.0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><rect x="242" y="162" width="52" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="268.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><text x="268.0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="294" y="162" width="52" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="320.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><text x="320.0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><rect x="346" y="162" width="52" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="372.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">8</text><text x="372.0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><rect x="398" y="162" width="52" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="424.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9</text><text x="424.0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><rect x="450" y="162" width="52" height="40" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="476.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">14</text><text x="476.0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><rect x="502" y="162" width="52" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="528.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">23</text><text x="528.0" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">6</text><text x="574" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">P[0] = 0</text><text x="380.0" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">sum(nums[2..4]) = 4 + 1 + 5 = 10  =  P[5] − P[2] = 14 − 4</text><text x="380.0" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Build once in O(n), then answer each range query in O(1).</text></svg>
