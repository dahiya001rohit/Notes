<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="title"><title id="title">Min-heap stored in an array: parent at i, children at 2i+1 and 2i+2</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="s2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="760" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Heap (min-heap): the smallest item is always at the root</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">A complete binary tree stored in a plain list; heapq keeps list[0] the minimum</text><line x1="130.5" y1="180.8" x2="93.5" y2="221.2" stroke="#94a3b8" stroke-width="2"/><line x1="157.5" y1="180.8" x2="194.5" y2="221.2" stroke="#94a3b8" stroke-width="2"/><line x1="386.5" y1="180.8" x2="349.5" y2="221.2" stroke="#94a3b8" stroke-width="2"/><line x1="254.5" y1="105.6" x2="161.5" y2="156.4" stroke="#94a3b8" stroke-width="2"/><line x1="289.5" y1="105.6" x2="382.5" y2="156.4" stroke="#94a3b8" stroke-width="2"/><circle cx="80.0" cy="236.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="80.0" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><circle cx="144.0" cy="166.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="144.0" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><circle cx="208.0" cy="236.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="208.0" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><circle cx="272.0" cy="96.0" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="272.0" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="336.0" cy="236.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="336.0" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9</text><circle cx="400.0" cy="166.0" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="400.0" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="450" y="130" width="44" height="40" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="472.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="472.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><rect x="494" y="130" width="44" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="516.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><text x="516.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="538" y="130" width="44" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="560.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><text x="560.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><rect x="582" y="130" width="44" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="604.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><text x="604.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><rect x="626" y="130" width="44" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="648.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><text x="648.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><rect x="670" y="130" width="44" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="692.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9</text><text x="692.0" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><text x="450" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">the same heap as a list:</text><path d="M516,188 Q560,226 604,190" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a2563eb)"/><path d="M516,188 Q582,244 648,190" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a2563eb)"/><text x="450" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">children of i: 2i+1 and 2i+2</text><text x="450" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">parent of i:   (i − 1) // 2</text><text x="380.0" y="326" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">peek O(1) · push O(log n) · pop O(log n) · heapify O(n). Every parent ≤ its children (siblings unordered).</text></svg>
