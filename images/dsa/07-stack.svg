<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title"><title id="title">Stack: last in, first out. Push adds to the top, pop removes from the top</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="s2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="s64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Stack: Last In, First Out (LIFO)</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Only the top is touched: push, pop and peek are O(1). A Python list's end works as a stack.</text><text x="120" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">start</text><rect x="70" y="220" width="100" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">A</text><rect x="70" y="184" width="100" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">B</text><path d="M64,110 L64,256 L176,256 L176,110" fill="none" stroke="#94a3b8" stroke-width="2"/><line x1="200.0" y1="180.0" x2="250.0" y2="180.0" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="225" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">push(C)</text><text x="330" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">after push</text><rect x="280" y="220" width="100" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="330" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">A</text><rect x="280" y="184" width="100" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="330" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">B</text><rect x="280" y="148" width="100" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="330" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">C</text><path d="M274,110 L274,256 L386,256 L386,110" fill="none" stroke="#94a3b8" stroke-width="2"/><line x1="410.0" y1="180.0" x2="460.0" y2="180.0" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="435" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">pop()</text><text x="540" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">pop() → C</text><rect x="490" y="220" width="100" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="540" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">A</text><rect x="490" y="184" width="100" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="540" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">B</text><path d="M484,110 L484,256 L596,256 L596,110" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="650" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">top</text><line x1="646.0" y1="158.0" x2="598.0" y2="198.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/></svg>
