<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Kadane's algorithm on -2 1 -3 4 -1 2 1 -5 4: the best subarray is 4 -1 2 1 with sum 6</title><defs></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Kadane: the best subarray ending here = max(x, previous + x)</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Drop the running sum when it goes negative; the largest value seen is the answer</text><text x="24" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">nums</text><text x="24" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">best ending here</text><text x="177" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">i=0</text><rect x="150" y="92" width="54" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="177.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">-2</text><rect x="150" y="158" width="54" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="177.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">-2</text><text x="239" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">i=1</text><rect x="212" y="92" width="54" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="239.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="212" y="158" width="54" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="239.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="301" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">i=2</text><rect x="274" y="92" width="54" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="301.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">-3</text><rect x="274" y="158" width="54" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="301.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">-2</text><text x="363" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">i=3</text><rect x="336" y="92" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="363.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="336" y="158" width="54" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="363.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><text x="425" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">i=4</text><rect x="398" y="92" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="425.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">-1</text><rect x="398" y="158" width="54" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="425.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><text x="487" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">i=5</text><rect x="460" y="92" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="487.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="460" y="158" width="54" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="487.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><text x="549" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">i=6</text><rect x="522" y="92" width="54" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="549.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="522" y="158" width="54" height="36" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="549.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><text x="611" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">i=7</text><rect x="584" y="92" width="54" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="611.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">-5</text><rect x="584" y="158" width="54" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="611.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="673" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">i=8</text><rect x="646" y="92" width="54" height="36" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="673.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="646" y="158" width="54" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="673.0" y="176.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><text x="549" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">best = 6</text><rect x="24" y="236" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="46" y="243" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">restart here: the previous sum was negative</text><rect x="24" y="262" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="46" y="269" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">the best subarray: 4 + (−1) + 2 + 1 = 6, found in one pass, O(n)</text></svg>