<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Modulo is clock arithmetic: on a 12-hour clock, 10 plus 5 hours is 3, because (10 + 5) % 12 = 3</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Modulo is clock arithmetic</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Numbers wrap around after m − 1 back to 0. On a 12-hour clock: (10 + 5) % 12 = 3</text><circle cx="170" cy="180" r="110" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="170.0" cy="88.0" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="170.0" y="88.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><circle cx="216.0" cy="100.3" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="216.0" y="100.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="249.7" cy="134.0" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="249.7" y="134.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><circle cx="262.0" cy="180.0" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="262.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><circle cx="249.7" cy="226.0" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="249.7" y="226.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><circle cx="216.0" cy="259.7" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="216.0" y="259.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><circle cx="170.0" cy="272.0" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="170.0" y="272.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><circle cx="124.0" cy="259.7" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="124.0" y="259.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><circle cx="90.3" cy="226.0" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="90.3" y="226.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">8</text><circle cx="78.0" cy="180.0" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="78.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9</text><circle cx="90.3" cy="134.0" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="90.3" y="134.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">10</text><circle cx="124.0" cy="100.3" r="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="124.0" y="100.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">11</text><path d="M116.3,149.0 L120.8,142.3 L126.2,136.2 L132.3,130.8 L139.0,126.3 L146.3,122.7 L154.0,120.1 L161.9,118.5 L170.0,118.0 L178.1,118.5 L186.0,120.1 L193.7,122.7 L201.0,126.3 L207.7,130.8 L213.8,136.2 L219.2,142.3 L223.7,149.0 L227.3,156.3 L229.9,164.0 L231.5,171.9 L232.0,180.0" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a2563eb)"/><text x="170" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">+5</text><text x="330" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">17 % 5 = 2</text><text x="330" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">remainder after dividing</text><text x="330" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">(10 + 5) % 12 = 3</text><text x="330" y="148" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">5 hours after 10 o'clock</text><text x="330" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">(3 - 5) % 12 = 10</text><text x="330" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Python's % is never negative</text><text x="330" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">(a + b) % m = (a % m + b % m) % m</text><text x="330" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">same for ×: take % m after every step</text><text x="330" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">MOD = 1_000_000_007</text><text x="330" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">keeps huge answers small</text></svg>