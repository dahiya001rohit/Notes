<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title"><title id="title">Lowest common ancestor of 6 and 4 is 5: each subtree reports whether it found a target, and the node where both sides report is the answer</title><defs></defs><rect x="0" y="0" width="760" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Bottom-up recursion: children report, the parent decides</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">LCA(6, 4): the node where the two searches meet is 5</text><line x1="380" y1="92" x2="250" y2="156" stroke="#94a3b8" stroke-width="1.8"/><line x1="380" y1="92" x2="510" y2="156" stroke="#94a3b8" stroke-width="1.8"/><line x1="250" y1="156" x2="170" y2="222" stroke="#94a3b8" stroke-width="1.8"/><line x1="250" y1="156" x2="330" y2="222" stroke="#94a3b8" stroke-width="1.8"/><line x1="510" y1="156" x2="450" y2="222" stroke="#94a3b8" stroke-width="1.8"/><line x1="510" y1="156" x2="570" y2="222" stroke="#94a3b8" stroke-width="1.8"/><line x1="330" y1="222" x2="285" y2="286" stroke="#94a3b8" stroke-width="1.8"/><line x1="330" y1="222" x2="375" y2="286" stroke="#94a3b8" stroke-width="1.8"/><circle cx="380" cy="92" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="380" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><circle cx="250" cy="156" r="19" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="250" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><circle cx="510" cy="156" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="510" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="170" cy="222" r="19" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="170" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><circle cx="330" cy="222" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="330" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><circle cx="450" cy="222" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="450" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><circle cx="570" cy="222" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="570" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">8</text><circle cx="285" cy="286" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="285" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><circle cx="375" cy="286" r="19" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="375" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><text x="150" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">found 6</text><text x="410" y="312" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">found 4</text><text x="330" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a"></text><text x="250" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">both sides found → LCA</text><text x="580" y="90" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">Top-down</text><text x="580" y="110" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">pass info DOWN as</text><text x="580" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">parameters (depth,</text><text x="580" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">remaining sum, range)</text><text x="580" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">Bottom-up</text><text x="580" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">children RETURN info</text><text x="580" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">(height, found?) up</text></svg>