<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title"><title id="title">Variables are arrows to objects: a and b point to the same list. Nodes hold a value and an arrow to the next node</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">References: variables are arrows, and nodes link to nodes</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">b = a copies the arrow, not the list.  A chain of nodes ends with None.</text><text x="40" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">a</text><text x="40" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">b</text><line x1="54" y1="96" x2="160" y2="116" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="54" y1="150" x2="160" y2="128" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><rect x="166" y="104" width="44" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="188.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="210" y="104" width="44" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="232.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="254" y="104" width="44" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="276.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><text x="166" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">one list object</text><text x="400" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">a = [1, 2]</text><text x="400" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">b = a            # same object</text><text x="400" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">b.append(3)      # a sees it too</text><text x="400" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a" xml:space="preserve">a is b  → True</text><line x1="24" y1="186" x2="736" y2="186" stroke="#e2e8f0" stroke-width="1.5"/><text x="40" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">head</text><line x1="84" y1="226" x2="118" y2="226" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><rect x="122" y="206" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><line x1="178" y1="206" x2="178" y2="246" stroke="#2563eb" stroke-width="1.5"/><text x="150" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><text x="200" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">next</text><line x1="200" y1="232" x2="268" y2="232" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="272" y="206" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><line x1="328" y1="206" x2="328" y2="246" stroke="#2563eb" stroke-width="1.5"/><text x="300" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><text x="350" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">next</text><line x1="350" y1="232" x2="418" y2="232" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="422" y="206" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><line x1="478" y1="206" x2="478" y2="246" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="500" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">next</text><line x1="500" y1="232" x2="560" y2="232" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><text x="592" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">None</text><text x="40" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">1 link per node → linked list (Part 5)     2 links → binary tree (Part 6)     any number → graph (Part 7)</text></svg>