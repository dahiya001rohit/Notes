th="0"/><text x="292.9289321881345" y="207.07106781186548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">6</text><line x1="399.1" y1="130.9" x2="499.2" y2="188.1" stroke="#16a34a" stroke-width="3" marker-end="url(#a16a34a)"/><rect x="434.03861061643164" y="158.6824314212446" width="22" height="20" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="445.03861061643164" y="168.6824314212446" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">2</text><line x1="399.1" y1="269.1" x2="499.2" y2="211.9" stroke="#94a3b8" stroke-width="2" marker-end="url(#a94a3b8)"/><rect x="443.96138938356836" y="238.6824314212446" width="22" height="20" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="454.96138938356836" y="248.6824314212446" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><circle cx="80.0" cy="200.0" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="80" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">A</text><text x="80" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">d=0</text><circle cx="220.0" cy="120.0" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="220" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">B</text><text x="220" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">d=3</text><circle cx="220.0" cy="280.0" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="220" y="281" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">C</text><text x="220" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">d=1</text><circle cx="380.0" cy="120.0" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="380" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">D</text><text x="380" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">d=8</text><circle cx="380.0" cy="280.0" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="380" y="281" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">E</text><text x="380" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">d=9</text><circle cx="520.0" cy="200.0" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="520" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">F</text><text x="520" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">d=10</text><text x="590" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">green = shortest-path tree</text><text x="590" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">A→C→B is 3, cheaper</text><text x="590" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">than A→B (4)</text><text x="380.0" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">O((V + E) log V) with a heap. Negative edge weights break it (use Bellman-Ford).</text></svg>
