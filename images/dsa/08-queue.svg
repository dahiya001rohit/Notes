<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Queue: first in, first out. Enqueue at the back, dequeue from the front; a deque allows both ends</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="s16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="sd97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Queue: First In, First Out (FIFO)</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">collections.deque gives O(1) at both ends (list.pop(0) is O(n))</text><rect x="230" y="100" width="64" height="46" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="262.0" y="123.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">A</text><rect x="294" y="100" width="64" height="46" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="326.0" y="123.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">B</text><rect x="358" y="100" width="64" height="46" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="390.0" y="123.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">C</text><rect x="422" y="100" width="64" height="46" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="454.0" y="123.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">D</text><line x1="222.0" y1="123.0" x2="150.0" y2="123.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><text x="110" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">popleft()</text><text x="110" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">→ A</text><line x1="580.0" y1="123.0" x2="494.0" y2="123.0" stroke="#16a34a" stroke-width="2" marker-end="url(#a16a34a)"/><text x="628" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">append(E)</text><text x="262" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">front</text><text x="454" y="168" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">back</text><text x="380" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Deque (double-ended queue): add or remove at either end in O(1)</text><rect x="276" y="212" width="52" height="38" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="302.0" y="231.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x</text><rect x="328" y="212" width="52" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="354.0" y="231.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">A</text><rect x="380" y="212" width="52" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="406.0" y="231.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">B</text><rect x="432" y="212" width="52" height="38" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="458.0" y="231.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">y</text><text x="264" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#7c3aed">appendleft / popleft</text><text x="496" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#7c3aed">append / pop</text><text x="380.0" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Queues drive BFS, task schedulers and buffering; deques also power sliding-window maximums.</text></svg>
