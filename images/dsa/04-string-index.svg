<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="title"><title id="title">Python string indexing with positive and negative indices and slicing</title><defs></defs><rect x="0" y="0" width="760" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Strings: immutable sequences of characters</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Indexing and slicing work like lists, but you can't change a string in place</text><rect x="180" y="90" width="56" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="208.0" y="112.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">p</text><rect x="236" y="90" width="56" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="264.0" y="112.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">y</text><rect x="292" y="90" width="56" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="320.0" y="112.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">t</text><rect x="348" y="90" width="56" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="376.0" y="112.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">h</text><rect x="404" y="90" width="56" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="432.0" y="112.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">o</text><rect x="460" y="90" width="56" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="488.0" y="112.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">n</text><text x="208.0" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><text x="208.0" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-6</text><text x="264.0" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><text x="264.0" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-5</text><text x="320.0" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><text x="320.0" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-4</text><text x="376.0" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><text x="376.0" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-3</text><text x="432.0" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><text x="432.0" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-2</text><text x="488.0" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><text x="488.0" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#7c3aed">-1</text><text x="150" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#64748b">index</text><text x="150" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#7c3aed">negative</text><text x="180" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">s[1:4] == "yth"   (start included, stop excluded)</text><text x="180" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">s[-1] == "n"      s[::-1] == "nohtyp"</text><text x="380.0" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Building text in a loop: collect pieces in a list and "".join(parts) once, not s += piece.</text></svg>
