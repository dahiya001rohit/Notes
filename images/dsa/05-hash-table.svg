<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title"><title id="title">Hash table: keys are hashed to bucket indexes; colliding keys share a bucket</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="s16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="s2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="s64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="sd97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Hash tables (dict, set): average O(1) lookup</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">hash(key) % buckets picks a slot; equal keys always land in the same slot</text><rect x="40" y="82" width="110" height="36" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="95" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"apple"</text><rect x="200" y="84" width="120" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="260" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">hash % 8 → 3</text><line x1="152.0" y1="100.0" x2="198.0" y2="100.0" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="322.0" y1="100.0" x2="440.0" y2="168.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)"/><rect x="40" y="152" width="110" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="95" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"mango"</text><rect x="200" y="154" width="120" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="260" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">hash % 8 → 6</text><line x1="152.0" y1="170.0" x2="198.0" y2="170.0" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="322.0" y1="170.0" x2="440.0" y2="258.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><rect x="40" y="222" width="110" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="95" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"kiwi"</text><rect x="200" y="224" width="120" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="260" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">hash % 8 → 3</text><line x1="152.0" y1="240.0" x2="198.0" y2="240.0" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><line x1="322.0" y1="240.0" x2="440.0" y2="168.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#ad97706)"/><rect x="450" y="64" width="44" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="472" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><rect x="450" y="94" width="44" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="472" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="450" y="124" width="44" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="472" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><rect x="450" y="154" width="44" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="472" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><rect x="450" y="184" width="44" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="472" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><rect x="450" y="214" width="44" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="472" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><rect x="450" y="244" width="44" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="472" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">6</text><rect x="450" y="274" width="44" height="28" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="472" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">7</text><rect x="506" y="154" width="96" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="554" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"apple": 5</text><line x1="604.0" y1="168.0" x2="624.0" y2="168.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><rect x="626" y="154" width="96" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="674" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"kiwi": 2</text><rect x="506" y="244" width="96" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="554" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">"mango": 9</text><text x="674" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">collision</text><text x="380.0" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Tables resize as they fill to keep collisions rare. Keys must be hashable: str, int, tuple (not list).</text></svg>
