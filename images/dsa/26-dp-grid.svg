<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title"><title id="title">2D dynamic programming: number of paths in a grid moving only right or down</title><defs><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="sd97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">2D DP: unique paths moving only right or down</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">paths[r][c] = paths[r−1][c] + paths[r][c−1]; first row and column are 1</text><rect x="150" y="80" width="64" height="52" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="182.0" y="106.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="214" y="80" width="64" height="52" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="246.0" y="106.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="278" y="80" width="64" height="52" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="310.0" y="106.0" font-family="ui-monospace, SFMono-Reg