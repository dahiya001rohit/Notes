eight="52" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="438.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><rect x="150" y="184" width="64" height="52" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="182.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="214" y="184" width="64" height="52" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="246.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="278" y="184" width="64" height="52" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="310.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">6</text><rect x="342" y="184" width="64" height="52" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="374.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">10</text><rect x="406" y="184" width="64" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="438.0" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">15</text><line x1="400.0" y1="210.0" x2="414.0" y2="210.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><line x1="438.0" y1="178.0" x2="438.0" y2="192.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><text x="134" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#64748b">start</text><text x="486" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">goal: 5 + 10 = 15 paths</text><text x="380.0" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Fill the table row by row: O(rows × cols) time. Only the previous row is needed → O(cols) space.</text></svg>
