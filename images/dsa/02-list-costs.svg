<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Python list: append at the end is O(1), insert at the front shifts every element, O(n)</title><defs><marker id="adc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sdc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Why list.insert(0, x) is slow but append(x) is fast</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">A list is a dynamic array: items sit next to each other in memory</text><text x="24" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">append(9)</text><text x="24" y="106" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">O(1): write into the next free slot</text><rect x="300" y="72" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="323.0" y="94.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><text x="323.0" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><rect x="346" y="72" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="369.0" y="94.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><text x="369.0" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="392" y="72" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="415.0" y="94.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="415.0" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><rect x="438" y="72" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="461.0" y="94.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><text x="461.0" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><rect x="484" y="72" width="46" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="507.0" y="94.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9</text><text x="507.0" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><rect x="530" y="72" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="553.0" y="94.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a"></text><text x="553.0" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><text x="588" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">← spare capacity</text><text x="24" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#dc2626">insert(0, 9)</text><text x="24" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">O(n): every item moves right first</text><rect x="300" y="172" width="46" height="44" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="323.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9</text><text x="323.0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><rect x="346" y="172" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="369.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><text x="369.0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><rect x="392" y="172" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="415.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><text x="415.0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><rect x="438" y="172" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="461.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="461.0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><rect x="484" y="172" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="507.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><text x="507.0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><rect x="530" y="172" width="46" height="44" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="553.0" y="194.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a"></text><text x="553.0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><path d="M323,170 Q346,150 369,170" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)"/><path d="M369,170 Q392,150 415,170" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)"/><path d="M415,170 Q438,150 461,170" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)"/><path d="M461,170 Q484,150 507,170" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#adc2626)"/><text x="380.0" y="272" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Same for pop(0) and `x in list` (O(n)). Use a set for fast membership checks.</text></svg>
