<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="title"><title id="title">Merge sort splits the list in halves down to single items, then merges sorted halves back up</title><defs></defs><rect x="0" y="0" width="760" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Merge sort: divide, sort each half, merge</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">log n levels × O(n) merging work per level = O(n log n), always</text><rect x="272.0" y="70" width="36" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="290.0" y="87.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><rect x="308.0" y="70" width="36" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="326.0" y="87.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="344.0" y="70" width="36" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="362.0" y="87.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="380.0" y="70" width="36" height="34" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="398.0" y="87.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size