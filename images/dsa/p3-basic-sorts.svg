<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">One pass of selection sort, bubble sort and insertion sort on the list 5 2 4 6 1 3</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Three basic sorts, one pass each</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Each pass grows the sorted part (green) by one item. All three are O(n²) in the worst case.</text><text x="24" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">Selection</text><text x="24" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">find the smallest, swap it to the front</text><rect x="150" y="80" width="34" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="167.0" y="96.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><rect x="188" y="80" width="34" height="32" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="205.0" y="9