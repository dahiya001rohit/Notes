<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Sliding window: move a fixed-size window by adding the new right element and removing the old left one</title><defs></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Sliding window: best sum of 3 consecutive numbers</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Reuse the previous window: add the element entering, subtract the one leaving</text><rect x="60" y="86" width="44" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="82.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="104" y="86" width="44" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="126.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="148" y="86" width="44" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><rect x="192" y="86" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="214.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="236" y="86" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="258.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="280" y="86" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="302.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="56" y="82" width="140" height="46" rx="8" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/><text x="360" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">window 0..2: sum = 8   (first window)</text><rect x="60" y="150" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="82.0" y="169.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="104" y="150" width="44" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="126.0" y="169.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="148" y="150" width="44" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="169.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><rect x="192" y="150" width="44" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="214.0" y="169.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="236" y="150" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="258.0" y="169.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="280" y="150" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="302.0" y="169.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="100" y="146" width="140" height="46" rx="8" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/><text x="360" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">window 1..3: sum = 7   (+1 −2)</text><rect x="60" y="214" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="82.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="104" y="214" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="126.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="148" y="214" width="44" height="38" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="170.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><rect x="192" y="214" width="44" height="38" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="214.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="236" y="214" width="44" height="38" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="258.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="280" y="214" width="44" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="302.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="144" y="210" width="140" height="46" rx="8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4"/><text x="360" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">window 2..4: sum = 9   (+3 −1)</text><text x="380.0" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">O(n) instead of recomputing every window in O(n·k). Variable-size windows grow on the right and shrink on the left.</text></svg>
