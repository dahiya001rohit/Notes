<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img" aria-labelledby="title"><title id="title">Greedy interval scheduling: repeatedly pick the meeting that ends earliest</title><defs></defs><rect x="0" y="0" width="760" height="334" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Greedy: take the locally best choice, never look back</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Maximum non-overlapping meetings: always pick the one that finishes first</text><line x1="80.0" y1="76.0" x2="80.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><line x1="132.0" y1="76.0" x2="132.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="132" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><line x1="184.0" y1="76.0" x2="184.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="184" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><line x1="236.0" y1="76.0" x2="236.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="236" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><line x1="288.0" y1="76.0" x2="288.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="288" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><line x1="340.0" y1="76.0" x2="340.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="340" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5</text><line x1="392.0" y1="76.0" x2="392.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="392" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">6</text><line x1="444.0" y1="76.0" x2="444.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="444" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">7</text><line x1="496.0" y1="76.0" x2="496.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="496" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">8</text><line x1="548.0" y1="76.0" x2="548.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="548" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">9</text><line x1="600.0" y1="76.0" x2="600.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="600" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">10</text><line x1="652.0" y1="76.0" x2="652.0" y2="270.0" stroke="#e2e8f0" stroke-width="1"/><text x="652" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">11</text><rect x="132" y="84" width="156" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="144" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A [1,4)</text><rect x="236" y="110" width="104" height="20" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="248" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">B [3,5)</text><rect x="80" y="136" width="312" height="20" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="92" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">C [0,6)</text><rect x="340" y="162" width="104" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="352" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">D [5,7)</text><rect x="236" y="188" width="312" height="20" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="248" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">E [3,9)</text><rect x="392" y="214" width="208" height="20" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="404" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">G [6,10)</text><rect x="496" y="240" width="156" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="508" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">F [8,11)</text><text x="380.0" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Sorted by end time → picked A, D, F (3 meetings). Greedy works only when you can prove the local choice is safe.</text></svg>
