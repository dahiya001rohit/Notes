<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Right triangle pattern on a grid: row i has i stars; the outer loop picks the row, the inner loop prints the stars</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Patterns are grids: the outer loop picks the row, the inner loop fills it</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Right triangle, n = 4: row i has i stars</text><text x="109.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">j=0</text><text x="147.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">j=1</text><text x="185.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">j=2</text><text x="223.0" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">j=3</text><text x="60" y="115.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">i=1</text><rect x="90" y="96" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="109.0" y="115.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><rect x="128" y="96" width="38" height="38" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="147.0" y="115.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb"></text><rect x="166" y="96" width="38" height="38" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="185.0" y="115.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb"></text><rect x="204" y="96" width="38" height="38" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="223.0" y="115.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb"></text><text x="60" y="153.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">i=2</text><rect x="90" y="134" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="109.0" y="153.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><rect x="128" y="134" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="147.0" y="153.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><rect x="166" y="134" width="38" height="38" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="185.0" y="153.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb"></text><rect x="204" y="134" width="38" height="38" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="223.0" y="153.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb"></text><text x="60" y="191.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">i=3</text><rect x="90" y="172" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="109.0" y="191.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><rect x="128" y="172" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="147.0" y="191.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><rect x="166" y="172" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185.0" y="191.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><rect x="204" y="172" width="38" height="38" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="223.0" y="191.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb"></text><text x="60" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">i=4</text><rect x="90" y="210" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="109.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><rect x="128" y="210" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="147.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><rect x="166" y="210" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><rect x="204" y="210" width="38" height="38" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="223.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">*</text><line x1="40" y1="96" x2="40" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><text x="32" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">rows</text><line x1="90" y1="262" x2="242" y2="262" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><text x="166.0" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">stars in the row</text><text x="330" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">1. Make a row table</text><rect x="330" y="96" width="64" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="362.0" y="109.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">row i</text><rect x="394" y="96" width="64" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="426.0" y="109.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">stars</text><rect x="330" y="122" width="64" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="362.0" y="135.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="394" y="122" width="64" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="426.0" y="135.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="330" y="148" width="64" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="362.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="394" y="148" width="64" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="426.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="330" y="174" width="64" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="362.0" y="187.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="394" y="174" width="64" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="426.0" y="187.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="330" y="200" width="64" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="362.0" y="213.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="394" y="200" width="64" height="26" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="426.0" y="213.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><text x="330" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">2. Rule: stars = i</text><text x="490" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">3. Turn the rule into loops</text><rect x="490" y="96" width="250" height="130" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="502" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">for i in range(1, n + 1):</text><text x="502" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#d97706" xml:space="preserve">    for j in range(i):</text><text x="502" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">        print("*", end=" ")</text><text x="502" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a" xml:space="preserve">    print()</text><text x="490" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">print() ends the row</text></svg>