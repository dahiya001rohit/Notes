<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title"><title id="title">Recursion: the call stack for factorial(3) grows until the base case, then returns values back up</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="s2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="sd97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="760" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Recursion: a function calling itself on a smaller input</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Every call waits on the call stack until the smaller call returns</text><rect x="80" y="90" width="190" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="175" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">factorial(3)</text><rect x="430" y="90" width="190" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="525" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3 × 2 = 6</text><line x1="175.0" y1="130.0" x2="175.0" y2="138.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="525.0" y1="178.0" x2="525.0" y2="132.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><rect x="80" y="140" width="190" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="175" y="159" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">factorial(2)</text><rect x="430" y="140" width="190" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="525" y="159" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2 × 1 = 2</text><line x1="175.0" y1="180.0" x2="175.0" y2="188.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="525.0" y1="228.0" x2="525.0" y2="182.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><rect x="80" y="190" width="190" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="175" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">factorial(1)</text><rect x="430" y="190" width="190" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="525" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1 × 1 = 1</text><line x1="175.0" y1="230.0" x2="175.0" y2="238.0" stroke="#2563eb" stroke-width="2" marker-end="url(#a2563eb)"/><line x1="525.0" y1="278.0" x2="525.0" y2="232.0" stroke="#d97706" stroke-width="2" marker-end="url(#ad97706)"/><rect x="80" y="240" width="190" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="175" y="259" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">factorial(0)</text><rect x="430" y="240" width="190" height="38" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="525" y="259" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">base case → 1</text><text x="175" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">calls go down ↓</text><text x="525" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">results come back ↑</text><text x="380.0" y="306" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">No base case → RecursionError (Python's default limit is 1000 frames). Space used = depth of the stack.</text></svg>
