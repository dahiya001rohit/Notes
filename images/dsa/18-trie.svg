<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="title"><title id="title">Trie (prefix tree) storing cat, car, cart and dog</title><defs></defs><rect x="0" y="0" width="760" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Trie (prefix tree): words share their common prefixes</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Stores: cat, car, cart, dog. Green = a word ends here.</text><line x1="264.9" y1="95.8" x2="205.1" y2="134.2" stroke="#94a3b8" stroke-width="2"/><line x1="295.6" y1="95.0" x2="364.4" y2="135.0" stroke="#94a3b8" stroke-width="2"/><line x1="190.0" y1="162.0" x2="190.0" y2="184.0" stroke="#94a3b8" stroke-width="2"/><line x1="380.0" y1="162.0" x2="380.0" y2="184.0" stroke="#94a3b8" stroke-width="2"/><line x1="178.2" y1="215.6" x2="151.8" y2="246.4" stroke="#94a3b8" stroke-width="2"/><line x1="201.8" y1="215.6" x2="228.2" y2="246.4" stroke="#94a3b8" stroke-width="2"/><line x1="380.0" y1="220.0" x2="380.0" y2="242.0" stroke="#94a3b8" stroke-width="2"/><line x1="253.6" y1="271.8" x2="286.4" y2="300.2" stroke="#94a3b8" stroke-width="2"/><circle cx="280.0" cy="86.0" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="280" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">·</text><circle cx="190.0" cy="144.0" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="190" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">c</text><circle cx="380.0" cy="144.0" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="380" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">d</text><circle cx="190.0" cy="202.0" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="190" y="203" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a</text><circle cx="380.0" cy="202.0" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="380" y="203" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">o</text><circle cx="140.0" cy="260.0" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="140" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">t</text><circle cx="240.0" cy="260.0" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="240" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">r</text><circle cx="380.0" cy="260.0" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="380" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">g</text><circle cx="300.0" cy="312.0" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="300" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">t</text><text x="460" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">insert / search: O(length of word)</text><text x="460" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">starts_with("ca") → cat, car, cart</text><text x="460" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Used for autocomplete, spell-check</text><text x="460" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">and word games</text></svg>
