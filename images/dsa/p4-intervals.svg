<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-labelledby="title"><title id="title">Merging intervals: after sorting by start, 1-3 and 2-6 overlap and merge into 1-6; 8-10 and 15-18 stay separate</title><defs></defs><rect x="0" y="0" width="760" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Merge intervals: sort by start, then extend or start a new one</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">An interval overlaps the last merged one when it starts before that one ends</text><line x1="60" y1="222" x2="60" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="60" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">0</text><line x1="96" y1="222" x2="96" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="96" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1</text><line x1="132" y1="222" x2="132" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="132" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2</text><line x1="168" y1="222" x2="168" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="168" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">3</text><line x1="204" y1="222" x2="204" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="204" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4</text><line x1="240" y1="222" x2="240" y2="228" stroke="#94a3b8" stroke-width="1"/><line x1="276" y1="222" x2="276" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="276" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">6</text><line x1="312" y1="222" x2="312" y2="228" stroke="#94a3b8" stroke-width="1"/><line x1="348" y1="222" x2="348" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="348" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">8</text><line x1="384" y1="222" x2="384" y2="228" stroke="#94a3b8" stroke-width="1"/><line x1="420" y1="222" x2="420" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="420" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">10</text><line x1="456" y1="222" x2="456" y2="228" stroke="#94a3b8" stroke-width="1"/><line x1="492" y1="222" x2="492" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="492" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">12</text><line x1="528" y1="222" x2="528" y2="228" stroke="#94a3b8" stroke-width="1"/><line x1="564" y1="222" x2="564" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="564" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">14</text><line x1="600" y1="222" x2="600" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="600" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">15</text><line x1="636" y1="222" x2="636" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="636" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">16</text><line x1="672" y1="222" x2="672" y2="228" stroke="#94a3b8" stroke-width="1"/><line x1="708" y1="222" x2="708" y2="228" stroke="#94a3b8" stroke-width="1"/><text x="708" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">18</text><line x1="60" y1="225" x2="708" y2="225" stroke="#94a3b8" stroke-width="1.5"/><rect x="96" y="84" width="72" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="132.0" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[1, 3]</text><rect x="132" y="112" width="144" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="204.0" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[2, 6]</text><rect x="348" y="84" width="72" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="384.0" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[8, 10]</text><rect x="600" y="84" width="108" height="22" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="654.0" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">[15, 18]</text><text x="24" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">input</text><rect x="96" y="170" width="180" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="186.0" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">[1, 6]</text><rect x="348" y="170" width="72" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="384.0" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">[8, 10]</text><rect x="600" y="170" width="108" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="654.0" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">[15, 18]</text><text x="24" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#16a34a">merged</text><text x="24" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">2 ≤ 3 → overlap → end = max(3, 6) = 6.   8 &gt; 6 → new interval.   Sort O(n log n) + one sweep O(n).</text></svg>