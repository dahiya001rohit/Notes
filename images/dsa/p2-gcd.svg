<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="title"><title id="title">Euclid's algorithm: gcd(48, 18) becomes gcd(18, 12), gcd(12, 6), gcd(6, 0), so the answer is 6</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Euclid's algorithm: replace (a, b) with (b, a % b)</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Stop when b is 0; then a is the GCD. Each step shrinks the numbers fast.</text><rect x="32" y="96" width="140" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="102.0" y="118.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(48, 18)</text><text x="102" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">48 % 18 = 12</text><line x1="176" y1="118" x2="212" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="218" y="96" width="140" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="288.0" y="118.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(18, 12)</text><text x="288" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">18 % 12 = 6</text><line x1="362" y1="118" x2="398" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="404" y="96" width="140" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="474.0" y="118.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(12, 6)</text><text x="474" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">12 % 6 = 0</text><line x1="548" y1="118" x2="584" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#a64748b)"/><rect x="590" y="96" width="140" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="660.0" y="118.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">(6, 0)</text><text x="660" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">b = 0 → stop</text><text x="32" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">GCD(48, 18) = 6</text><text x="200" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">LCM(48, 18) = 48 × 18 // 6 = 144</text><text x="32" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Why it works: anything that divides both a and b also divides the remainder a % b.</text></svg>