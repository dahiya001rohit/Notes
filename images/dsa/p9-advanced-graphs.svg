<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">Left: two triangles joined by one edge, which is a bridge. Right: a directed graph whose strongly connected groups are 0-1-2, 3-4 and 5</title><defs><marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Bridges and strongly connected components</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b" xml:space="preserve">A bridge is the only link between two parts.  An SCC is a group where every node can reach every other.</text><line x1="60" y1="110" x2="60" y2="220" stroke="#94a3b8" stroke-width="2"/><line x1="60" y1="220" x2="150" y2="165" stroke="#94a3b8" stroke-width="2"/><line x1="150" y1="165" x2="60" y2="110" stroke="#94a3b8" stroke-width="2"/><line x1="240" y1="165" x2="330" y2="110" stroke="#94a3b8" stroke-width="2"/><line x1="330" y1="110" x2="330" y2="220" stroke="#94a3b8" stroke-width="2"/><line x1="330" y1="220" x2="240" y2="165" stroke="#94a3b8" stroke-width="2"/><line x1="150" y1="165" x2="240" y2="165" stroke="#dc2626" stroke-width="4"/><text x="195" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">bridge</text><circle cx="60" cy="110" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="60" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><circle cx="60" cy="220" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="60" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><circle cx="150" cy="165" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><circle cx="240" cy="165" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="240" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><circle cx="330" cy="110" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="330" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><circle cx="330" cy="220" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="330" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5</text><text x="195" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">cut 2–3 and the network splits in two</text><line x1="385" y1="70" x2="385" y2="285" stroke="#e2e8f0" stroke-width="1.5"/><line x1="450.0" y1="100.0" x2="498.0" y2=