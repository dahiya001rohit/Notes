, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">.df()  → pandas</text><rect x="645" y="144" width="200" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="745.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">.pl()  → Polars</text><rect x="645" y="188" width="200" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="745.0" y="205.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">.fetchall() → tuples</text></svg>