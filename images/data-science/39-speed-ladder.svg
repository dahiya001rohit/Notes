<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title"><title id="title">The speed ladder (200,000 rows, log scale)</title><rect x="0" y="0" width="880" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The speed ladder (200,000 rows, log scale)</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Measured in Section 39: let pandas loop in compiled code, not Python</text><text x="40.0" y="95.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">vectorised  df.qty * df.price</text><rect x="330" y="80" width="40.0" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="380.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#0f172a">0.1 ms</text><text x="40.0" y="135.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">NumPy arrays</text><rect x="330" y="120" width="40.0" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="380.0" y="135.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#0f172a">0.1 ms</text><text x="40.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">list comprehension + zip</text><rect x="330" y="160" width="277.0945511734553" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="617.1" y="175.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#0f172a">15.6 ms</text><text x="40.0" y="215.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">itertuples() loop</text><rect x="330" y="200" width="365.346042789048" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="705.3" y="215.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#0f172a">102.2 ms</text><text x="40.0" y="255.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">apply(axis=1)</text><rect x="330" y="240" width="432.18086829909356" height="30" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="772.2" y="255.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#0f172a">424.3 ms</text><text x="440.0" y="285.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">each step right ≈ 10× slower; apply(axis=1) was ~3,000× slower than one vectorised line</text></svg>