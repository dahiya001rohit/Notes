<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title"><title id="title">Bayes&#x27; rule with counts: 10,000 people, 1% sick</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="880" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Bayes&#x27; rule with counts: 10,000 people, 1% sick</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Test: catches 95% of sick people, wrongly flags 5% of healthy people</text><rect x="30" y="145" width="140" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="100.0" y="170.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">10,000 people</text><line x1="170.0" y1="160.0" x2="255.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="170.0" y1="180.0" x2="255.0" y2="235.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="260" y="80" width="150" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="335.0" y="105.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">100 sick</text><rect x="260" y="210" width="150" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="335.0" y="235.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9,900 healthy</text><text x="212.0" y="118.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1%</text><text x="212.0" y="222.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">99%</text><line x1="410.0" y1="105.0" x2="495.0" y2="78.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="500" y="60" width="160" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="580.0" y="78.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">95 positive</text><text x="450.0" y="83.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">95%</text><line x1="410.0" y1="105.0" x2="495.0" y2="138.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="500" y="120" width="160" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="580.0" y="138.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5 negative</text><text x="450.0" y="113.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5%</text><line x1="410.0" y1="235.0" x2="495.0" y2="218.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="500" y="200" width="160" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="580.0" y="218.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">495 positive</text><text x="450.0" y="218.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5%</text><line x1="410.0" y1="235.0" x2="495.0" y2="278.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="500" y="260" width="160" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="580.0" y="278.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">9,405 negative</text><text x="450.0" y="248.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">95%</text><rect x="690" y="120" width="170" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="775.0" y="145.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">positives: 95 + 495</text><text x="775.0" y="170.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">P(sick | positive)</text><text x="775.0" y="198.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">95 / 590 ≈ 16%</text><text x="440.0" y="312.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">Most positives come from the huge healthy group: the base rate matters as much as the test</text></svg>