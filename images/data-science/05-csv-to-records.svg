<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="title"><title id="title">Reading a CSV: text lines → split on commas → dicts</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="880" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Reading a CSV: text lines → split on commas → dicts</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">csv.DictReader pairs each value with the header; every value is still a string</text><text x="40.0" y="78.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">orders.csv (plain text)</text><rect x="40" y="90" width="270" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="175.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">order_id,city,qty,price</text><rect x="40" y="126" width="270" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="175.0" y="141.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1,Pune,5,60</text><rect x="40" y="162" width="270" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="175.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2,Mumbai,1,2500</text><rect x="40" y="198" width="270" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="175.0" y="213.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3,&quot;Pune, MH&quot;,1,1200</text><line x1="320.0" y1="175.0" x2="380.0" y2="175.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><text x="350.0" y="160.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">split</text><text x="400.0" y="78.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">one dict per row (all values are text)</text><rect x="400" y="126" width="450" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="625.0" y="141.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">{&#x27;order_id&#x27;: &#x27;1&#x27;, &#x27;city&#x27;: &#x27;Pune&#x27;, &#x27;qty&#x27;: &#x27;5&#x27;, ...}</text><rect x="400" y="162" width="450" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="625.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">{&#x27;order_id&#x27;: &#x27;2&#x27;, &#x27;city&#x27;: &#x27;Mumbai&#x27;, ...}</text><rect x="400" y="198" width="450" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="625.0" y="213.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">{&#x27;order_id&#x27;: &#x27;3&#x27;, &#x27;city&#x27;: &#x27;Pune, MH&#x27;, ...}</text><text x="440.0" y="255.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#dc2626">quotes keep &quot;Pune, MH&quot; in one value; line.split(&quot;,&quot;) would break it in two</text></svg>