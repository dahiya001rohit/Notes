<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="title"><title id="title">The IQR rule (Tukey&#x27;s fences)</title><rect x="0" y="0" width="880" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">The IQR rule (Tukey&#x27;s fences)</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Flag values below Q1 − 1.5·IQR or above Q3 + 1.5·IQR; then investigate, don&#x27;t auto-delete</text><line x1="60.0" y1="170.0" x2="690.0" y2="170.0" stroke="#94a3b8" stroke-width="1.8"/><line x1="730.0" y1="170.0" x2="840.0" y2="170.0" stroke="#94a3b8" stroke-width="1.8"/><text x="710.0" y="170.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#94a3b8">//</text><line x1="120.0" y1="165.0" x2="120.0" y2="175.0" stroke="#94a3b8" stroke-width="1.8"/><text x="120.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">250</text><line x1="180.0" y1="165.0" x2="180.0" y2="175.0" stroke="#94a3b8" stroke-width="1.8"/><text x="180.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">300</text><line x1="300.0" y1="165.0" x2="300.0" y2="175.0" stroke="#94a3b8" stroke-width="1.8"/><text x="300.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">400</text><line x1="420.0" y1="165.0" x2="420.0" y2="175.0" stroke="#94a3b8" stroke-width="1.8"/><text x="420.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">500</text><line x1="540.0" y1="165.0" x2="540.0" y2="175.0" stroke="#94a3b8" stroke-width="1.8"/><text x="540.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">600</text><line x1="600.0" y1="165.0" x2="600.0" y2="175.0" stroke="#94a3b8" stroke-width="1.8"/><text x="600.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">650</text><line x1="820.0" y1="165.0" x2="820.0" y2="175.0" stroke="#94a3b8" stroke-width="1.8"/><text x="820.0" y="190.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">2500</text><rect x="300.0" y="105" width="120.0" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><line x1="360.0" y1="105.0" x2="360.0" y2="145.0" stroke="#16a34a" stroke-width="2.5"/><text x="360.0" y="92.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">middle 50%: Q1 = 400 to Q3 = 500 (IQR = 100)</text><line x1="120.0" y1="80.0" x2="120.0" y2="160.0" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/><text x="120.0" y="215.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">lower fence</text><text x="120.0" y="230.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">400 − 150 = 250</text><line x1="600.0" y1="80.0" x2="600.0" y2="160.0" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/><text x="600.0" y="215.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">upper fence</text><text x="600.0" y="230.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">500 + 150 = 650</text><circle cx="180.0" cy="155.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="240.0" cy="155.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="300.0" cy="155.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="324.0" cy="155.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="360.0" cy="155.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="396.0" cy="155.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="420.0" cy="155.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="444.0" cy="155.0" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="820.0" cy="155.0" r="6" fill="#dc2626" stroke="#dc2626" stroke-width="1.8"/><text x="820.0" y="130.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">2500 flagged</text><text x="440.0" y="258.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">z-score for 2500 is only 2.65: the outlier inflates the std and hides itself</text></svg>