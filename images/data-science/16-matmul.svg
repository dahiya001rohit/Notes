<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" role="img" aria-labelledby="title"><title id="title">Matrix multiplication A @ B</title><rect x="0" y="0" width="860" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Matrix multiplication A @ B</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Entry (i, j) = row i of A · column j of B.  Shapes: (m, n) @ (n, p) → (m, p)</text><rect x="60" y="90" width="46" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="83.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="106" y="90" width="46" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="129.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="60" y="130" width="46" height="40" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="83.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="106" y="130" width="46" height="40" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="129.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><text x="106.0" y="190.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">A (2, 2)</text><text x="185.0" y="130.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">@</text><rect x="220" y="90" width="46" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="243.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="266" y="90" width="46" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="289.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">0</text><rect x="220" y="130" width="46" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="243.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="266" y="130" width="46" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="289.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><text x="266.0" y="190.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">B (2, 2)</text><text x="345.0" y="130.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">=</text><rect x="380" y="90" width="46" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="403.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4</text><rect x="426" y="90" width="46" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="449.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="380" y="130" width="46" height="40" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="403.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">7</text><rect x="426" y="130" width="46" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="449.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><text x="426.0" y="190.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">A @ B</text><text x="530.0" y="110.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">entry (1, 0):</text><text x="530.0" y="140.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">row 1 of A = [1, 3]</text><text x="530.0" y="165.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#d97706">col 0 of B = [1, 2]</text><text x="530.0" y="195.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#16a34a">1×1 + 3×2 = 7</text><text x="430.0" y="255.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">A * B is different: it multiplies matching positions → [[2 0] [2 3]]</text></svg>