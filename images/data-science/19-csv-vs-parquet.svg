<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" role="img" aria-labelledby="title"><title id="title">Row-based CSV vs column-based Parquet</title><rect x="0" y="0" width="860" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Row-based CSV vs column-based Parquet</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">To sum price, CSV must read every row; Parquet opens one compressed, typed column</text><text x="200.0" y="80.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">CSV: one line per row (all text)</text><rect x="60" y="95" width="280" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="200.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1,Pune,5,60</text><rect x="60" y="131" width="280" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="200.0" y="146.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2,Mumbai,1,2500</text><rect x="60" y="167" width="280" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="200.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3,Pune,1,1200</text><rect x="60" y="203" width="280" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="200.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">4,Pune,1,1800</text><text x="200.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">read everything, parse text every time</text><text x="630.0" y="80.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Parquet: one block per column (+ types)</text><rect x="430" y="95" width="100" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="480.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">order_id</text><rect x="530" y="95" width="70" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="565.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">int64</text><rect x="600" y="95" width="220" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="710.0" y="110.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1 2 3 4</text><rect x="430" y="131" width="100" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="480.0" y="146.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">city</text><rect x="530" y="131" width="70" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="565.0" y="146.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">str</text><rect x="600" y="131" width="220" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="710.0" y="146.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Pune Mumbai Pune Pune</text><rect x="430" y="167" width="100" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="480.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">qty</text><rect x="530" y="167" width="70" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="565.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">int64</text><rect x="600" y="167" width="220" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="710.0" y="182.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">5 1 1 1</text><rect x="430" y="203" width="100" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="480.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">price</text><rect x="530" y="203" width="70" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="565.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">int64</text><rect x="600" y="203" width="220" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="710.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">60 2500 1200 1800</text><text x="630.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">read only the price block; compressed; types kept</text></svg>