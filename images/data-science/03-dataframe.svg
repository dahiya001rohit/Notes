<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title"><title id="title">A DataFrame: an index of row labels on the left, named columns, each column a Series with its own dtype</title><defs></defs><rect x="0" y="0" width="760" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A DataFrame is a table of Series</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Every column is a Series (one type); all columns share the row index.</text><rect x="110" y="96" width="120" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="170.0" y="109.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">product</text><rect x="230" y="96" width="120" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="290.0" y="109.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">category</text><rect x="350" y="96" width="90" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="395.0" y="109.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">price</text><rect x="440" y="96" width="80" height="26" rx="4" fill="#f1f5f9" stroke="#94