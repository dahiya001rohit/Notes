<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title"><title id="title">Anatomy of a Matplotlib figure: the figure contains axes; each axes has a title, x and y axis labels, ticks, a legend and plotted data</title><defs></defs><rect x="0" y="0" width="760" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="24" y="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Anatomy of a Matplotlib chart</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">fig, ax = plt.subplots(): the Figure holds one or more Axes (charts).</text><rect x="30" y="70" width="700" height="270" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="44" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#64748b">Figure (fig)</text><rect x="120" y="110" width="400" height="190" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="128" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#2563eb">Axes (ax)</text><text x="320" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ax.set_title("Sales are rising")</text><path d="M140,270 L190,250 L240,258 L290,220 L340,210 L390,180 L440,170 L490,140" fill="none" stroke="#2563eb" stroke-width="2.5"/><circl