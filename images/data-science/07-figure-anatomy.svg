ont-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">29</text><line x1="114" y1="290" x2="120" y2="290" stroke="#0f172a" stroke-width="1.2"/><text x="108" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#0f172a">100</text><line x1="114" y1="240" x2="120" y2="240" stroke="#0f172a" stroke-width="1.2"/><text x="108" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#0f172a">120</text><line x1="114" y1="190" x2="120" y2="190" stroke="#0f172a" stroke-width="1.2"/><text x="108" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#0f172a">140</text><line x1="114" y1="140" x2="120" y2="140" stroke="#0f172a" stroke-width="1.2"/><text x="108" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="end" dominant-baseline="middle" fill="#0f172a">160</text><text x="320" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ax.set_xlabel("Day")</text><text x="0" y="0" transform="translate(58 205) rotate(-90)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">ax.set_ylabel(...)</text><rect x="390" y="230" width="120" height="50" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><line x1="398" y1="245" x2="420" y2="245" stroke="#2563eb" stroke-width="2.5"/><text x="426" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">units sold</text><line x1="398" y1="265" x2="420" y2="265" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="426" y="265" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">trend</text><text x="560" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">• title</text><text x="560" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#2563eb">• data: ax.plot(x, y)</text><text x="560" y="190" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">• legend: ax.legend()</text><text x="560" y="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">• ticks and tick labels</text><text x="560" y="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">• x axis / y axis</text><text x="560" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">• fig.savefig("chart.png")</text></svg>