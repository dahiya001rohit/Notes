<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-labelledby="title"><title id="title">A missing value: drop, fill, or keep and flag</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="880" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A missing value: drop, fill, or keep and flag</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Decide per column, based on WHY the value is missing</text><rect x="30" y="90" width="50" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="55.0" y="106.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">id</text><rect x="80" y="90" width="90" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="125.0" y="106.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">city</text><rect x="170" y="90" width="90" height="32" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="215.0" y="106.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">income</text><rect x="30" y="122" width="50" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="55.0" y="138.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">1</text><rect x="80" y="122" width="90" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="125.0" y="138.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Pune</text><rect x="170" y="122" width="90" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="215.0" y="138.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">52000</text><rect x="30" y="154" width="50" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="55.0" y="170.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">2</text><rect x="80" y="154" width="90" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="125.0" y="170.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">NaN</text><rect x="170" y="154" width="90" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="215.0" y="170.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">NaN</text><rect x="30" y="186" width="50" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="55.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">3</text><rect x="80" y="186" width="90" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="125.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Mumbai</text><rect x="170" y="186" width="90" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="215.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">61000</text><line x1="270.0" y1="140.0" x2="316.0" y2="100.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="320" y="72" width="80" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="360.0" y="100.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">drop</text><text x="415.0" y="88.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">dropna(subset=[&#x27;income&#x27;])</text><text x="415.0" y="110.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">row 2 removed: fine if few rows</text><text x="415.0" y="125.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">and missing at random</text><line x1="270.0" y1="140.0" x2="316.0" y2="170.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="320" y="142" width="80" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="360.0" y="170.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">fill</text><text x="415.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">fillna(median) / &#x27;Unknown&#x27; / 0</text><text x="415.0" y="180.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">income 2 → 56500, city → Unknown</text><text x="415.0" y="195.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">(median is robust to extremes)</text><line x1="270.0" y1="140.0" x2="316.0" y2="240.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="320" y="212" width="80" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="360.0" y="240.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">flag</text><text x="415.0" y="228.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">income_missing = isna()</text><text x="415.0" y="250.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">keep the fact it was missing;</text><text x="415.0" y="265.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">vital when missingness means something</text></svg>