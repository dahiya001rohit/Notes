<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="title"><title id="title">Kinds of data</title><rect x="0" y="0" width="900" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Kinds of data</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The kind of a column decides which summaries, charts and models make sense</text><rect x="370" y="70" width="160" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="450.0" y="90.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">a column</text><rect x="100" y="140" width="160" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="180.0" y="159.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Numerical</text><line x1="450.0" y1="110.0" x2="180.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8"/><rect x="60" y="210" width="115" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="117.5" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Continuous</text><text x="117.0" y="262.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sa