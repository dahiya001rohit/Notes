<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-labelledby="title"><title id="title">Let the database do the heavy lifting</title><defs><marker id="a16a34a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="860" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Let the database do the heavy lifting</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Filter, join and aggregate in SQL; bring only the small result into pandas</text><rect x="40" y="90" width="200" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="140.0" y="115.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Database</text><text x="140.0" y="145.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">orders: 50 million rows</text><text x="140.0" y="170.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">fast at WHERE / GROUP BY</text><rect x="300" y="95" width="260" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="430.0" y="113.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">SELECT city,</text><text x="430.0" y="129.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">  SUM(qty*price) AS revenue</text><text x="430.0" y="145.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">FROM orders</text><text x="430.0" y="160.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">WHERE date &gt;= :start</text><text x="430.0" y="176.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">GROUP BY city</text><line x1="240.0" y1="145.0" x2="296.0" y2="145.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><line x1="560.0" y1="145.0" x2="616.0" y2="145.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a16a34a)"/><rect x="620" y="90" width="200" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="720.0" y="115.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">pandas</text><text x="720.0" y="145.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">4 rows × 2 columns</text><text x="720.0" y="170.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">charts, stats, models</text><text x="430.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">pd.read_sql(query, con, params={&#x27;start&#x27;: &#x27;2025-01-01&#x27;})</text></svg>