<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="title"><title id="title">A notebook: cells send code to one kernel</title><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0" y="0" width="820" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">A notebook: cells send code to one kernel</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">The kernel remembers every variable until you restart it</text><text x="40.0" y="98.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">[1]</text><rect x="70" y="80" width="330" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="235.0" y="97.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x = 5</text><text x="80.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#94a3b8">(no output)</text><line x1="402.0" y1="97.0" x2="548.0" y2="160.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><text x="40.0" y="164.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">[2]</text><rect x="70" y="146" width="330" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="235.0" y="163.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">prices = [60, 2500, 1200]</text><text x="80.0" y="196.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#94a3b8">(no output)</text><line x1="402.0" y1="163.0" x2="548.0" y2="160.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><text x="40.0" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">[3]</text><rect x="70" y="212" width="330" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/><text x="235.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">sum(prices) * x</text><text x="80.0" y="262.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#16a34a">18800</text><line x1="402.0" y1="229.0" x2="548.0" y2="160.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><rect x="550" y="100" width="230" height="130" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="665.0" y="122.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Kernel (Python process)</text><text x="665.0" y="155.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">x = 5</text><text x="665.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">prices = [60, 2500, 1200]</text><text x="665.0" y="207.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">memory survives deleted cells</text><text x="410.0" y="285.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Restart kernel and run all = the only honest test that a notebook works top to bottom</text></svg>