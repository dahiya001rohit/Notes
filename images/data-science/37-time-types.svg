<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-labelledby="title"><title id="title">Three kinds of time</title><defs><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0" y="0" width="900" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Three kinds of time</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Timestamp = a moment · Timedelta = a duration · Period = a whole span</text><line x1="50.0" y1="160.0" x2="850.0" y2="160.0" stroke="#94a3b8" stroke-width="1.8"/><line x1="70.0" y1="155.0" x2="70.0" y2="165.0" stroke="#94a3b8" stroke-width="1.8"/><text x="70.0" y="182.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">1 Mar</text><line x1="220.0" y1="155.0" x2="220.0" y2="165.0" stroke="#94a3b8" stroke-width="1.8"/><text x="220.0" y="182.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">8 Mar</text><line x1="370.0" y1="155.0" x2="370.0" y2="165.0" stroke="#94a3b8" stroke-width="1.8"/><text x="370.0" y="182.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">15 Mar</text><line x1="520.0" y1="155.0" x2="520.0" y2="165.0" stroke="#94a3b8" stroke-width="1.8"/><text x="520.0" y="182.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">22 Mar</text><line x1="670.0" y1="155.0" x2="670.0" y2="165.0" stroke="#94a3b8" stroke-width="1.8"/><text x="670.0" y="182.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">29 Mar</text><line x1="820.0" y1="155.0" x2="820.0" y2="165.0" stroke="#94a3b8" stroke-width="1.8"/><text x="820.0" y="182.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">5 Apr</text><rect x="70" y="120" width="664" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="420.0" y="135.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Period(&#x27;2025-03&#x27;, &#x27;M&#x27;): the whole of March</text><circle cx="357.0" cy="160.0" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><text x="357.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#2563eb">Timestamp(&#x27;2025-03-14 09:30&#x27;)</text><line x1="357.0" y1="108.0" x2="357.0" y2="150.0" stroke="#2563eb" stroke-width="1.8"/><line x1="357.0" y1="215.0" x2="507.0" y2="215.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#ad97706)"/><line x1="507.0" y1="215.0" x2="357.0" y2="215.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#ad97706)"/><text x="432.0" y="235.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#d97706">Timedelta(&#x27;7 days&#x27;)</text><text x="450.0" y="258.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">store moments in UTC; convert to local time only for display</text></svg>