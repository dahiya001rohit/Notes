<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-labelledby="title"><title id="title">Split first, then learn from the training rows only</title><defs><marker id="ad97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><defs><marker id="a2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="880" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Split first, then learn from the training rows only</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">fit = learn numbers (median, mean, std, category list) · transform = apply them</text><rect x="30" y="110" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="95.0" y="140.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">all rows</text><line x1="160.0" y1="125.0" x2="220.0" y2="95.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><line x1="160.0" y1="155.0" x2="220.0" y2="200.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="225" y="70" width="140" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="295.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">train (70%)</text><rect x="225" y="180" width="140" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="295.0" y="205.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">test (30%)</text><line x1="365.0" y1="95.0" x2="425.0" y2="95.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><rect x="430" y="65" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="530.0" y="87.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">fit: median age, mean/std</text><text x="530.0" y="102.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">of log spend, city list</text><line x1="630.0" y1="95.0" x2="690.0" y2="95.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a2563eb)"/><line x1="630.0" y1="110.0" x2="690.0" y2="195.0" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a2563eb)"/><rect x="695" y="70" width="160" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="775.0" y="95.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">transform train</text><rect x="695" y="180" width="160" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="775.0" y="205.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">transform test</text><line x1="365.0" y1="205.0" x2="690.0" y2="205.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#ad97706)"/><text x="527.0" y="225.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#d97706">test rows never influence the fitted numbers</text><text x="440.0" y="275.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#dc2626">Leakage = fitting on all rows (or on future events): the model looks better in testing than in real use</text></svg>