<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="title"><title id="title">Lazy Polars: plan first, then run</title><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0" y="0" width="900" height="260" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Lazy Polars: plan first, then run</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">scan → steps build a plan → optimiser pushes the filter and column choice into the reader → collect()</text><rect x="25" y="85" width="148.0" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="99.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">scan_parquet(path)</text><line x1="173.0" y1="105.0" x2="187.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="186.0" y="85" width="176.0" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="274.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">filter(city == &#x27;Pune&#x27;)</text><line x1="362.0" y1="105.0" x2="376.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="375.0" y="85" width="169.0" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="459.5" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">with_columns(revenue)</text><line x1="544.0" y1="105.0" x2="558.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="557.0" y="85" width="176.0" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="645.0" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">group_by(...).agg(...)</text><line x1="733.0" y1="105.0" x2="747.0" y2="105.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a94a3b8)"/><rect x="746.0" y="85" width="85.0" height="40" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.8"/><text x="788.5" y="105.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">collect()</text><rect x="60" y="160" width="780" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/><text x="450.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">optimised plan: Parquet SCAN reads 4 of 5 columns, with SELECTION city == &#x27;Pune&#x27;</text><text x="450.0" y="205.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">(predicate pushdown + projection pushdown, run on all CPU cores)</text></svg>