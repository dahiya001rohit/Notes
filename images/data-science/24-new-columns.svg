<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-labelledby="title"><title id="title">Making a new column: fastest to slowest</title><rect x="0" y="0" width="860" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">Making a new column: fastest to slowest</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Prefer whole-column operations; apply runs a Python function per value or per row</text><rect x="40" y="75" width="600" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="50.0" y="89.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">df[&#x27;qty&#x27;] * df[&#x27;price&#x27;]</text><text x="655.0" y="89.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">vectorised arithmetic</text><rect x="40" y="111" width="560" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="50.0" y="125.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">df[&#x27;date&#x27;].dt.month, .str.lower()</text><text x="615.0" y="125.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">accessors</text><rect x="40" y="147" width="520" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="50.0" y="161.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">np.where / np.select</text><text x="575.0" y="161.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">vectorised if / else</text><rect x="40" y="183" width="480" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="50.0" y="197.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">s.map({&#x27;Pune&#x27;: &#x27;West&#x27;})</text><text x="535.0" y="197.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">lookup table</text><rect x="40" y="219" width="260" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="50.0" y="233.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">s.apply(func)</text><text x="315.0" y="233.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Python function per value</text><rect x="40" y="255" width="215" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="50.0" y="269.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#0f172a">df.apply(func, axis=1)</text><text x="270.0" y="269.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">Python function per ROW</text><text x="430.0" y="304.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#64748b">bar length ≈ speed (row-wise apply is often 1,000× slower than arithmetic)</text></svg>