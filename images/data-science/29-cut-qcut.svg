<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="title"><title id="title">cut vs qcut</title><rect x="0" y="0" width="880" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="24.0" y="26.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle" fill="#0f172a">cut vs qcut</text><text x="24.0" y="48.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#64748b">cut: edges you choose (meaningful ranges)  ·  qcut: edges at quantiles (equal-sized groups)</text><text x="30.0" y="80.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="start" dominant-baseline="middle" fill="#0f172a">pd.cut(p, [0, 500, 2000, inf])  →  3 · 3 · 2 rows</text><line x1="60.0" y1="110.0" x2="820.0" y2="110.0" stroke="#94a3b8" stroke-width="1.8"/><line x1="206.2" y1="92.0" x2="206.2" y2="132.0" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="644.6" y1="92.0" x2="644.6" y2="132.0" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="77.5" cy="110.0" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="133.1" cy="110.0" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="162.3" cy="110.0" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="323.1" cy="110.0" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="410.8" cy="110.0" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="586.2" cy="110.0" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="790.8" cy="110.0" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><circle cx="796.8" cy="110.0" r="7" fill